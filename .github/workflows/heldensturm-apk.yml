# Baut Heldensturm als Android-App (offline, alle Dateien in der APK) und stellt sie als Release bereit:
# github.com/gansklebrig/Imres-tales-Public/releases → Heldensturm.apk (Obtainium findet Updates dort).
name: Heldensturm-App bauen

on:
  push:
    branches: [main]
    paths:
      - heldensturm.html
      - heldensturm-erzaehler.js
      - heldensturm-sw.js
      - "audio/heldensturm/**"
      - "klang/**"
      - "heldensturm-clips/**"
      - "tools/vertonung/heldensturm-de.json"
      - "android/**"
      - "tools/android/**"
      - ".github/workflows/heldensturm-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: heldensturm-apk
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /android/
            /tools/android/
            /tools/vertonung/heldensturm-de.json
            /heldensturm*
            /klang/
            /amb/
            /audio/heldensturm/
            /heldensturm-clips/
            /schriften/
            /vendor/
            /kuerzel.js
            /inhalt.js
            /*-frei.webp

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Version festlegen
        run: echo "HS_VERSION=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Spieldateien einpacken
        run: python3 tools/android/sammeln.py

      - name: Signaturschlüssel entschlüsseln
        env:
          HELDENSTURM_SCHLUESSEL: ${{ secrets.HELDENSTURM_SCHLUESSEL }}
          SCHLUESSEL_VAR: ${{ vars.HELDENSTURM_SCHLUESSEL }}
        run: |
          [ -z "$HELDENSTURM_SCHLUESSEL" ] && HELDENSTURM_SCHLUESSEL="$SCHLUESSEL_VAR"
          echo "schluessel_laenge=${#HELDENSTURM_SCHLUESSEL} als_variable=$([ -n "$SCHLUESSEL_VAR" ] && echo ja || echo nein)" > namen.txt
          HELDENSTURM_SCHLUESSEL="$(printf '%s' "$HELDENSTURM_SCHLUESSEL" | tr -d '[:space:]')"
          if [ -z "$HELDENSTURM_SCHLUESSEL" ]; then
            echo "::warning::Secret HELDENSTURM_SCHLUESSEL fehlt (Settings → Secrets and variables → Actions) – Probebau ohne Release."
            exit 0
          fi
          echo "HS_SIGNIERT=1" >> "$GITHUB_ENV"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in android/keystore/heldensturm.jks.enc -out android/keystore/heldensturm.jks -pass env:HELDENSTURM_SCHLUESSEL

      - name: APK bauen
        working-directory: android
        run: set -o pipefail; gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee ../bau.log

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/release/app-release.apk Heldensturm.apk && ls -la Heldensturm.apk

      - name: Probebau sichern
        if: env.HS_SIGNIERT != '1'
        uses: actions/upload-artifact@v4
        with:
          name: Heldensturm-probe
          path: Heldensturm.apk
          retention-days: 3

      - name: Als Release veröffentlichen
        if: env.HS_SIGNIERT == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: heldensturm-1.${{ env.HS_VERSION }}
          name: Heldensturm 1.${{ env.HS_VERSION }}
          body: |
            ${{ github.event.head_commit.message }}

            Installieren: unten auf **Heldensturm.apk** tippen, herunterladen und öffnen. Läuft offline, mit Controller.
          files: Heldensturm.apk
          make_latest: true

      - name: Alte App-Versionen aufräumen (die letzten 3 bleiben)
        if: env.HS_SIGNIERT == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("heldensturm-1."))] | sort_by(.createdAt) | reverse | .[3:] | .[].tagName' |
          while read -r t; do gh release delete "$t" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true; done

      - name: Baustand melden (Zweig heldensturm-app-stand)
        if: always()
        run: |
          mkdir -p /tmp/st && cd /tmp/st && git init -q -b heldensturm-app-stand
          { echo "lauf=${GITHUB_RUN_NUMBER} ergebnis=${{ job.status }} signiert=${HS_SIGNIERT:-0} commit=${GITHUB_SHA}"; ls -la "$GITHUB_WORKSPACE/Heldensturm.apk" 2>&1; } > STAND.txt
          cat "$GITHUB_WORKSPACE/namen.txt" >> STAND.txt 2>/dev/null || true
          tail -c 20000 "$GITHUB_WORKSPACE/bau.log" > bau.log 2>/dev/null || true
          git add . && git -c user.name=Heldensturm-App -c user.email=actions@users.noreply.github.com commit -q -m "Stand ${GITHUB_RUN_NUMBER}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" heldensturm-app-stand
