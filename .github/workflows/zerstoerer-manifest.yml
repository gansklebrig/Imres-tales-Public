# Hält zerstoerer/dateien.json aktuell – die Dateiliste (SHA-256, Größe), mit der das PC-Programm „Ezekiel – The Destroyer“
# Spiel-Updates ohne Neuinstallation lädt. Läuft bei jeder Änderung an den Spieldateien auf main, erzeugt die Liste neu
# (tools/zerstoerer/manifest.py, deterministisch) und committet sie nur, wenn sie sich geändert hat.
# Kein Endlos-Lauf: dateien.json selbst löst den Lauf nicht aus, Pushes mit GITHUB_TOKEN starten keine Workflows,
# und Läufe des Bots werden übersprungen.
name: Zerstörer-Dateiliste aktualisieren

on:
  push:
    branches: [main]
    paths:
      - zerstoerer.html
      - "zerstoerer/**"
      - "!zerstoerer/dateien.json"
      - tonregler.js
      - favicon.svg
      - "schriften/**"
      - "klang/**"
      - "amb/**"
      - "tools/zerstoerer/**"
      - "!tools/zerstoerer/tests/**"   # Tests allein lösen keinen Neubau aus (W48)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zerstoerer-manifest
  cancel-in-progress: true

jobs:
  liste:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /tools/zerstoerer/
            /zerstoerer.html
            /zerstoerer/
            /tonregler.js
            /favicon.svg
            /schriften/
            /klang/
            /amb/

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Liste erzeugen und bei Änderung committen
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for versuch in 1 2 3; do
            python tools/zerstoerer/manifest.py
            if git diff --quiet -- zerstoerer/dateien.json && [ -z "$(git ls-files --others --exclude-standard zerstoerer/dateien.json)" ]; then
              echo "Dateiliste unverändert."; exit 0
            fi
            git add zerstoerer/dateien.json
            git commit -q -m "Zerstörer: Dateiliste für Spiel-Updates aktualisiert"
            if git push -q origin HEAD:main; then
              # Seite neu bauen lassen (falls Pushes des Bots keinen Pages-Bau auslösen); Fehler hier sind unkritisch
              gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" >/dev/null 2>&1 || true
              echo "Dateiliste committet."; exit 0
            fi
            echo "main hat sich bewegt – neu aufsetzen (Versuch $versuch)"
            git fetch -q origin main && git reset -q --hard origin/main
          done
          exit 1
