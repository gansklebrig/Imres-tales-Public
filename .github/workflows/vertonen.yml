name: Vertonung (ElevenLabs)
on:
  workflow_dispatch:
    inputs:
      modus:
        description: "proben = Hörproben, chronik = Chronik vertonen"
        default: proben
        type: choice
        options: [proben, feinschliff, text, chronik, zeilen, katalog]
      sprache:
        description: "de oder en"
        default: de
      stimme:
        description: "voice_id (nur für chronik)"
        default: ""
      modell:
        description: "ElevenLabs-Modell"
        default: eleven_multilingual_v2
      einstellung:
        description: "voice_settings als JSON (leer = Standard)"
        default: ""
      quelle:
        description: "zeilen: JSON-Datei mit Zeilen (z. B. tools/vertonung/heldensturm-de.json); proben: nur eigene Stimmen, wenn leer"
        default: ""
      text:
        description: "nur für modus=text: Text (mit Regie-Tags für eleven_v3)"
        default: ""
      name:
        description: "nur für modus=text: Dateiname"
        default: "text"
      grenze:
        description: "höchstens so viele Zeichen in diesem Lauf (0 = alles)"
        default: "0"
permissions:
  contents: write
concurrency:
  group: vertonung
  cancel-in-progress: false
jobs:
  vertonen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: ffmpeg
        run: which ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg)
      - name: Vertonen
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          SPRACHE: ${{ inputs.sprache }}
          STIMME: ${{ inputs.stimme }}
          MODELL: ${{ inputs.modell }}
          GRENZE: ${{ inputs.grenze }}
          EINSTELLUNG: ${{ inputs.einstellung }}
          NUR_EIGENE: "1"
          QUELLE: ${{ inputs.quelle }}
          TEXT: ${{ inputs.text }}
          NAME: ${{ inputs.name }}
        run: |
          git config user.name "Vertonung"
          git config user.email "actions@users.noreply.github.com"
          python3 tools/vertonung/vertonen.py ${{ inputs.modus }}
