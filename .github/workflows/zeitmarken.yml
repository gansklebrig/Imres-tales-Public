name: Zeitmarken (Hörbuch)
on:
  workflow_dispatch:
    inputs:
      modell: { description: "Whisper-Modell", default: "small" }
permissions: { contents: write }
jobs:
  marken:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install faster-whisper==1.0.3 requests
      - run: python tools/vertonung/zeitmarken.py "${{ inputs.modell }}"
      - run: |
          git config user.name "zeitmarken-bot"; git config user.email "actions@github.com"
          mv zeitmarken-de.json /tmp/z.json
          git checkout --orphan zeitmarken; git rm -rq --cached . ; git clean -fdxq -e .git
          cp /tmp/z.json zeitmarken-de.json; git add zeitmarken-de.json
          git commit -qm "Zeitmarken"; git push -f origin zeitmarken
