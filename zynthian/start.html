<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Imres Bühne</title>
<style>html,body{margin:0;height:100%;background:#0b0908;color:#ebe2cc;font:600 20px system-ui,sans-serif;display:flex;align-items:center;justify-content:center}</style></head>
<body><div>🎻 Imres Tales …</div>
<script>
/* Startseite des Kiosks: einmalig sinnvolle Grundeinstellungen, dann zum zuletzt benutzten Modus */
(() => {
  const setz = (k, v) => { try { if (localStorage.getItem(k) == null) localStorage.setItem(k, v); } catch (_) {} };
  setz("imres-lw-intro", "1");        /* keine Einführung */
  setz("imres-lw-rundgang", "1");
  setz("imres-lw-modus", "einfach");  /* einfache Ansicht der Bühne */
  setz("imres-lang", "de");
  /* Leistung wählt der Nutzer selbst (MENU → Leistung); bis dahin volle Qualität */
  try { if (!localStorage.getItem("imres-zp-leistung-gewaehlt")) { localStorage.setItem("imres-lw-leicht", "0"); localStorage.setItem("imres-lw-spar", "0"); localStorage.setItem("imres-lw-mittel", "0"); } } catch (_) {}
  try { sessionStorage.setItem("imres-zyn", "1"); } catch (_) {}
  let m = "buehne"; try { m = localStorage.getItem("imres-zyn-modus") || "buehne"; } catch (_) {}
  const h = /[?&]hinter/.test(location.search) ? "&hinter=1" : "";
  location.replace(m === "welten" ? "/ambient.html?zyn=1" + h : "/index.html?zyn=1" + h + "#buehne");
})();
</script></body></html>
