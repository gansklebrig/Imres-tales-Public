<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Imres Fernbedienung</title>
<meta name="theme-color" content="#120e18">
<style>
:root{--bg:#120e18;--panel:#1d1726;--line:#3a2f45;--ink:#ebe2cc;--mute:#a89f8f;--gold:#e0a046}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.3 system-ui,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
main{max-width:520px;margin:0 auto;padding:12px 14px 30px}
h1{font-size:19px;margin:4px 0 2px;color:var(--gold)}
#status{font-size:14px;color:var(--mute);min-height:2.6em}
.gitter{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
button{appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:12px 4px;font:600 14px/1.15 system-ui,sans-serif;touch-action:manipulation}
button:active{background:#3a2a14;border-color:var(--gold)}
button small{display:block;font-weight:400;font-size:11px;color:var(--mute);margin-top:2px}
.gross{font-size:18px}
.f{border-color:#6a4a18}
.pfeile{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:270px;margin:10px auto}
.pfeile button{padding:16px 0;font-size:20px}
.dreh{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.dreh div{display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:center;font-size:12px;color:var(--mute)}
.dreh button{padding:10px 0;font-size:18px}
h2{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:18px 0 6px}
.system{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.alt.an{background:#4a1a4a;border-color:#c040c0}
</style></head>
<body><main>
<h1>🎻 Imres · Fernbedienung</h1>
<div id="status">…</div>

<div class="gitter">
  <button class="gross" data-t="PLAY">▶■<small>Spielen</small></button>
  <button class="gross" data-t="STOP">✕<small>Alles aus</small></button>
  <button data-t="PAD">⚡<small>Passiert</small></button>
  <button data-t="REC">🤫<small>Stille</small></button>
  <button class="f" data-t="F1">F1</button><button class="f" data-t="F2">F2</button><button class="f" data-t="F3">F3</button><button class="f" data-t="F4">F4</button>
  <button data-t="ZS3">⏭<small>Stimmung</small></button>
  <button data-t="CTRL">🌲⏭<small>Ort</small></button>
  <button data-t="TEMPO">🎲<small>Neu besetzen</small></button>
  <button class="alt" id="alt">ALT<small>2. Belegung</small></button>
  <button data-t="MENU">☰<small>Modus</small></button>
  <button data-t="MENU" data-art="lang">⚙<small>System</small></button>
  <button data-t="MIXER">⟲<small>Reglerbank</small></button>
  <button data-t="BACK">↩<small>Zurück</small></button>
</div>

<div class="pfeile">
  <span></span><button data-t="UP">▲</button><span></span>
  <button data-t="LEFT">◀</button><button data-t="SEL">●</button><button data-t="RIGHT">▶</button>
  <span></span><button data-t="DOWN">▼</button><span></span>
</div>

<h2>Drehregler</h2>
<div class="dreh">
  <div>1<button data-d="0" data-w="1">＋</button><button data-d="0" data-w="-1">－</button></div>
  <div>2<button data-d="1" data-w="1">＋</button><button data-d="1" data-w="-1">－</button></div>
  <div>3<button data-d="2" data-w="1">＋</button><button data-d="2" data-w="-1">－</button></div>
  <div>4<button data-d="3" data-w="1">＋</button><button data-d="3" data-w="-1">－</button></div>
</div>

<h2>System</h2>
<div class="system">
  <button data-s="imres">🎻 Imres-Bühne starten</button>
  <button data-s="zynthian">🎛 Zurück zum Zynthian</button>
  <button data-s="seite-neu">🔄 Seite neu laden</button>
  <button data-s="aktualisieren">⬇ Imres aktualisieren<small>braucht Internet</small></button>
  <button data-s="neustart">↻ Neu starten</button>
  <button data-s="aus">⏻ Ausschalten</button>
</div>
</main>
<script>
const post = (u, d) => fetch(u, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(d) }).catch(() => {});
let alt = false;
document.addEventListener("click", e => {
  const t = e.target.closest("[data-t]");
  if (t) { post("/zyn/taste", { name: t.dataset.t, art: t.dataset.art || "kurz" }); if (navigator.vibrate) navigator.vibrate(15); return; }
  if (e.target.closest("#alt")) { alt = !alt; e.target.closest("#alt").classList.toggle("an", alt); post("/zyn/taste", { name: "ALT", art: alt ? "druck" : "los" }); return; }
  const d = e.target.closest("[data-d]");
  if (d) { post("/zyn/dreh", { nr: +d.dataset.d, d: +d.dataset.w }); return; }
  const s = e.target.closest("[data-s]");
  if (s) {
    const frage = { aus: "Wirklich ausschalten?", neustart: "Wirklich neu starten?", zynthian: "Zur Zynthian-Oberfläche wechseln?" }[s.dataset.s];
    if (frage && !confirm(frage)) return;
    post("/zyn/system", { aktion: s.dataset.s }).then(() => status());
  }
});
async function status() {
  try {
    const r = await fetch("/zyn/status", { cache: "no-store" }); const j = await r.json();
    const m = j.modus === "imres" ? "🎻 Imres-Bühne läuft" : j.modus === "zynthian" ? "🎛 Zynthian-Oberfläche läuft" : "?";
    document.getElementById("status").textContent = m + (j.modus === "imres" && j.text ? " · " + j.text : "");
  } catch (_) { document.getElementById("status").textContent = "keine Verbindung"; }
}
status(); setInterval(status, 3000);
</script>
</body></html>
