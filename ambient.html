<style>
/* Ruhig und reizarm: dunkles Pergament, keine Bewegung außer einem sanften Glimmen bei der laufenden Klangwelt. */
:root{
  color-scheme:dark;
  --ink:#100c12;--panel:#1a1419;--panel2:#231b22;--line:#3a2f37;--text:#efe5d2;--mute:#a8998a;--ember:#e0a046;--night:#0b080d;
  --fd:'IM Fell English','Palatino Linotype',Palatino,Georgia,serif;--fb:'Alegreya Sans','Trebuchet MS',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--text)}
body{font-family:var(--fb);font-size:16px;line-height:1.5;padding-bottom:calc(6.5rem + env(safe-area-inset-bottom,0px));
  background:radial-gradient(ellipse at 50% -10%,rgba(224,160,70,.08),transparent 60%),var(--ink)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--ember);outline-offset:2px}
.wrap{max-width:62rem;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px))}
header.kopf{padding:1.6rem 0 1rem}
.zurueck{color:var(--mute);text-decoration:none;font-size:.9rem}
.zurueck:hover{color:var(--ember)}
h1{font-family:var(--fd);font-weight:400;font-size:clamp(2rem,6vw,2.8rem);margin:.4rem 0 .2rem;color:var(--text)}
.unter{color:var(--mute);margin:0;max-width:40rem}
.welten{display:grid;grid-template-columns:repeat(auto-fill,minmax(11.5rem,1fr));gap:.6rem;margin:1.2rem 0}
@media (max-width:520px){.welten{grid-template-columns:1fr 1fr;gap:.45rem}}
.welt{position:relative;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:.8rem .85rem .75rem;min-height:6.4rem;display:flex;flex-direction:column;gap:.15rem;transition:border-color .3s,background .3s}
.welt:hover{border-color:rgba(224,160,70,.6)}
.welt .sym{font-size:1.5rem;line-height:1}
.welt .nm{font-family:var(--fd);font-size:1.18rem;line-height:1.15;margin-top:.2rem}
.welt .tx{font-size:.8rem;color:var(--mute);line-height:1.3}
.welt.an{border-color:var(--ember);background:linear-gradient(180deg,rgba(224,160,70,.14),var(--panel));box-shadow:0 0 0 1px var(--ember) inset}
.welt.an::after{content:"";position:absolute;top:.7rem;right:.7rem;width:.55rem;height:.55rem;border-radius:50%;background:var(--ember);box-shadow:0 0 10px var(--ember);animation:glimm 2.6s ease-in-out infinite}
.welt.laedt::after{content:"…";position:absolute;top:.4rem;right:.7rem;color:var(--ember);background:none;box-shadow:none;width:auto;height:auto}
@keyframes glimm{50%{opacity:.35}}
.misch{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:1rem 1rem .6rem;margin:1rem 0 0}
.misch h2{font-family:var(--fd);font-weight:400;font-size:1.3rem;margin:0 0 .6rem;display:flex;align-items:center;gap:.5rem}
.misch h2 small{font-family:var(--fb);font-size:.8rem;color:var(--mute)}
.regler{display:grid;grid-template-columns:minmax(6.5rem,10rem) 1fr 2.6rem;align-items:center;gap:.6rem;padding:.25rem 0;font-size:.92rem}
.regler span{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.regler b{font-weight:500;color:var(--mute);font-size:.8rem;text-align:right}
.regler input{width:100%;accent-color:var(--ember)}
.kopfzeile{display:flex;justify-content:space-between;align-items:center;gap:.5rem}
.tour{position:fixed;inset:0;z-index:10000}
.tour-loch{position:fixed;border-radius:12px;box-shadow:0 0 0 200vmax rgba(6,4,8,.72),0 0 0 2px var(--ember),0 0 24px rgba(224,160,70,.45);transition:all .3s ease;pointer-events:none}
.tour-blase{position:fixed;width:min(21rem,calc(100vw - 20px));background:#1b151e;border:1px solid var(--ember);border-radius:12px;padding:.8rem .95rem .7rem;box-shadow:0 12px 34px rgba(0,0,0,.6);transition:top .3s ease,left .3s ease;outline:none}
.tour-blase h4{margin:.1rem 0 .3rem;font-size:1.1rem;color:var(--ember);font-weight:500}
.tour-blase p{margin:0 0 .5rem;font-size:.95rem;line-height:1.45}
.tour-blase small{color:var(--mute);font-size:.75rem}
.tour-k{display:flex;align-items:center;gap:.4rem}.tour-k span{flex:1}
.tour-k button{border:1px solid var(--line);background:none;border-radius:999px;padding:.35rem .8rem;color:var(--mute)}
.tour-k .los{border-color:var(--ember);background:var(--ember);color:var(--night)}
@media (prefers-reduced-motion:reduce){.tour-loch,.tour-blase{transition:none}}
.funk{margin:.4rem 0 0}
.funk-knopf{border:1px solid var(--line);background:none;border-radius:999px;padding:.4rem .9rem;color:var(--mute);font-size:.9rem}
.funk-knopf.an,.funk-knopf:hover{border-color:var(--ember);color:var(--ember)}
.funk-box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:.8rem 1rem;margin-top:.6rem}
.funk-zeile{display:flex;flex-wrap:wrap;gap:.5rem;margin:.5rem 0}
.funk-zeile input{flex:1 1 14rem;min-width:0;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:8px;padding:.45rem .6rem;color:var(--text);font-size:.85rem}
.funk-zeile button{border:1px solid var(--ember);background:none;color:var(--ember);border-radius:8px;padding:.45rem .8rem}
.hoerer{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:1.2rem 1rem;margin:1rem 0;text-align:center}
.hoerer .gross{font-size:2.6rem;line-height:1}
.hoerer h2{font-family:var(--fd);font-weight:400;font-size:1.6rem;margin:.4rem 0 .2rem}
.hoerer .zuhoeren{margin-top:.8rem;border:1px solid var(--ember);background:var(--ember);color:var(--night);border-radius:999px;padding:.7rem 1.6rem;font-size:1.05rem;font-weight:700}
.hoerer .zuhoeren.an{background:none;color:var(--ember)}
.trenn{border:0;border-top:1px solid var(--line);margin:.6rem 0}
.tipp{color:var(--mute);font-size:.82rem;margin:.4rem 0 .2rem}
footer{color:var(--mute);font-size:.8rem;line-height:1.5;padding:1rem 0 2rem}
footer a{color:var(--mute)}
footer h3{font-family:var(--fd);font-weight:400;color:var(--text);font-size:1.05rem;margin:0 0 .3rem}
.leiste{position:fixed;left:50%;bottom:max(.7rem,env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(40rem,calc(100% - 1.4rem));display:flex;align-items:center;gap:.7rem;padding:.5rem .7rem;border:1px solid rgba(224,160,70,.5);border-radius:999px;background:rgba(16,12,18,.95);box-shadow:0 10px 30px rgba(0,0,0,.6);z-index:5}
.spielen{width:2.9rem;height:2.9rem;flex:0 0 auto;border-radius:50%;border:1px solid var(--ember);background:var(--ember);color:var(--night);font-size:1.05rem}
.spielen.laeuft{background:none;color:var(--ember)}
.jetzt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.jetzt b{font-family:var(--fd);font-weight:400;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jetzt small{color:var(--mute);font-size:.76rem}
.laut{display:flex;align-items:center;gap:.35rem;flex:0 1 9rem;min-width:5.5rem;color:var(--mute)}
.laut input{width:100%;accent-color:var(--ember)}
@media (prefers-reduced-motion:reduce){.welt.an::after{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="kopf">
    <div class="kopfzeile"><a class="zurueck" href="index.html#lautenwerk" data-t="zurueck">← Zurück zum Lautenwerk</a><button type="button" class="funk-knopf" id="rundgang" data-t="rundgang">❔ Rundgang</button></div>

  </header>
  <main>
    <section class="funk" id="funk"></section>
    <section class="misch" id="misch" hidden></section>
    <div class="welten" id="welten"></div>

</div>

</div>

      '<hr class="trenn">' + regler("leben", T.leben, Math.round(wert(m.leben, 1) * 100), 0, 200) + regler("raum", T.raum, wert(m.raum, 50), 0, 100) +
      '<p class="tipp">' + esc(T.tippMisch) + "</p>";
  }
  function hoererZeichnen() {
    const d = hoerer.zuletzt, w = d && d.laeuft ? WELTEN.find(x => x.id === d.welt) : null;
    $("welten").innerHTML = ""; $("misch").hidden = true; $("funk").innerHTML = "";
    let box = document.getElementById("hoerer");
    if (!box) { box = document.createElement("section"); box.id = "hoerer"; box.className = "hoerer"; $("welten").before(box); }
    box.innerHTML = '<p class="tipp">' + esc(T.hTitel) + (hoerer.status === "fehler" ? " · 🔴 " + esc(T.fehler) : hoerer.status !== "ok" ? " · 🟡 " + esc(T.verbinde) : "") + "</p>" +
      (w ? '<div class="gross">' + w.sym + "</div><h2>" + esc(w.name) + '</h2><p class="tipp">' + esc(w.text) + "</p>" : '<p class="tipp">' + esc(T.hWarte) + "</p>") +
      '<button type="button" class="zuhoeren' + (hoerer.an ? " an" : "") + '">' + (hoerer.an ? T.hStumm : T.hZuhoeren) + "</button>" +
      '<p class="tipp"><a href="' + esc(location.pathname) + '" style="color:var(--mute)">' + esc(T.hSelbst) + "</a></p>";
    const sp = $("spielen"); sp.textContent = hoerer.an ? "❚❚" : "▶"; sp.classList.toggle("laeuft", hoerer.an);
    $("jetzt-name").textContent = w ? w.sym + " " + w.name : T.hTitel; $("jetzt-info").textContent = hoerer.an ? (w ? T.laeuft : T.hWarte) : "";
  }
  const regler = (k, name, v, lo, hi) => '<label class="regler"><span>' + esc(name) + '</span><input type="range" min="' + lo + '" max="' + hi + '" value="' + v + '" data-regler="' + k + '"><b>' + v + " %</b></label>";
  document.addEventListener("click", e => {
    const w = e.target.closest("[data-welt]");
    if (w && !hoerer) { const welt = WELTEN.find(x => x.id === w.dataset.welt); if (aktiv && aktiv.welt === welt) stoppen(); else weltStarten(welt); return; }
    if (e.target.closest("#spielen")) {
      if (hoerer) { hoererSchalten(); return; }
      if (aktiv) stoppen(); else weltStarten(WELTEN.find(x => x.id === merk.welt) || WELTEN[0]);
    }
  });
  document.addEventListener("input", e => {
    if (e.target.id === "gesamt") { merk.gesamt = +e.target.value; speichern(); if (gesamt) gesamt.gain.setTargetAtTime(lautWert(), ctx.currentTime, .05); return; }
    const k = e.target.dataset.regler; if (!k) return;
    const w = aktiv ? aktiv.welt : WELTEN.find(x => x.id === merk.welt); if (!w) return;
    const m = merk.mix[w.id] = merk.mix[w.id] || {}, v = +e.target.value;
    e.target.nextElementSibling.textContent = v + " %";
    if (k[0] === "b") {
      const i = +k.slice(1); m.b = m.b || []; m.b[i] = v / 100;
      if (aktiv && aktiv.welt === w) { const b = aktiv.betten[i]; b.regler = v / 100; b.drift = 0; b.out.gain.setTargetAtTime(b.grund * b.regler, ctx.currentTime, .1); }
    } else if (k === "leben") { m.leben = v / 100; if (aktiv && aktiv.welt === w) { aktiv.leben = m.leben; aktiv.naechst = {}; } }
    else if (k === "raum") { m.raum = v; if (ctx && aktiv && aktiv.welt === w) hallNass.gain.setTargetAtTime(v / 100 * 1.2, ctx.currentTime, .1); }
    speichern(); funkSenden();
  });
  $("gesamt").value = merk.gesamt != null ? merk.gesamt : 70;
  $("gesamt").setAttribute("aria-label", T.gesamt);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && ctx && aktiv && ctx.state === "suspended") ctx.resume(); });

  /* ---------- Mitlauschen: dieselbe Echtzeit-Verbindung wie im Lautenwerk (Supabase Realtime) ---------- */
  const SERVER = { url: "https://iszdxkwkgkksdemtqhwu.supabase.co", key: "sb_publishable_Bt3Vw5BSnLaVcTRPTS0ZsA_MeG6G2-Z" };
  let hoerer = null, funk = null, funkAuf = false;
  try { const c = new URLSearchParams(location.search).get("lauschen"); if (c && /^[a-z0-9]{4,16}$/i.test(c)) hoerer = { raum: c.toLowerCase(), an: false, zuletzt: null, status: "verbinde" }; } catch (_) {}
  function kanal(raum, rolle, beiNachricht, beiStatus) {
    let ws = null, ref = 0, joinRef = null, herz = null, zu = false, leute = {};
    const topic = "realtime:imres-klangwelten-" + raum;
    const roh = (event, payload, t) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ topic: t || topic, event, payload, ref: String(++ref), join_ref: t ? undefined : joinRef })); };
    const zaehlen = () => beiStatus("ok", Object.values(leute).filter(r => r === "hoerer").length);
    function auf() {
      beiStatus("verbinde");
      try { ws = new WebSocket(SERVER.url.replace(/^http/, "ws") + "/realtime/v1/websocket?apikey=" + encodeURIComponent(SERVER.key) + "&vsn=1.0.0"); }
      catch (_) { beiStatus("fehler"); setTimeout(() => zu || auf(), 4000); return; }
      ws.onopen = () => {
        joinRef = String(++ref);
        ws.send(JSON.stringify({ topic, event: "phx_join", ref: joinRef, join_ref: joinRef,
          payload: { config: { broadcast: { self: false, ack: false }, presence: { key: rolle + "-" + Math.random().toString(36).slice(2, 8) }, private: false } } }));
        herz = setInterval(() => roh("heartbeat", {}, "phoenix"), 25000);
      };
      ws.onmessage = e => {
        let m; try { m = JSON.parse(e.data); } catch (_) { return; }
        if (m.topic !== topic) return;
        if (m.event === "phx_reply" && m.ref === joinRef) {
          if (m.payload && m.payload.status === "ok") { leute = {}; zaehlen(); roh("presence", { type: "presence", event: "track", payload: { rolle } }); beiNachricht("_offen", {}); }
          else beiStatus("fehler");
        } else if (m.event === "broadcast" && m.payload) beiNachricht(m.payload.event, m.payload.payload || {});
        else if (m.event === "presence_state") { leute = {}; Object.keys(m.payload || {}).forEach(k => { leute[k] = k.split("-")[0]; }); zaehlen(); }
        else if (m.event === "presence_diff") {
          Object.keys((m.payload && m.payload.joins) || {}).forEach(k => { leute[k] = k.split("-")[0]; });
          Object.keys((m.payload && m.payload.leaves) || {}).forEach(k => { delete leute[k]; });
          zaehlen();
        }
      };
      ws.onclose = () => { clearInterval(herz); if (!zu) { beiStatus("fehler"); setTimeout(() => zu || auf(), 3000); } };
      ws.onerror = () => { try { ws.close(); } catch (_) {} };
    }
    auf();
    return { senden: (ev, d) => roh("broadcast", { type: "broadcast", event: ev, payload: d }), schliessen: () => { zu = true; clearInterval(herz); try { roh("phx_leave", {}); ws.close(); } catch (_) {} } };
  }
  function raumCode() {
    let r = null; try { r = localStorage.getItem("imres-funk-raum"); } catch (_) {}
    if (!r || !/^[a-z0-9]{4,16}$/.test(r)) { r = Math.random().toString(36).slice(2, 10); try { localStorage.setItem("imres-funk-raum", r); } catch (_) {} }
    return r;
  }
  const funkLink = () => location.origin + location.pathname + "?lauschen=" + raumCode();
  function zustand() {
    const w = aktiv ? aktiv.welt : null, m = w ? merk.mix[w.id] || {} : {};
    return { welt: w ? w.id : null, laeuft: !!aktiv, mix: { b: m.b || [], leben: m.leben != null ? m.leben : 1, raum: m.raum != null ? m.raum : 50 } };
  }
  let funkWarte = 0;
  function funkSenden() { if (!funk) return; clearTimeout(funkWarte); funkWarte = setTimeout(() => funk.kanal.senden("zustand", zustand()), 250); }
  function funkUmschalten() {
    if (funk) { funk.kanal.schliessen(); clearInterval(funk.puls); funk = null; funkZeichnen(); return; }
    funk = { status: "verbinde", zahl: 0 };
    funk.kanal = kanal(raumCode(), "pult", ev => { if (ev === "_offen" || ev === "hallo") funk.kanal.senden("zustand", zustand()); },
      (st, n) => { if (!funk) return; funk.status = st; if (n != null) funk.zahl = n; funkStatus(); });
    funk.puls = setInterval(() => funk && funk.kanal.senden("zustand", zustand()), 15000);
    funkZeichnen();
  }
  const statusText = () => !funk ? "" : funk.status === "ok" ? "🟢 " + T.hoeren(funk.zahl || 0) : funk.status === "fehler" ? "🔴 " + T.fehler : "🟡 " + T.verbinde;
  function funkStatus() { const el = document.getElementById("funk-status"); if (el) el.textContent = statusText(); const k = document.getElementById("funk-knopf"); if (k) k.textContent = funk && funk.status === "ok" ? "📡 " + (funk.zahl || 0) : T.funk; }
  function funkZeichnen() {
    const el = $("funk"); if (hoerer) { el.innerHTML = ""; return; }
    el.innerHTML = '<button type="button" class="funk-knopf' + (funk ? " an" : "") + '" id="funk-knopf" aria-expanded="' + funkAuf + '">' + (funk && funk.status === "ok" ? "📡 " + (funk.zahl || 0) : T.funk) + "</button>" +
      (funkAuf ? '<div class="funk-box"><p class="tipp">' + esc(T.funkTipp) + "</p>" +
        (funk ? '<div class="funk-zeile"><input type="text" readonly value="' + esc(funkLink()) + '"><button type="button" id="funk-kopieren">' + esc(T.kopieren) + "</button></div>" +
          '<p class="tipp" id="funk-status">' + esc(statusText()) + '</p><button type="button" class="funk-knopf" id="funk-schalter">' + esc(T.funkStopp) + "</button>"
          : '<button type="button" class="funk-knopf an" id="funk-schalter">' + esc(T.funkStart) + "</button>") + "</div>" : "");
  }
  document.addEventListener("click", e => {
    if (e.target.closest("#funk-knopf")) { funkAuf = !funkAuf; funkZeichnen(); return; }
    if (e.target.closest("#funk-schalter")) { funkUmschalten(); funkAuf = true; funkZeichnen(); return; }
    if (e.target.closest("#funk-kopieren")) {
      const b = e.target.closest("#funk-kopieren");
      if (navigator.share && /Mobi|Android|iPhone/i.test(navigator.userAgent)) navigator.share({ title: T.titel, url: funkLink() }).catch(() => {});
      else if (navigator.clipboard) navigator.clipboard.writeText(funkLink()).then(() => { b.textContent = T.kopiert; setTimeout(() => { b.textContent = T.kopieren; }, 1800); });
    }
    if (e.target.closest(".zuhoeren")) hoererSchalten();
  });
  /* Zuhörer: folgt der Klangwelt des Pults, Lautstärke regelt jeder selbst */
  function hoererEmpfang(ev, d) {
    if (ev !== "zustand" || !d) return;
    hoerer.zuletzt = d;
    if (hoerer.an) hoererAnwenden();
    zeichnen();
  }
  function hoererAnwenden() {
    const d = hoerer.zuletzt; if (!d) return;
    const welt = WELTEN.find(w => w.id === d.welt);
    if (!d.laeuft || !welt) { if (aktiv) stoppen(); return; }
    const m = d.mix || {}; merk.mix[welt.id] = { b: Array.isArray(m.b) ? m.b.map(x => Math.max(0, Math.min(1.5, +x || 0))) : [], leben: Math.max(0, Math.min(2, +m.leben || 0)), raum: Math.max(0, Math.min(100, +m.raum || 0)) };
    if (!aktiv || aktiv.welt !== welt) weltStarten(welt);
    else {
      aktiv.betten.forEach((b, i) => { const r = merk.mix[welt.id].b[i]; if (typeof r === "number" && r !== b.regler) { b.regler = r; b.drift = 0; b.out.gain.setTargetAtTime(b.grund * r, ctx.currentTime, .3); } });
      aktiv.leben = merk.mix[welt.id].leben; hallNass.gain.setTargetAtTime(merk.mix[welt.id].raum / 100 * 1.2, ctx.currentTime, .3);
    }
  }
  function hoererSchalten() {
    hoerer.an = !hoerer.an;
    if (hoerer.an) { audioStart(); if (stumm) stumm.play().catch(() => {}); hoererAnwenden(); } else stoppen();
    zeichnen();
  }
  if (hoerer) {
    hoerer.kanal = kanal(hoerer.raum, "hoerer", (ev, d) => { if (ev === "_offen") hoerer.kanal.senden("hallo", {}); else hoererEmpfang(ev, d); }, st => { hoerer.status = st; zeichnen(); });
    document.querySelector(".unter").textContent = "";
  }
  zeichnen(); funkZeichnen();

  /* ---------- Rundgang ---------- */
  let tour = null;
  function tourSchritt(i) {
    if (i < 0 || i >= T.schritte.length) { tourEnde(); return; }
    tour.i = i;
    const [sel, h, txt] = T.schritte[i];
    if (sel === "#misch" && $("misch").hidden) { merk.welt = merk.welt || WELTEN[0].id; zeichnen(); }
    tour.ziel = document.querySelector(sel);
    const bl = tour.el.querySelector(".tour-blase");
    bl.innerHTML = "<small>" + (i + 1) + " / " + T.schritte.length + "</small><h4>" + esc(h) + "</h4><p>" + esc(txt) + '</p><div class="tour-k"><button type="button" data-tour="ende">' + esc(T.beenden) + "</button><span></span>" +
      (i ? '<button type="button" data-tour="zurueck">' + esc(T.zurueck2) + "</button>" : "") + '<button type="button" class="los" data-tour="weiter">' + esc(i === T.schritte.length - 1 ? T.fertig : T.weiter) + "</button></div>";
    if (tour.ziel && sel !== "#leiste") tour.ziel.scrollIntoView({ block: "center", behavior: "smooth" });
    tourLage(); setTimeout(tourLage, 380); setTimeout(tourLage, 800); bl.focus({ preventScroll: true });
  }
  function tourLage() {
    if (!tour) return;
    const loch = tour.el.querySelector(".tour-loch"), bl = tour.el.querySelector(".tour-blase"), z = tour.ziel, vw = innerWidth, vh = innerHeight;
    if (!z) return;
    const r = z.getBoundingClientRect(), p = 8;
    loch.style.cssText = "left:" + (r.left - p) + "px;top:" + (r.top - p) + "px;width:" + (r.width + 2 * p) + "px;height:" + (Math.min(r.height, vh * .6) + 2 * p) + "px";
    const bw = bl.offsetWidth, bh = bl.offsetHeight, unten = r.top + Math.min(r.height, vh * .6) + p + 12;
    let top = unten; if (top + bh > vh - 10) top = r.top - p - 12 - bh; if (top < 10) top = Math.max(10, vh - bh - 90);
    bl.style.top = top + "px"; bl.style.left = Math.max(10, Math.min(vw - bw - 10, r.left + r.width / 2 - bw / 2)) + "px";
  }
  function tourStart() {
    const el = document.createElement("div"); el.className = "tour"; el.setAttribute("role", "dialog"); el.setAttribute("aria-modal", "true");
    el.innerHTML = '<div class="tour-loch"></div><div class="tour-blase" tabindex="-1"></div>'; document.body.appendChild(el);
    tour = { el, i: 0, nach: tourLage }; addEventListener("scroll", tourLage, { passive: true }); addEventListener("resize", tourLage);
    tourSchritt(0);
  }
  function tourEnde() { if (!tour) return; removeEventListener("scroll", tourLage); removeEventListener("resize", tourLage); tour.el.remove(); tour = null; }
  document.addEventListener("click", e => {
    if (e.target.closest("#rundgang")) { tourStart(); return; }
    if (!tour) return;
    const b = e.target.closest("[data-tour]");
    if (b) { const a = b.dataset.tour; if (a === "ende") tourEnde(); else tourSchritt(tour.i + (a === "weiter" ? 1 : -1)); }
    else if (e.target.closest(".tour")) { e.stopPropagation(); e.preventDefault(); }
  }, true);
  document.addEventListener("keydown", e => { if (!tour) return; if (e.key === "Escape") tourEnde(); else if (e.key === "ArrowRight") tourSchritt(tour.i + 1); else if (e.key === "ArrowLeft") tourSchritt(tour.i - 1); });
  if (hoerer) $("rundgang").hidden = true;

  /* ---------- Dank ---------- */
  $("dank").innerHTML = EN
    ? '<h3>Where the sounds come from</h3><p>All layers are real field recordings: from the sound collections of the free apps <a href="https://github.com/rafaelmardojai/blanket">Blanket</a>, <a href="https://github.com/Muges/ambientsounds">AmbientSounds</a> and <a href="https://github.com/mateusfg7/Noisekun">Noisekun</a> (originals on Freesound and from SFX Producer – CC0 / public domain, some CC BY: rain by alex36917, storm by Digifish Music, waves by Luftrum, heavy rain by D W, forest rain by Corsica_S, stream by mystiscool, thunderstorm by RHumphries, waterfall by straget, rain on tent by Garuda1982). Single sounds: CC0 packs by Kenney and OpenGameArt (rubberduck and others), collected in the Open Game SFX Index. Frog croaks from the collection of the free app <a href="https://github.com/remvze/moodist">Moodist</a> (Pixabay licence / CC0). Owls, gulls, woodpeckers, chatter and laughter are synthesised. Full list in <a href="klang/LIZENZ.txt">klang/LIZENZ.txt</a>. Thank you!</p>'
    : '<h3>Woher die Klänge stammen</h3><p>Alle Teppiche sind echte Aufnahmen: aus den Klangsammlungen der freien Apps <a href="https://github.com/rafaelmardojai/blanket">Blanket</a>, <a href="https://github.com/Muges/ambientsounds">AmbientSounds</a> und <a href="https://github.com/mateusfg7/Noisekun">Noisekun</a> (Originale auf Freesound und von SFX Producer – CC0 bzw. gemeinfrei, einige CC BY: Regen von alex36917, Sturm von Digifish Music, Wellen von Luftrum, Starkregen von D W, Waldregen von Corsica_S, Bach von mystiscool, Gewitter von RHumphries, Wasserfall von straget, Regen aufs Zelt von Garuda1982). Einzelgeräusche: CC0-Pakete von Kenney und OpenGameArt (u. a. rubberduck), gesammelt im Open Game SFX Index. Froschquaken aus der Sammlung der freien App <a href="https://github.com/remvze/moodist">Moodist</a> (Pixabay-Lizenz bzw. CC0). Eulen, Möwen, Specht, Stimmengewirr und Lachen sind gerechnet. Vollständige Liste in <a href="klang/LIZENZ.txt">klang/LIZENZ.txt</a>. Danke!</p>';
})();
</script>
