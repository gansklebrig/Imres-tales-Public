<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Heldensturm – das Roguelike zu Imres Tales: Barradin, Echo, Friedrich und Ezekiel kämpfen sich durch die ganze Kampagne.">
<meta name="theme-color" content="#100c12">
<meta property="og:title" content="Heldensturm">
<meta property="og:description" content="Das Roguelike zu Imres Tales: 13 Orte der Kampagne, Wetter und Tageszeiten, Wächter, Bosse, Beute und Talente – allein, zu viert am selben Bildschirm oder online.">
<meta property="og:image" content="https://imrestales.de/vorschau.jpg">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>Heldensturm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Layout: Vollbild-Canvas als Spielwelt, darüber ein schlankes HUD und Pergament-dunkle Menüs. Eine einzige, bewusst dunkle Welt. */
:root{
  color-scheme:dark;
  --ink:#100c12;--panel:#1b151e;--panel2:#251d29;--line:#3d3140;--text:#f0e6d4;--mute:#a99a8b;
  --gold:#e5b454;--blood:#c23b3f;--moss:#6ea75f;--good:#7fd36a;--bad:#ff6b5e;
  --r0:#c4bcae;--r1:#62a8ff;--r2:#f2d24c;--r3:#bf7dff;--r4:#ff8d2e;
  --fd:'IM Fell English SC','Palatino Linotype',Palatino,Georgia,serif;
  --fb:'Alegreya Sans','Trebuchet MS',system-ui,sans-serif;
}
html,body{height:100%;background:var(--ink);color:var(--text);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--fb);font-size:15px;line-height:1.4;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#cv{position:fixed;inset:0;display:block;touch-action:none}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
.top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,250px) minmax(0,1fr) auto;gap:8px 12px;align-items:start}
.panel{background:rgba(16,12,18,.78);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
.hname{display:flex;align-items:baseline;gap:8px;font-weight:800;font-size:14px;margin-bottom:4px;white-space:nowrap;overflow:hidden}
.hname .nm{font-family:var(--fd);font-weight:400;font-size:20px;color:var(--gold);line-height:1}
.hname .lv{flex:none;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:#2a2030;border:1px solid var(--gold);color:var(--gold);font-weight:800;font-size:12px;line-height:20px;text-align:center;font-variant-numeric:tabular-nums}
.hname .fm{color:var(--moss);font-weight:800;font-size:12px}
.bar{position:relative;height:14px;background:rgba(0,0,0,.55);border:1px solid #000;border-radius:3px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;transition:width .12s linear}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar.hp i{background:linear-gradient(#e0545a,#8f1f26)}
.bar.xp{height:6px;margin-top:4px}
.bar.xp i{background:linear-gradient(#8fe7ff,#3a8fb8)}
.bar.st{height:5px;margin-top:3px}
.bar.st i{background:linear-gradient(#e8f08a,#9ab83a)}
.bar.st.low i{background:linear-gradient(#ff9a6a,#b8503a)}
#util{position:absolute;right:calc(max(14px,env(safe-area-inset-right,0px)) + 272px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-direction:column;gap:12px;pointer-events:none}
.ub{position:relative;width:62px;height:62px;border-radius:50%;border:2px solid #9ab8c8;background:radial-gradient(circle at 40% 35%,#34404a,#10141a 70%);pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 3px 10px rgba(0,0,0,.6)}
.ub .ic{font-size:26px;line-height:1;color:#e8f4ff}
.ub b{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:#c23b4f;color:#fff;font-size:12px;line-height:20px;border:1px solid #000}
.ub .key{position:absolute;left:-2px;bottom:-2px;width:20px;height:20px;border-radius:50%;background:#0d090f;border:1px solid var(--line);font-size:11px;font-weight:800;line-height:18px;color:var(--mute)}
.ub.on{border-color:#e8f08a;box-shadow:0 0 14px rgba(232,240,138,.55)}
.ub.off{opacity:.4}
#btnPot{border-color:#ff8a9a}
@media (hover:none){.ub .key{display:none}}
@media (max-width:420px){#util{right:calc(max(14px,env(safe-area-inset-right,0px)) + 262px)}.ub{width:56px;height:56px}}
.bar.prog i{background:linear-gradient(#f3cd73,#a7792a)}
.bar.prog.boss i{background:linear-gradient(#ff6b5e,#8f1f26)}
.stage{text-align:center}
.stage .sn{font-family:var(--fd);font-size:18px;line-height:1.05;color:var(--text);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage .sn small{font-family:var(--fb);color:var(--mute);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-right:6px}
.hbtns{display:flex;gap:6px;align-items:center;pointer-events:auto}
.gold{font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;font-size:14px;padding:0 4px;white-space:nowrap}
.hb{position:relative;height:44px;min-width:44px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:rgba(37,29,41,.92);font-weight:800;font-size:13px}
.hb b{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--blood);color:#fff;font-size:11px;line-height:18px;border:1px solid #000}
.hb b:empty{display:none}
.hb.glow{border-color:var(--gold);box-shadow:0 0 12px rgba(229,180,84,.55)}
@media (max-width:700px){
  .top{grid-template-columns:minmax(0,1fr) auto}
  .stage{grid-column:1 / -1;order:3}
  .hb{height:42px;min-width:42px;padding:0 10px;font-size:13px}
  #toast{top:calc(env(safe-area-inset-top,0px) + 150px)}
}
#skills{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:262px;height:170px;pointer-events:none}
.sk{position:absolute;width:76px;height:76px;border-radius:50%;border:2px solid var(--gold);background:radial-gradient(circle at 40% 35%,#45344a,#160f18 70%);pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.6);padding:0}
.sk .ic{font-size:32px;line-height:1;color:#fff3dc;font-family:'Segoe UI Symbol','Noto Sans Symbols 2','Noto Sans Symbols',var(--fb)}
.sk .cd{position:absolute;inset:0;border-radius:50%;pointer-events:none}
.sk .cdt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;text-shadow:0 1px 3px #000;font-variant-numeric:tabular-nums;pointer-events:none}
.sk .key{position:absolute;right:-2px;bottom:-2px;width:20px;height:20px;border-radius:50%;background:#0d090f;border:1px solid var(--line);font-size:11px;font-weight:800;line-height:18px;color:var(--mute)}
.sk.ready{border-color:#f7d988}
.sk:active{transform:scale(.94)}
.sk.sil{opacity:.35;filter:grayscale(1)}
.runcard{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:12px;border:1px solid rgba(229,180,84,.6);background:rgba(229,180,84,.08)}
.rc-t{font-weight:800}
.ortdots{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.ortdots i{width:9px;height:9px;border-radius:50%;background:#2c2430;border:1px solid #4a3b4e}
.ortdots i.done{background:var(--gold);border-color:var(--gold)}
.ortdots i.now{background:var(--blood);border-color:#ff9a8a;box-shadow:0 0 8px var(--blood)}
.stufe{font-family:var(--fd);font-size:26px;line-height:1.1;color:var(--text)}
.stufe span{display:block;font-family:var(--fb);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
@media (hover:none){.sk .key{display:none}}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 112px);transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:15;width:min(92vw,520px)}
.tm{background:rgba(16,12,18,.88);border:1px solid var(--line);padding:6px 12px;border-radius:6px;font-weight:800;text-align:center;animation:tin 2.6s forwards}
@media (max-width:700px){#toast{top:calc(env(safe-area-inset-top,0px) + 150px)}}
@keyframes tin{0%{opacity:0;transform:translateY(-6px)}8%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}

/* ---------- Menüs ---------- */
.screen{position:fixed;inset:0;z-index:30;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:rgba(10,7,12,.96);padding-block:calc(env(safe-area-inset-top,0px) + 18px) calc(env(safe-area-inset-bottom,0px) + 28px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen.see{background:linear-gradient(180deg,rgba(10,7,12,.45),rgba(10,7,12,.9) 40%)}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.wrap.narrow{max-width:720px}
h1,h2,h3{font-family:var(--fd);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:clamp(46px,10vw,84px);line-height:.95;letter-spacing:.01em;color:var(--gold);text-shadow:0 3px 0 #000,0 0 28px rgba(229,180,84,.25)}
h2{font-size:clamp(30px,6vw,42px);line-height:1;color:var(--gold)}
h3{font-size:22px;line-height:1.05;color:var(--text)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.lead{color:#d6cab6;max-width:62ch;margin:0}
.muted{color:var(--mute)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.btn{background:var(--panel2);border:1px solid var(--line);padding:11px 16px;min-height:44px;border-radius:8px;font-weight:800}
.btn:hover{border-color:#5a4a5e}
.btn[disabled]{opacity:.45;cursor:default}
.btn.gold{border-color:var(--gold);color:var(--gold)}
.btn-main{font-family:var(--fd);font-size:30px;line-height:1;padding:14px 26px;border-radius:10px;background:linear-gradient(#c8434a,#7f1d24);border:1px solid var(--gold);color:#fff3df;box-shadow:0 4px 0 #3c0c10,0 8px 22px rgba(0,0,0,.5)}
.btn-main:active{transform:translateY(2px);box-shadow:0 2px 0 #3c0c10}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.goldline{font-weight:800;color:var(--gold);font-size:18px;font-variant-numeric:tabular-nums}
.heroes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:680px){.heroes{grid-template-columns:repeat(2,minmax(0,1fr))}}
.hero-card{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 8px 12px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(180deg,#221a26,#151017);text-align:center;min-width:0}
.hero-card canvas{width:96px;height:96px}
.hero-card .n{font-family:var(--fd);font-size:26px;line-height:1;color:var(--text)}
.hero-card .c{font-size:12px;color:var(--mute);font-weight:700}
.hero-card .rl{font-size:11px;color:var(--gold);font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.hero-card.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 22px rgba(229,180,84,.22);background:linear-gradient(180deg,#2e2330,#181219)}
.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px}
@media (max-width:760px){.detail{grid-template-columns:minmax(0,1fr)}}
.ups{display:flex;flex-direction:column;gap:8px}
.up{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;background:rgba(0,0,0,.25);border:1px solid #2c232f}
.up .t{font-weight:800}
.up .t small{color:var(--mute);font-weight:700;margin-left:6px}
.up .d{font-size:13px;color:var(--mute)}
.up .btn{padding:8px 10px;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-weight:800;font-size:13px}
.chip.on{border-color:var(--blood);background:#3a1418;color:#ffd9c8}
.chip[disabled]{opacity:.4;cursor:default}
.keys{font-size:13px;color:var(--mute)}
.keys b{color:var(--text)}
.stat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;font-size:14px}
.stat span:nth-child(even){font-weight:800;font-variant-numeric:tabular-nums;text-align:right}

/* Lager */
.camp-scr{background:radial-gradient(130% 70% at 50% 0%,rgba(46,26,44,.6),rgba(10,7,12,.94) 62%);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 210px)}
.camp{max-width:1020px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.camp-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.camp-top h1{font-size:clamp(44px,11vw,76px)}
.back{display:inline-block;margin-bottom:2px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);text-decoration:none}
.back:hover{color:var(--gold)}
.gold-pill{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:1px solid rgba(229,180,84,.5);background:rgba(229,180,84,.08);font-weight:800;font-size:16px;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.gold-pill i{width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff2c0,#e5b454 45%,#8a6220)}
.picker{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pk{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px 8px;border-radius:12px;border:1px solid var(--line);background:#161118;min-width:0;transition:border-color .15s,background .15s}
.pk canvas{width:56px;height:56px}
.pk span{font-family:var(--fd);font-size:18px;line-height:1;white-space:nowrap}
.pk.on{border-color:var(--hc);box-shadow:0 0 0 1px var(--hc),0 0 18px color-mix(in srgb,var(--hc) 35%,transparent);background:#21182a}
.camp-main{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:820px){.camp-main{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}}
.stage-art{position:relative;border-radius:14px;overflow:hidden;border:1px solid color-mix(in srgb,var(--hc) 40%,var(--line));background:linear-gradient(180deg,#1d1422,#0f0a11)}
.stage-art canvas{display:block;width:100%;height:220px}
@media (min-width:820px){.stage-art canvas{height:360px}}
.stage-cap{position:absolute;right:14px;top:12px;text-align:right;pointer-events:none}
.stage-cap h2{font-size:clamp(34px,8vw,52px);color:var(--text);text-shadow:0 2px 0 #000}
.stage-cap .role{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--hc)}
.camp-panel{display:flex;flex-direction:column;gap:10px;min-width:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;padding:4px;border-radius:12px;background:#120d14;border:1px solid var(--line)}
.seg button{position:relative;padding:9px 6px;border-radius:9px;border:0;background:transparent;font-weight:800;color:var(--mute)}
.seg button[aria-selected=true]{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px #4a3b4e}
.mtabs{background:#120d14}
.mtabs button{padding:12px 6px;font-size:15px}
.seg b{position:absolute;top:7px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.tabbody{display:flex;flex-direction:column;gap:10px}
.facts{display:grid;gap:8px}
.hst{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.hst th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:4px 6px}
.hst td{padding:6px;border-top:1px solid #2c232f}
.hst tr.mein td{background:rgba(229,180,84,.12)}
.hsname{flex:1 1 160px;min-width:0;font:inherit;font-weight:700;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:#120d14;color:var(--text)}
.facts div{display:grid;gap:2px;padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.28);border:1px solid #2c232f;font-size:14px}
.facts span{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.startbar{position:fixed;left:0;right:0;bottom:0;z-index:31;padding-top:22px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(180deg,rgba(10,7,12,0) 0,#0a070c 22px)}
.startin{max-width:1020px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.startin .chips{flex:1 1 200px;flex-wrap:wrap;min-width:0}
.startin .chip{white-space:nowrap}
.startin .btn-main{flex:1 1 240px}

/* Inventar */
.equip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:640px){.equip{grid-template-columns:repeat(3,minmax(0,1fr))}.equip .it{aspect-ratio:auto;min-height:92px}}
.inv-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.inv-head h2 small{font-family:var(--fb);font-size:14px;color:var(--mute);font-weight:800;margin-left:10px}
.wrap.inv{gap:10px}
.wrap.has-sheet{padding-bottom:50vh}
.it .ico{width:34px;height:34px;flex:none}
.it.cmp{box-shadow:0 0 0 2px var(--good) inset}
.it[disabled]{cursor:default}
.sheet{position:fixed;z-index:32;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-width:560px;margin:0 auto;max-height:50vh;overflow-y:auto;touch-action:pan-y;background:#1f1723;border:1px solid #5a4560;border-radius:16px;padding:14px 16px;box-shadow:0 -12px 40px rgba(0,0,0,.65);display:flex;flex-direction:column;gap:6px;animation:shin .16s ease-out}
@keyframes shin{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.sheet .x{position:absolute;top:8px;right:8px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#120d14;font-size:20px;line-height:1}
.sh-head{display:flex;gap:10px;align-items:center;padding-right:40px}
.sh-head .ico{width:44px;height:44px;flex:none;border-radius:8px;background:rgba(0,0,0,.35)}
.sheet .in{font-family:var(--fd);font-size:24px;line-height:1.05}
.sheet ul{margin:0;padding-left:18px}
details.stats{border:1px solid var(--line);border-radius:10px;background:var(--panel)}
details.stats summary{cursor:pointer;font-weight:800;padding:10px 12px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;font-size:12px}
details.stats .stat{padding:0 12px 12px}
.bag{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
.it{position:relative;aspect-ratio:1;gap:2px;max-width:100%;min-width:0;border-radius:8px;border:2px solid var(--r0);background:rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;text-align:center;overflow:hidden}
.it .nm{font-size:10.5px;font-weight:700;line-height:1.12;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.it .sl{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.it .lv{position:absolute;left:4px;top:2px;font-size:10px;color:var(--mute);font-weight:800}

 try{if(pos&&P){const dx=pos.x-P.x,dy=pos.y-P.y,d=Math.hypot(dx,dy),v=1/(1+Math.max(0,d-120)/520),pan=clamp(dx/600,-0.75,0.75);

function makeItem(slot,il,rar,heroId){
 const it={id:ITEMID++,slot,ilvl:il,rar,aff:[]};const m=RARB[rar];
 if(slot==='weapon'||slot==='ranged'){const w=pick(slot==='ranged'?HEROES[heroId].rangedW:HEROES[heroId].meleeW);it.base=w.n;it.wdmg=Math.max(2,Math.round((3+il*1.6)*w.d*rnd(0.9,1.1)*m));it.wrate=w.r;
  if(w.imp){const v=w.imp[0]==='hp'?Math.round((10+il*4)*m):Math.round(w.imp[1]*m*10)/10;it.aff.push({k:w.imp[0],v,imp:1})}}
 else{it.base=pick(BASES[slot]);
  if(slot==='helm'){it.armor=Math.round((2+il*0.9)*rnd(0.9,1.1)*m);it.hp=Math.round((5+il*2.5)*rnd(0.9,1.1)*m)}
  if(slot==='armor'){it.armor=Math.round((4+il*1.8)*rnd(0.9,1.1)*m);it.hp=Math.round((8+il*3)*rnd(0.9,1.1)*m)}
  if(slot==='gloves'){it.armor=Math.round((2+il*0.7)*rnd(0.9,1.1)*m)}}
 let n=[slot==='ring'?1:0,ri(1,2),3,4,5,4][rar];const pool=SLOTAFF[slot].slice();
 const vm=[1,1,1.05,1.15,1.3,1.2][rar];
 while(n-->0&&pool.length){const k=pool.splice(Math.floor(Math.random()*pool.length),1)[0];let v=AFF[k].roll(il)*vm;v=(k==='ls'||k==='regen')?Math.round(v*10)/10:Math.round(v);it.aff.push({k,v})}
 if(rar===4){const L=slot==='weapon'?LEGEND.weapon[heroId]:slot==='ranged'?LEGEND.ranged[heroId]:LEGEND[slot];it.name=pick(L);it.pow=POWNAME[it.name]||pick(['d20','phiole','uralt','demohaut','fledermaus','blase','kraeuter','giftzahn','blutdurst'])}
 else if(rar===0)it.name=it.base;else it.name=it.base+' '+pick(SUFFIX);
 if(rar>=2&&rar<5&&Math.random()<(rar>=4?0.5:0.2))it.sock=[null];
 return maybeCurse(it);
}
function rollRarity(bonus){const L=(P?P.st.luck:0)+bonus+0.25*qualN();const w=[60,28,9*(1+L),2.6*(1+L*1.2),0.45*(1+L*1.5)*RLDROP()];let s=w.reduce((a,b)=>a+b,0)*Math.random();for(let i=0;i<5;i++){s-=w[i];if(s<=0)return i}return 0}
function randomItem(il,bonus,minR){const sl=pick(['weapon','ranged','weapon','ranged','helm','armor','gloves','ring','ring']);const r=Math.max(minR||0,rollRarity(bonus));return makeItem(sl,il,r,P.id)}
const scrapValue=it=>Math.round((3+it.ilvl)*[1,2,4,8,16,12][it.rar]*(1+0.25*(it.up||0)));
function itemLines(it){const L=[];if(it.anc)L.push(`<span class="ancl a${it.anc}">✦ ${ANCN[it.anc]} – ${it.anc===2?'50% stärkere Grundwerte, Zusatz-Eigenschaft und Sockel':'30% stärkere Grundwerte'} · Schmied bis +10</span>`);if(it.slot==='weapon'||it.slot==='ranged'){L.push(`<b>${fmt(it.wdmg)}</b> ${it.slot==='ranged'?'Fernkampfschaden':'Nahkampfschaden'}`);L.push(`${f1(it.wrate)}× Angriffstempo`)}
 if(it.armor)L.push(`+${it.armor} Rüstung`);if(it.hp)L.push(`+${fmt(it.hp)} Leben`);for(const a of (it.aff||[]))if(a&&AFF[a.k])L.push((a.imp?'<span class="muted">◇ </span>':'')+AFF[a.k].f(a.v));if(it.pow&&typeof LPOW!=='undefined'&&LPOW[it.pow])L.push(`<span class="c4"><b>${LPOW[it.pow].n}:</b> ${LPOW[it.pow].d}</span>`);if(Array.isArray(it.sock))for(const g of it.sock)if(!g||GEMS[g])L.push(g?`<span style="color:${GEMS[g].c}">◆ ${GEMS[g].n}:</span> ${AFF[GEMS[g].k].f(gemVal(g,it.ilvl))}`:'<span class="muted">◇ leerer Sockel</span>');if(it.set)L.push(...setLines(it));if(it.curse)L.push(...curseLines(it));return L}

function computeStats(eq){
 const H=P.hero,up=P.up,lv=P.level;
 const lps0=null;const s={hp:H.hp*(1+0.06*(lv-1)),wdmg:0,wM:0,wR:0,rM:1,rR:1,rate:H.rate,speed:H.speed,armor:lv*0.6,crit:0.05,critd:1.5,cdr:0,ls:0,regen:0,area:1,skill:1,gold:1,luck:0,range:H.range,dmgP:0,hpP:0,rateP:0,speedP:0,regenP:0,meleeP:0,rangedP:0};
 for(const k of SLOTS){const it=eq[k];if(!it)continue;
  if(it.wdmg){if(k==='ranged'){s.wR+=it.wdmg;s.rR*=it.wrate}else{s.wM+=it.wdmg;s.rM*=it.wrate}}if(it.armor)s.armor+=it.armor;if(it.hp)s.hp+=it.hp;
  for(const a of affOf(it)){const v=a.v;switch(a.k){case'hp':s.hp+=v;break;case'dmg':s.dmgP+=v/100;break;case'rate':s.rateP+=v/100;break;case'crit':s.crit+=v/100;break;case'critd':s.critd+=v/100;break;case'armor':s.armor+=v;break;case'speed':s.speedP+=v/100;break;case'cdr':s.cdr+=v/100;break;case'ls':s.ls+=v/100;break;case'regen':s.regen+=v;break;case'area':s.area+=v/100;break;case'skill':s.skill+=v/100;break;case'gold':s.gold+=v/100;break}}}
 s.hpP+=0.06*(up.vit||0);s.dmgP+=0.06*(up.pow||0);s.rateP+=0.04*(up.agi||0);s.luck+=0.08*(up.luck||0);s.gold+=0.1*(up.luck||0);
 for(const n of H.tree){const r=P.ranks[n.id]||0;if(r&&n.mod)n.mod(s,r)}
 setStats(s,eq);const cur=curseStats(s,eq);ruhmStats(s);legStats(s);modeStats(s);shrineStats(s);modStats(s);wxStats(s);
 if(P.form==='bear'){const r=rank('e_bear')||1;s.dmgP+=0.3+0.08*r;s.armor+=20+5*r;s.hpP+=0.3;s.speedP+=0.08;s.rateP+=0.1}
 if(P.buffs.frenzy>0){const r=rank('z_frenzy');s.rateP+=0.4+0.08*r;s.speedP+=0.15;s.ls+=0.08}
 if(P.form==='rat')s.speedP+=0.6;
 if(P.stealthT>0)s.speedP+=0.3;
 if(P.buffs.ballad>0){const r=rank('b_ballad');s.dmgP+=0.3+0.15*r;s.rateP+=0.2+0.1*r;s.regenP+=0.01*(1+r)}
 if(P.buffs.howl>0){s.dmgP+=0.2+0.05*(P.howlR||1);s.speedP+=0.2}
 if(P.buffs.ascend>0){s.dmgP+=0.4+0.15*(P.ascendR||1);s.area+=0.3;s.ls+=0.1}
 if(P.bdN>0)s.rateP+=0.03*P.bdN;
 const lps=new Set();for(const k of SLOTS){const it=eq[k];if(it&&it.pow)lps.add(it.pow)}if(eq===P.eq)P.lp=lps;
 if(lps.has('taverne'))s.gold+=0.4;if(lps.has('sturmkrone'))s.cdr+=0.15;
 const maxHp=s.hp*(1+s.hpP);
 const lvF=(1+0.055*(lv-1))*(1+s.dmgP),dmgM=(H.dmg+s.wM)*lvF*(1+s.meleeP),dmgR=(H.dmg+s.wR)*lvF*(1+s.rangedP),rateM=s.rate*s.rM*(1+s.rateP),rateR=s.rate*s.rR*(1+s.rateP);
 const st={maxHp,dmg:(dmgM+dmgR)/2,dmgM,dmgR,rateM,rateR,rate:(rateM+rateR)/2,speed:s.speed*(1+Math.min(s.speedP,0.6)),armor:s.armor,crit:Math.min(s.crit,0.75),critd:s.critd,cdr:Math.min(s.cdr,0.5),ls:s.ls,regen:s.regen+maxHp*s.regenP,area:s.area,skill:s.skill,gold:s.gold,luck:s.luck,range:s.range};curseLate(st,cur);return st;
}

function dpsOf(st){const cf=1+Math.min(st.crit,1)*(st.critd-1);return{m:st.dmgM*st.rateM*cf,r:st.dmgR*st.rateR*cf}}

function itemDelta(it){const slot=bestSlotFor(it);const eq=Object.assign({},P.eq,{[slot]:it});const base=power(computeStats(P.eq));return power(computeStats(eq))/base-1}

let GRID=new Map();const CELL=64;
function buildGrid(){GRID=new Map();for(const e of G.enemies){if(e.dead)continue;const k=((e.x/CELL|0)+64)*4096+((e.y/CELL|0)+64);let a=GRID.get(k);if(!a){a=[];GRID.set(k,a)}a.push(e)}}

const targetable=e=>!e.dead&&!(e.flying&&e.flyHigh>0.4);
function nearest(x,y,R){let b=null,bd=R*R;for(const e of G.enemies){if(!targetable(e))continue;const dx=e.x-x,dy=e.y-y,dd=dx*dx+dy*dy-e.r*e.r;if(dd<bd){bd=dd;b=e}}return b}
function nearestTo(p,R){return nearest(p.x,p.y,R)}
function strongest(x,y,R){let b=null,bv=-1;for(const e of G.enemies){if(!targetable(e))continue;if(d2(e,{x,y})>R*R)continue;const v=e.hp+(e.boss?1e9:0)+(e.guard?1e8:0)+(e.elite?1e6:0);if(v>bv){bv=v;b=e}}return b}
function randomEnemy(x,y,R){const a=[];for(const e of G.enemies)if(targetable(e)&&d2(e,{x,y})<R*R)a.push(e);return a.length?pick(a):null}
function targetsNear(R,n){const c=mouseAim()?cursorW():P;const L=[];for(const e of G.enemies)if(targetable(e)&&d2(e,P)<R*R)L.push(e);L.sort((a,b)=>d2(a,c)-d2(b,c));return L.slice(0,n)}

/* ---------- Zielen: automatisch oder mit der Maus ---------- */
const MOUSE={x:0,y:0,has:false,down:false,fine:!!(window.matchMedia&&matchMedia('(pointer:fine)').matches)};
const mouseAim=()=>P&&P.netCur&&NET.role==='host'?true:!!(SAVE.aim&&MOUSE.has&&!G.bot&&(NET.role==='guest'||!netIs(P&&P.dev))&&(!G.mp||P===mainP()));
function camXY(){const c=G.cam||P;return{x:c.x-W/ZOOM/2,y:c.y-H/ZOOM/2}}
/* Weiche Kamera: folgt dem Helden gedämpft statt starr – das glättet Ruckler beim Laufen und Sprinten */
function camUpd(dt,vw,vh){const C=G.net?netCamC():G.mp&&!G.vp?mpCenter():P,tx=C.x,ty=C.y;if(!G.cam||G.camStage!==G.stage||Math.abs(G.cam.x-tx)>vw||Math.abs(G.cam.y-ty)>vh){G.cam={x:tx,y:ty};G.camStage=G.stage;return}
 const k=1-Math.exp(-Math.min(dt,0.05)*8);G.cam.x+=(tx-G.cam.x)*k;G.cam.y+=(ty-G.cam.y)*k;const mx=vw*0.2,my=vh*0.2;G.cam.x=clamp(G.cam.x,tx-mx,tx+mx);G.cam.y=clamp(G.cam.y,ty-my,ty+my)}
function cursorW(){if(NET.role==='host'&&P&&P.netCur)return{x:P.netCur.x,y:P.netCur.y};const c=camXY();return{x:c.x+MOUSE.x/ZOOM,y:c.y+MOUSE.y/ZOOM}}
function aimAng(R){if(P.padAim!=null)return P.padAim;if(mouseAim()){const c=cursorW();return Math.atan2(c.y-P.y,c.x-P.x)}const t=nearest(P.x,P.y,R||500);return t?ang(P,t):P.face}
function aimPoint(range){if(mouseAim()){const c=cursorW(),d=Math.sqrt(d2(P,c));if(d<=range)return c;const a=ang(P,c);return{x:P.x+Math.cos(a)*range,y:P.y+Math.sin(a)*range}}
 let best=null,bc=-1,n=0;for(const e of G.enemies){if(!targetable(e)||d2(P,e)>range*range)continue;if(++n>30)break;let c=e.boss?6:e.guard?4:0;for(const f of G.enemies)if(!f.dead&&Math.abs(f.x-e.x)<110&&Math.abs(f.y-e.y)<110)c++;if(c>bc){bc=c;best=e}}
 if(best)return{x:best.x,y:best.y};return{x:P.x+Math.cos(P.face)*range*0.45,y:P.y+Math.sin(P.face)*range*0.45}}
function aimTarget(R,strong){if(mouseAim()){const c=cursorW();let b=null,bd=170*170;for(const e of G.enemies){if(!targetable(e)||d2(e,P)>R*R)continue;const dd=d2(e,c)-e.r*e.r;if(dd<bd){bd=dd;b=e}}return b}return strong?strongest(P.x,P.y,R):nearest(P.x,P.y,R)}

/* Normale Angriffe: nahes Ziel → Nahkampf, sonst Fernkampf. Mit Maus: Richtung zum Mauszeiger. */
function bTarget(range,meleeR){
 if(!mouseAim()){const t=nearest(P.x,P.y,range);if(!t)return null;return{t,a:ang(P,t),melee:inMelee(t,meleeR)}}
 const c=cursorW(),a=Math.atan2(c.y-P.y,c.x-P.x);let t=null,bd=1e9,mt=null,md=1e9;
 for(const e of G.enemies){if(!targetable(e))continue;const dx=e.x-P.x,dy=e.y-P.y,dd=Math.hypot(dx,dy);if(dd>range+e.r)continue;let da=Math.atan2(dy,dx)-a;da=Math.abs(Math.atan2(Math.sin(da),Math.cos(da)));
  if(da<0.5&&dd<bd){bd=dd;t=e}if(dd<meleeR+e.r&&da<1.0&&dd<md){md=dd;mt=e}}
 if(!t&&!mt&&!(P.netCur&&NET.role==='host'?P.netCur.down:MOUSE.down))return null;return{t:mt||t,a,melee:!!mt}}
function faceA(a){P.face=a;if(Math.abs(Math.cos(a))>0.15)P.flip=Math.cos(a)<0?-1:1}
const inMelee=(t,R)=>Math.sqrt(d2(P,t))<R+t.r;
function melee(a,R,arc,mult,col,o){const n=cone(P.x,P.y,a,arc,R,P.st.dmg*mult,o||{});slash(P.x,P.y,a,arc,R,col,0.18);return n}

function dot(e,kind,dps,dur){if(e.dead)return;e.dots=e.dots||[];const ex=e.dots.find(d=>d.k===kind);

function tickStatus(e,dt){

function dealDmg(e,base,o){if(e.dead)return 0;if(e.flying&&e.flyHigh>0.4)return 0;if(e.shield>0){e.shield--;e.flash=0.05;burst(e.x,e.y,'#9fe6ff',3,80);if(e.shield<=0)toast('Der Schild zerbricht!','#9fe6ff');return 0}o=o||{};let m=1;

const RGBC={},LITE={};
function rgbOf(c){let r=RGBC[c];if(r)return r;let h=String(c||'#fff').replace('#','');if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h.slice(0,6),16);r=(h.length<6||isNaN(n))?[255,255,255]:[n>>16&255,n>>8&255,n&255];return RGBC[c]=r}
function rgba(c,a){const r=rgbOf(c);return `rgba(${r[0]},${r[1]},${r[2]},${a})`}
function lite(c){let l=LITE[c];if(l)return l;const r=rgbOf(c),m=x=>Math.round(x+(255-x)*0.45);l='#'+[m(r[0]),m(r[1]),m(r[2])].map(v=>v.toString(16).padStart(2,'0')).join('');return LITE[c]=l}

/* Licht */
function light(x,y,r,c,life,a){if(!G.lights)G.lights=[];if(G.lights.length>40)G.lights.shift();G.lights.push({x,y,r,c,t:0,life:life||0.3,a:a===undefined?1:a})}

/* Partikel: Funken (leuchtend), Glut, Geister, Brocken (mit Schwerkraft), Rauch */
function part(o){const cap=GF().parts;if(G.parts.length>=cap)return;o.t=0;G.parts.push(o)}
function burst(x,y,c,n,spd){const q=fxQ();if(G.parts.length>(q>1?650:220))n=Math.min(n,3);else if(q<2)n=Math.ceil(n*0.55);const lc=lite(c);
 for(let i=0;i<n;i++){const a=rnd(TAU),s=rnd(0.3,1)*spd;
  if(i%3!==2)part({k:'spark',x,y,vx:Math.cos(a)*s*1.5,vy:Math.sin(a)*s*1.5,life:rnd(0.16,0.42),c:lc,s:rnd(1.2,2.4),drag:0.88});
  else part({k:'chunk',x,y,vx:Math.cos(a)*s*0.6,vy:Math.sin(a)*s*0.45,z:rnd(2,10),vz:rnd(80,240),life:rnd(0.5,0.9),c,s:rnd(2,4.2),rot:rnd(TAU),vr:rnd(-14,14),drag:0.95})}}
function sparks(x,y,c,n,spd,up){if(fxQ()<2)n=Math.ceil(n*0.5);const lc=lite(c);for(let i=0;i<n;i++){const a=up?-Math.PI/2+rnd(-0.9,0.9):rnd(TAU),s=rnd(0.35,1)*spd;part({k:'spark',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(0.2,0.5),c:lc,s:rnd(1.4,2.8),drag:0.9,g:up?420:0})}}
function embers(x,y,c,n,R){if(fxQ()<2)n=Math.ceil(n*0.5);for(let i=0;i<n;i++)part({k:'ember',x:x+rnd(-R,R),y:y+rnd(-R*0.6,R*0.6),vx:rnd(-20,20),vy:rnd(-90,-30),life:rnd(0.6,1.4),c,s:rnd(2,4.5),drag:0.98,ph:rnd(TAU)})}
function puffs(x,y,c,n,R,sz){if(fxQ()<2)n=Math.ceil(n/2);for(let i=0;i<n;i++){const a=rnd(TAU),s=rnd(10,R);part({k:'puff',x:x+Math.cos(a)*s*0.3,y:y+Math.sin(a)*s*0.3,vx:Math.cos(a)*s,vy:Math.sin(a)*s*0.6-15,life:rnd(0.6,1.2),c,s:rnd(sz*0.6,sz),drag:0.93})}}
function chunks(x,y,c,n,spd){if(fxQ()<2)n=Math.ceil(n/2);for(let i=0;i<n;i++){const a=rnd(TAU),s=rnd(0.3,1)*spd;part({k:'chunk',x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s*0.6,z:rnd(4,16),vz:rnd(120,320),life:rnd(0.7,1.3),c,s:rnd(2.5,5.5),rot:rnd(TAU),vr:rnd(-14,14),drag:0.96})}}
function wisps(x,y,c,n){for(let i=0;i<n;i++)part({k:'wisp',x:x+rnd(-8,8),y:y+rnd(-8,8),vx:rnd(-25,25),vy:rnd(-110,-50),life:rnd(0.7,1.3),c,s:rnd(5,9),drag:0.97,ph:rnd(TAU)})}
function smoke(x,y){puffs(x,y,'#3a1a3a',10,90,16);sparks(x,y,'#b06cff',10,180)}
function updParts(dt){for(const p of G.parts){p.t+=dt;const d=Math.pow(p.drag||0.92,dt*60);p.vx*=d;p.vy*=d;if(p.g)p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
  if(p.vz!==undefined){p.vz-=900*dt;p.z+=p.vz*dt;if(p.z<0){p.z=0;if(p.vz<-60){p.vz*=-0.35;p.vx*=0.6;p.vy*=0.6}else{p.vz=0;p.vr=0}}p.rot+=p.vr*dt}}
 G.parts=G.parts.filter(p=>p.t<p.life)}
function drawPartsNormal(){const c=cx;for(const p of G.parts){const k=p.t/p.life;
  if(p.k==='chunk'){c.globalAlpha=k>0.7?(1-k)/0.3:1;c.save();c.translate(p.x,p.y-p.z);c.rotate(p.rot);c.fillStyle=p.c;c.fillRect(-p.s/2,-p.s*0.4,p.s,p.s*0.8);c.restore()}
  else if(p.k==='puff'){c.globalAlpha=0.38*(1-k);circ(c,p.x,p.y,p.s*(0.6+k*1.4),p.c)}
  else if(!p.k){c.globalAlpha=1-k;c.fillStyle=p.c;c.fillRect(p.x-p.s/2,p.y-p.s/2,p.s,p.s)}}c.globalAlpha=1}
function drawPartsAdd(){const c=cx;c.lineCap='round';for(const p of G.parts){const k=p.t/p.life;
  if(p.k==='spark'){c.globalAlpha=1-k;c.strokeStyle=p.c;c.lineWidth=p.s;c.beginPath();c.moveTo(p.x,p.y);c.lineTo(p.x-p.vx*0.035,p.y-p.vy*0.035);c.stroke()}
  else if(p.k==='ember'){const fl=0.6+0.4*Math.sin(p.t*18+p.ph);glow(p.x+Math.sin(p.t*3+p.ph)*6,p.y,p.s*2.2,p.c,(1-k)*fl*0.9)}
  else if(p.k==='wisp')glow(p.x+Math.sin(p.t*5+p.ph)*8,p.y,p.s*2.5,p.c,(1-k)*0.8)}c.globalAlpha=1}

/* Bodenspuren: Blut, Schleim, Brandflecken, Risse */
function decal(x,y,k,c,r){if(G.bot)return;if(!G.decals)G.decals=[];const max=fxQ()>1?70:24;if(G.decals.length>=max)G.decals.shift();

 if(k==='blood'||k==='slime'){const n=ri(4,7);for(let i=0;i<n;i++){const a=rnd(TAU),dd=rnd(0.5,1.6)*r;d.pts.push([Math.cos(a)*dd,Math.sin(a)*dd*0.6,rnd(0.12,0.38)*r])}}
 else if(k==='crack'){const n=ri(5,8);for(let i=0;i<n;i++){const a=rnd(TAU);let px=0,py=0;const seg=[[0,0]];for(let j=0;j<3;j++){const aa=a+rnd(-0.5,0.5);px+=Math.cos(aa)*r*rnd(0.25,0.45);py+=Math.sin(aa)*r*rnd(0.15,0.3);seg.push([px,py])}d.pts.push(seg)}}

function drawDecals(inView){if(!G.decals||GF().nodec)return;const c=cx;for(const d of G.decals){if(!inView(d.x,d.y,d.r*2))continue;const k=d.t/d.life,a=Math.min(1,d.t*8,k>0.7?(1-k)/0.3:1);
  if(d.k==='scorch'){c.globalAlpha=0.6*a;c.drawImage(scorchSpr(),d.x-d.r,d.y-d.r*0.7,d.r*2,d.r*1.4)}
  else if(d.k==='blood'||d.k==='slime'){c.globalAlpha=(d.k==='slime'?0.5:0.62)*a;c.fillStyle=d.c;c.beginPath();c.ellipse(d.x,d.y,d.r,d.r*0.55,Math.sin(d.rot)*0.3,0,TAU);for(const p of d.pts){c.moveTo(d.x+p[0]+p[2],d.y+p[1]);c.arc(d.x+p[0],d.y+p[1],p[2],0,TAU)}c.fill()}
  else if(d.k==='crack'){c.globalAlpha=0.75*a;c.strokeStyle='rgba(10,8,6,.85)';c.lineWidth=2.4;c.lineCap='round';c.beginPath();for(const s of d.pts){c.moveTo(d.x+s[0][0],d.y+s[0][1]);for(let i=1;i<s.length;i++)c.lineTo(d.x+s[i][0],d.y+s[i][1])}c.stroke()}}c.globalAlpha=1}

const HS_SERVER={url:'https://iszdxkwkgkksdemtqhwu.supabase.co',key:'sb_publishable_Bt3Vw5BSnLaVcTRPTS0ZsA_MeG6G2-Z'};

function hsServer(pfad,body){const h={apikey:HS_SERVER.key,'Content-Type':'application/json'};return fetch(HS_SERVER.url+pfad,body===undefined?{headers:h,cache:'no-store'}:{method:'POST',headers:h,body:JSON.stringify(body)}).then(r=>r.ok?(r.status===204?null:r.json()):Promise.reject(r.status))}
const hsLokal=()=>{try{return JSON.parse(localStorage.getItem('imres-heldensturm-liste')||'[]')||[]}catch(e){return[]}};

function hsLaden(m){m=m||G.lbMode||'kampagne';if(HSL.m!==m){HSL.m=m;HSL.liste=null;HSL.laedt=false}if(HSL.laedt||HSL.liste)return;HSL.laedt=true;
 const sel='/rest/v1/hs_bestenliste?select=name,held,schwierigkeit,stufen,punkte,level,erstellt&order=punkte.desc,stufen.desc,erstellt.asc&limit=15';
 hsServer(sel+lbQuery(m)).catch(err=>m==='kampagne'?hsServer(sel):Promise.reject(err))
 .then(l=>{if(HSL.m!==m)return;HSL.liste=Array.isArray(l)?l:[];HSL.ok=true}).catch(()=>{if(HSL.m!==m)return;HSL.ok=false;HSL.liste=hsLokalM(m)}).then(()=>{HSL.laedt=false;const el=$('hsListe');if(el)el.innerHTML=hsTabelle()})}

 if(!l.length)return`<p class="muted">${m==='taeglich'?'Heute hat sich noch niemand eingetragen – sei der Erste!':'Noch niemand eingetragen – sei der Erste!'}</p>`+lokal;

/* ================= Cloud-Spielstand =================
   Ein geheimer Code verbindet Geräte: Wer den Code kennt, kann den Spielstand laden. */
const CLOUD={busy:false,last:0,err:null,ok:0,tm:null};
function cloudCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const r=new Uint32Array(12);(window.crypto||{getRandomValues:a=>{for(let i=0;i<a.length;i++)a[i]=Math.floor(MATHRND()*4e9)}}).getRandomValues(r);let s='';for(let i=0;i<12;i++){s+=A[r[i]%A.length];if(i===3||i===7)s+='-'}return s}
function cloudSave(){const code=SAVE.cloud;if(!code||CLOUD.busy)return Promise.resolve();CLOUD.busy=true;CLOUD.last=Date.now();
 return hsServer('/rest/v1/rpc/hs_speichern',{p_code:code,p_daten:SAVE}).then(()=>{CLOUD.err=null;CLOUD.ok=Date.now()}).catch(e=>{CLOUD.err=e||'fehler'}).then(()=>{CLOUD.busy=false;const el=$('cloudBox');if(el)el.innerHTML=cloudInner()})}
function cloudSoon(){if(!SAVE.cloud)return;clearTimeout(CLOUD.tm);CLOUD.tm=setTimeout(cloudSave,12000)}
function cloudAdopt(d,code){if(!d||typeof d!=='object'||!d.heroes)return false;SAVE=saveFix(Object.assign(defSave(),d));SAVE.cloud=code;BESTB=null;try{localStorage.setItem(SKEY,JSON.stringify(SAVE))}catch(e){}return true}
function cloudSync(){if(!SAVE.cloud)return;hsServer('/rest/v1/rpc/hs_laden',{p_code:SAVE.cloud}).then(d=>{if(d&&(d.savedAt||0)>(SAVE.savedAt||0)+2000&&G.state==='title'){if(cloudAdopt(d,SAVE.cloud)){toast('Spielstand aus der Cloud übernommen.','#8fe7ff');showTitle(true)}}else if(!d)cloudSave()}).catch(()=>{})}
function cloudInner(){const c=SAVE.cloud;
 if(!c)return`<p class="muted" style="margin:0">Sichere deinen Spielstand online, dann kannst du am Handy und am PC mit demselben Fortschritt spielen. Du bekommst einen geheimen Code – wer ihn kennt, kann den Spielstand laden.</p>
  <div class="row"><button class="btn gold" data-act="cloud-new">In der Cloud sichern</button></div>
  <div class="row"><input id="cloudIn" class="hsname" maxlength="16" autocomplete="off" placeholder="Code von einem anderen Gerät"><button class="btn" data-act="cloud-load">Laden</button></div><div id="cloudMsg"></div>`;
 const st=CLOUD.busy?'Wird gesichert …':CLOUD.err?'<span class="bad">Der Server ist noch nicht eingerichtet oder nicht erreichbar.</span>':CLOUD.ok?`Gesichert um ${new Date(CLOUD.ok).toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'})} Uhr.`:'Wird automatisch gesichert.';
 return`<div class="cloudcode">${esc(c)}</div><p class="muted" style="margin:0;font-size:13px">Diesen Code auf dem anderen Gerät unter „Mehr“ eingeben. ${st}</p>
  <div class="row"><button class="btn gold" data-act="cloud-save">Jetzt sichern</button><button class="btn" data-act="cloud-copy">Code kopieren</button><button class="btn" data-act="cloud-off">Trennen</button></div>`}
function cloudAct(a){
 if(a==='cloud-new'){SAVE.cloud=cloudCode();persist();cloudSave()}
 else if(a==='cloud-save')cloudSave();
 else if(a==='cloud-copy'){try{navigator.clipboard.writeText(SAVE.cloud).then(()=>toast('Code kopiert','#8fe7ff'),()=>toast('Kopieren nicht erlaubt – Code bitte abschreiben.','#ff8a7a'))}catch(e){toast('Kopieren nicht erlaubt – Code bitte abschreiben.','#ff8a7a')}}
 else if(a==='cloud-off'){delete SAVE.cloud;persist()}
 else if(a==='cloud-load'){const f=$('cloudIn'),code=(f?f.value:'').toUpperCase().replace(/[^A-Z0-9]/g,'');if(code.length<12){const m=$('cloudMsg');if(m)m.innerHTML='<p class="bad">Der Code hat 12 Zeichen.</p>';return}
  const full=code.slice(0,4)+'-'+code.slice(4,8)+'-'+code.slice(8,12);const m=$('cloudMsg');if(m)m.innerHTML='<p class="muted">Lade …</p>';
  hsServer('/rest/v1/rpc/hs_laden',{p_code:full}).then(d=>{if(cloudAdopt(d,full)){toast('Spielstand geladen!','#8fe7ff');showTitle(true)}else if(m)m.innerHTML='<p class="bad">Zu diesem Code gibt es keinen Spielstand.</p>'}).catch(()=>{if(m)m.innerHTML='<p class="bad">Der Server ist noch nicht eingerichtet oder nicht erreichbar.</p>'});return}
 const el=$('cloudBox');if(el)el.innerHTML=cloudInner()}

const BEST_T={foe:[10,50,250],guard:[1,3,10],boss:[1,3,8],spec:[1,5,15]};
function bestList(){const L=[];for(const k in FOES)L.push({id:k,def:FOES[k],g:'foe'});L.push({id:'mimic',def:MIMIC,g:'spec'},{id:'schatzgoblin',def:THIEF,g:'spec'});
 for(const k in GUARDS)L.push({id:'w_'+k,def:GUARDS[k],g:'guard'});for(const k in BOSSES)L.push({id:'b_'+k,def:BOSSES[k],g:'boss'});return L}
function bestTier(id,g){const n=(SAVE.best&&SAVE.best[id])||0,T=BEST_T[g||bestGroup(id)];return n>=T[2]?3:n>=T[1]?2:n>=T[0]?1:0}
const bestGroup=id=>id.startsWith('w_')?'guard':id.startsWith('b_')?'boss':(id==='mimic'||id==='schatzgoblin')?'spec':'foe';
let BESTB=null;function bestBonus(){if(BESTB)return BESTB;let n=0;for(const e of bestList())n+=bestTier(e.id,e.g);BESTB={tiers:n,max:bestList().length*3,v:n*0.002};return BESTB}
function bestKill(e){const id=e.def.id;if(!id||G.bot)return;SAVE.best=SAVE.best||{};const before=bestTier(id);SAVE.best[id]=(SAVE.best[id]||0)+1;const after=bestTier(id);
 if(after>before){BESTB=null;toast(`Bestiarium: <b>${esc(e.def.n)}</b> – ${['','Gesichtet','Erforscht','Erzfeind'][after]}${after===3?' (+10% Schaden gegen sie)':''}`,'#c8bca8');recalc()}}
const bestMul=e=>e.def.id&&G.mode!=='taeglich'&&bestTier(e.def.id)>=3?1.1:1;
function renderBestiary(){const L=bestList(),B=bestBonus();const grp={foe:'Gegner',spec:'Besonderheiten',guard:'Wächter',boss:'Bosse'};
 let h=`<div class="muted" style="font-size:13px">Jede erforschte Stufe stärkt alle Helden: <b style="color:var(--text)">+${f1(B.v*100)}% Schaden und Leben</b> (${B.tiers} / ${B.max}). Erzfeinde erleiden 10% mehr Schaden.</div>`;
 for(const g of ['foe','spec','guard','boss']){h+=`<div class="eyebrow" style="margin-top:6px">${grp[g]}</div><div class="bestg">`;
  for(const e of L.filter(x=>x.g===g)){const n=(SAVE.best&&SAVE.best[e.id])||0,t=bestTier(e.id,e.g),T=BEST_T[e.g];const known=n>0;
   h+=`<details class="beste ${known?'':'unk'}"><summary><canvas data-foe="${e.id}" width="64" height="64" aria-hidden="true"></canvas><span class="bn">${known?esc(e.def.n):'???'}</span><span class="bt">${'●'.repeat(t)}${'○'.repeat(3-t)}</span></summary>

  h+='</div>'}return h}

const RUHM=[{id:'macht',n:'Macht',d:v=>`+${v}% Schaden`},{id:'zaeh',n:'Zähigkeit',d:v=>`+${v}% Leben`},{id:'flink',n:'Flinkheit',d:v=>`+${f1(v*0.5)}% Angriffs- und Bewegungstempo`},{id:'glueck',n:'Fortuna',d:v=>`+${v}% Gold und bessere Beute`}];
const RUHM_MAX=50;
function ruhmS(){return SAVE.ruhm||(SAVE.ruhm={xp:0,lv:0,pts:{}})}
const ruhmOn=()=>Object.values(SAVE.heroes).some(h=>h.clears>0);
const ruhmNeed=l=>Math.round(400*Math.pow(1.08,l));
const ruhmFree=()=>{const R=ruhmS();let u=0;for(const k in R.pts)u+=R.pts[k];return R.lv-u};
function ruhmXp(v){if(G.bot||!ruhmOn()||G.mode==='taeglich')return;const R=ruhmS();R.xp+=v*0.35;let up=0;while(R.xp>=ruhmNeed(R.lv)){R.xp-=ruhmNeed(R.lv);R.lv++;up++}if(up)toast(`Ruhm-Stufe ${R.lv}! Ein Ruhmespunkt wartet im Lager.`,'#ffd04a')}
function ruhmStats(s){if(G.mode==='taeglich')return;const p=ruhmS().pts;s.dmgP+=0.01*(p.macht||0);s.hpP+=0.01*(p.zaeh||0);s.rateP+=0.005*(p.flink||0);s.speedP+=0.005*(p.flink||0);s.gold+=0.01*(p.glueck||0);s.luck+=0.01*(p.glueck||0);
 const b=bestBonus().v;s.dmgP+=b;s.hpP+=b}
function ruhmHtml(){if(!ruhmOn())return`<div class="card"><div class="eyebrow">Ruhm</div><p class="muted" style="margin:0">Wird freigeschaltet, sobald ein Held die Kampagne beendet hat. Danach bringt jede Erfahrung auch Ruhm – dauerhaft und für alle Helden.</p></div>`;
 const R=ruhmS(),free=ruhmFree();
 return`<div class="card"><div class="spread"><div class="eyebrow">Ruhm · Stufe ${R.lv}</div><span class="${free?'good':'muted'}" style="font-weight:800">${free} Punkt${free===1?'':'e'} frei</span></div>
  <div class="xpbar"><i style="width:${Math.round(100*R.xp/ruhmNeed(R.lv))}%"></i></div>
  <div class="ups">${RUHM.map(r=>{const v=R.pts[r.id]||0;return`<div class="up"><div><div class="t">${r.n}<small>${v} / ${RUHM_MAX}</small></div><div class="d">${v?r.d(v):'noch nichts'}${v>=RUHM_MAX?' · Maximal':` → <span style="color:var(--text)">${r.d(v+1)}</span>`}</div></div><button class="btn ${free&&v<RUHM_MAX?'gold':''}" data-act="ruhm" data-id="${r.id}" ${!free||v>=RUHM_MAX?'disabled':''}>+1</button></div>`}).join('')}</div></div>`}
