<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Imres Heldensturm – das Roguelike zu Imres Tales: Barradin, Echo, Friedrich und Ezekiel kämpfen sich durch die ganze Kampagne.">
<meta name="theme-color" content="#100c12">
<meta property="og:title" content="Imres Heldensturm">
<meta property="og:description" content="Das Roguelike zu Imres Tales: 13 Orte der Kampagne, Wächter, Bosse, Beute und Talente.">
<meta property="og:image" content="https://imrestales.de/vorschau.jpg">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>Imres Heldensturm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Layout: Vollbild-Canvas als Spielwelt, darüber ein schlankes HUD und Pergament-dunkle Menüs. Eine einzige, bewusst dunkle Welt. */
:root{
  color-scheme:dark;
  --ink:#100c12;--panel:#1b151e;--panel2:#251d29;--line:#3d3140;--text:#f0e6d4;--mute:#a99a8b;
  --gold:#e5b454;--blood:#c23b3f;--moss:#6ea75f;--good:#7fd36a;--bad:#ff6b5e;
  --r0:#c4bcae;--r1:#62a8ff;--r2:#f2d24c;--r3:#bf7dff;--r4:#ff8d2e;
  --fd:'IM Fell English SC','Palatino Linotype',Palatino,Georgia,serif;
  --fb:'Alegreya Sans','Trebuchet MS',system-ui,sans-serif;
}
html,body{height:100%;background:var(--ink);color:var(--text);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--fb);font-size:15px;line-height:1.4;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#cv{position:fixed;inset:0;display:block;touch-action:none}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
.top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,250px) minmax(0,1fr) auto;gap:8px 12px;align-items:start}
.panel{background:rgba(16,12,18,.78);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
.hname{display:flex;align-items:baseline;gap:8px;font-weight:800;font-size:14px;margin-bottom:4px;white-space:nowrap;overflow:hidden}
.hname .nm{font-family:var(--fd);font-weight:400;font-size:20px;color:var(--gold);line-height:1}
.hname .lv{flex:none;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:#2a2030;border:1px solid var(--gold);color:var(--gold);font-weight:800;font-size:12px;line-height:20px;text-align:center;font-variant-numeric:tabular-nums}
.hname .fm{color:var(--moss);font-weight:800;font-size:12px}
.bar{position:relative;height:14px;background:rgba(0,0,0,.55);border:1px solid #000;border-radius:3px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;transition:width .12s linear}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar.hp i{background:linear-gradient(#e0545a,#8f1f26)}
.bar.xp{height:6px;margin-top:4px}
.bar.xp i{background:linear-gradient(#8fe7ff,#3a8fb8)}
.bar.prog i{background:linear-gradient(#f3cd73,#a7792a)}
.bar.prog.boss i{background:linear-gradient(#ff6b5e,#8f1f26)}
.stage{text-align:center}
.stage .sn{font-family:var(--fd);font-size:18px;line-height:1.05;color:var(--text);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage .sn small{font-family:var(--fb);color:var(--mute);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-right:6px}
.hbtns{display:flex;gap:6px;align-items:center;pointer-events:auto}
.gold{font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;font-size:14px;padding:0 4px;white-space:nowrap}
.hb{position:relative;height:44px;min-width:44px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:rgba(37,29,41,.92);font-weight:800;font-size:13px}
.hb b{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--blood);color:#fff;font-size:11px;line-height:18px;border:1px solid #000}
.hb b:empty{display:none}
.hb.glow{border-color:var(--gold);box-shadow:0 0 12px rgba(229,180,84,.55)}
@media (max-width:700px){
  .top{grid-template-columns:minmax(0,1fr) auto}
  .stage{grid-column:1 / -1;order:3}
  .hb{height:42px;min-width:42px;padding:0 10px;font-size:13px}
  #toast{top:calc(env(safe-area-inset-top,0px) + 150px)}
}
#skills{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:262px;height:170px;pointer-events:none}
.sk{position:absolute;width:76px;height:76px;border-radius:50%;border:2px solid var(--gold);background:radial-gradient(circle at 40% 35%,#45344a,#160f18 70%);pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.6);padding:0}
.sk .ic{font-size:32px;line-height:1;color:#fff3dc;font-family:'Segoe UI Symbol','Noto Sans Symbols 2','Noto Sans Symbols',var(--fb)}
.sk .cd{position:absolute;inset:0;border-radius:50%;pointer-events:none}
.sk .cdt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;text-shadow:0 1px 3px #000;font-variant-numeric:tabular-nums;pointer-events:none}
.sk .key{position:absolute;right:-2px;bottom:-2px;width:20px;height:20px;border-radius:50%;background:#0d090f;border:1px solid var(--line);font-size:11px;font-weight:800;line-height:18px;color:var(--mute)}
.sk.ready{border-color:#f7d988}
.sk:active{transform:scale(.94)}
.sk.sil{opacity:.35;filter:grayscale(1)}
.runcard{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:12px;border:1px solid rgba(229,180,84,.6);background:rgba(229,180,84,.08)}
.rc-t{font-weight:800}
.ortdots{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.ortdots i{width:9px;height:9px;border-radius:50%;background:#2c2430;border:1px solid #4a3b4e}
.ortdots i.done{background:var(--gold);border-color:var(--gold)}
.ortdots i.now{background:var(--blood);border-color:#ff9a8a;box-shadow:0 0 8px var(--blood)}
.stufe{font-family:var(--fd);font-size:26px;line-height:1.1;color:var(--text)}
.stufe span{display:block;font-family:var(--fb);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
@media (hover:none){.sk .key{display:none}}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 112px);transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:15;width:min(92vw,520px)}
.tm{background:rgba(16,12,18,.88);border:1px solid var(--line);padding:6px 12px;border-radius:6px;font-weight:800;text-align:center;animation:tin 2.6s forwards}
@media (max-width:700px){#toast{top:calc(env(safe-area-inset-top,0px) + 150px)}}
@keyframes tin{0%{opacity:0;transform:translateY(-6px)}8%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}

/* ---------- Menüs ---------- */
.screen{position:fixed;inset:0;z-index:30;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:rgba(10,7,12,.96);padding-block:calc(env(safe-area-inset-top,0px) + 18px) calc(env(safe-area-inset-bottom,0px) + 28px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen.see{background:linear-gradient(180deg,rgba(10,7,12,.45),rgba(10,7,12,.9) 40%)}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.wrap.narrow{max-width:720px}
h1,h2,h3{font-family:var(--fd);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:clamp(46px,10vw,84px);line-height:.95;letter-spacing:.01em;color:var(--gold);text-shadow:0 3px 0 #000,0 0 28px rgba(229,180,84,.25)}
h2{font-size:clamp(30px,6vw,42px);line-height:1;color:var(--gold)}
h3{font-size:22px;line-height:1.05;color:var(--text)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.lead{color:#d6cab6;max-width:62ch;margin:0}
.muted{color:var(--mute)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.btn{background:var(--panel2);border:1px solid var(--line);padding:11px 16px;min-height:44px;border-radius:8px;font-weight:800}
.btn:hover{border-color:#5a4a5e}
.btn[disabled]{opacity:.45;cursor:default}
.btn.gold{border-color:var(--gold);color:var(--gold)}
.btn-main{font-family:var(--fd);font-size:30px;line-height:1;padding:14px 26px;border-radius:10px;background:linear-gradient(#c8434a,#7f1d24);border:1px solid var(--gold);color:#fff3df;box-shadow:0 4px 0 #3c0c10,0 8px 22px rgba(0,0,0,.5)}
.btn-main:active{transform:translateY(2px);box-shadow:0 2px 0 #3c0c10}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.goldline{font-weight:800;color:var(--gold);font-size:18px;font-variant-numeric:tabular-nums}
.heroes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:680px){.heroes{grid-template-columns:repeat(2,minmax(0,1fr))}}
.hero-card{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 8px 12px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(180deg,#221a26,#151017);text-align:center;min-width:0}
.hero-card canvas{width:96px;height:96px}
.hero-card .n{font-family:var(--fd);font-size:26px;line-height:1;color:var(--text)}
.hero-card .c{font-size:12px;color:var(--mute);font-weight:700}
.hero-card .rl{font-size:11px;color:var(--gold);font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.hero-card.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 22px rgba(229,180,84,.22);background:linear-gradient(180deg,#2e2330,#181219)}
.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px}
@media (max-width:760px){.detail{grid-template-columns:minmax(0,1fr)}}
.ups{display:flex;flex-direction:column;gap:8px}
.up{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;background:rgba(0,0,0,.25);border:1px solid #2c232f}
.up .t{font-weight:800}
.up .t small{color:var(--mute);font-weight:700;margin-left:6px}
.up .d{font-size:13px;color:var(--mute)}
.up .btn{padding:8px 10px;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-weight:800;font-size:13px}
.chip.on{border-color:var(--blood);background:#3a1418;color:#ffd9c8}
.chip[disabled]{opacity:.4;cursor:default}
.keys{font-size:13px;color:var(--mute)}
.keys b{color:var(--text)}
.stat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;font-size:14px}
.stat span:nth-child(even){font-weight:800;font-variant-numeric:tabular-nums;text-align:right}

/* Lager */
.camp-scr{background:radial-gradient(130% 70% at 50% 0%,rgba(46,26,44,.6),rgba(10,7,12,.94) 62%);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 150px)}
.camp{max-width:1020px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.camp-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.camp-top h1{font-size:clamp(44px,11vw,76px)}
.back{display:inline-block;margin-bottom:2px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);text-decoration:none}
.back:hover{color:var(--gold)}
.gold-pill{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:1px solid rgba(229,180,84,.5);background:rgba(229,180,84,.08);font-weight:800;font-size:16px;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.gold-pill i{width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff2c0,#e5b454 45%,#8a6220)}
.picker{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pk{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px 8px;border-radius:12px;border:1px solid var(--line);background:#161118;min-width:0;transition:border-color .15s,background .15s}
.pk canvas{width:56px;height:56px}
.pk span{font-family:var(--fd);font-size:18px;line-height:1;white-space:nowrap}
.pk.on{border-color:var(--hc);box-shadow:0 0 0 1px var(--hc),0 0 18px color-mix(in srgb,var(--hc) 35%,transparent);background:#21182a}
.camp-main{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:820px){.camp-main{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}}
.stage-art{position:relative;border-radius:14px;overflow:hidden;border:1px solid color-mix(in srgb,var(--hc) 40%,var(--line));background:linear-gradient(180deg,#1d1422,#0f0a11)}
.stage-art canvas{display:block;width:100%;height:220px}
@media (min-width:820px){.stage-art canvas{height:360px}}
.stage-cap{position:absolute;right:14px;top:12px;text-align:right;pointer-events:none}
.stage-cap h2{font-size:clamp(34px,8vw,52px);color:var(--text);text-shadow:0 2px 0 #000}
.stage-cap .role{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--hc)}
.camp-panel{display:flex;flex-direction:column;gap:10px;min-width:0}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border-radius:12px;background:#120d14;border:1px solid var(--line)}
.seg button{position:relative;padding:9px 6px;border-radius:9px;border:0;background:transparent;font-weight:800;color:var(--mute)}
.seg button[aria-selected=true]{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px #4a3b4e}
.mtabs{background:#120d14}
.mtabs button{padding:12px 6px;font-size:15px}
.seg b{position:absolute;top:7px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.tabbody{display:flex;flex-direction:column;gap:10px}
.facts{display:grid;gap:8px}
.facts div{display:grid;gap:2px;padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.28);border:1px solid #2c232f;font-size:14px}
.facts span{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.startbar{position:fixed;left:0;right:0;bottom:0;z-index:31;padding-top:22px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(180deg,rgba(10,7,12,0) 0,rgba(10,7,12,.97) 24px)}
.startin{max-width:1020px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.startin .chips{flex:1 1 200px;flex-wrap:nowrap;overflow-x:auto;min-width:0}
.startin .chip{white-space:nowrap}
.startin .btn-main{flex:1 1 240px}

/* Inventar */
.equip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:640px){.equip{grid-template-columns:repeat(3,minmax(0,1fr))}.equip .it{aspect-ratio:auto;min-height:92px}}
.inv-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.inv-head h2 small{font-family:var(--fb);font-size:14px;color:var(--mute);font-weight:800;margin-left:10px}
.wrap.inv{gap:10px}
.wrap.has-sheet{padding-bottom:50vh}
.it .ico{width:34px;height:34px;flex:none}
.it.cmp{box-shadow:0 0 0 2px var(--good) inset}
.it[disabled]{cursor:default}
.sheet{position:fixed;z-index:32;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-width:560px;margin:0 auto;max-height:50vh;overflow-y:auto;touch-action:pan-y;background:#1f1723;border:1px solid #5a4560;border-radius:16px;padding:14px 16px;box-shadow:0 -12px 40px rgba(0,0,0,.65);display:flex;flex-direction:column;gap:6px;animation:shin .16s ease-out}
@keyframes shin{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.sheet .x{position:absolute;top:8px;right:8px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#120d14;font-size:20px;line-height:1}
.sh-head{display:flex;gap:10px;align-items:center;padding-right:40px}
.sh-head .ico{width:44px;height:44px;flex:none;border-radius:8px;background:rgba(0,0,0,.35)}
.sheet .in{font-family:var(--fd);font-size:24px;line-height:1.05}
.sheet ul{margin:0;padding-left:18px}
details.stats{border:1px solid var(--line);border-radius:10px;background:var(--panel)}
details.stats summary{cursor:pointer;font-weight:800;padding:10px 12px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;font-size:12px}
details.stats .stat{padding:0 12px 12px}
.bag{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
.it{position:relative;aspect-ratio:1;gap:2px;max-width:100%;min-width:0;border-radius:8px;border:2px solid var(--r0);background:rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;text-align:center;overflow:hidden}
.it .nm{font-size:10.5px;font-weight:700;line-height:1.12;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.it .sl{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.it .lv{position:absolute;left:4px;top:2px;font-size:10px;color:var(--mute);font-weight:800}
.it .ua{position:absolute;right:4px;top:1px;font-size:12px;color:var(--good);font-weight:800}
.it.empty{border-style:dashed;border-color:#3b3140}
.it.sel{box-shadow:0 0 0 2px #fff inset}
.r0{border-color:var(--r0)}.r1{border-color:var(--r1)}.r2{border-color:var(--r2)}.r3{border-color:var(--r3)}.r4{border-color:var(--r4);box-shadow:0 0 12px rgba(255,141,46,.35)}
.c0{color:var(--r0)}.c1{color:var(--r1)}.c2{color:var(--r2)}.c3{color:var(--r3)}.c4{color:var(--r4)}
.idet{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.idet .in{font-family:var(--fd);font-size:26px;line-height:1}
.idet ul{margin:0;padding-left:18px}
.good{color:var(--good)}.bad{color:var(--bad)}
.invgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.invgrid{grid-template-columns:minmax(0,1fr)}}

/* Talente */
.tree{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.br{display:flex;flex-direction:column;gap:8px;min-width:0}
.br h3{font-size:19px;text-align:center;color:var(--gold)}
.node{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:10px;border:1px solid var(--line);background:#19131c;min-width:0;position:relative}
.node .g{font-size:26px;line-height:1.1;font-family:'Segoe UI Symbol','Noto Sans Symbols 2','Noto Sans Symbols',var(--fb)}
.node.act .g{color:#ffd88a}
.node.pas .g{color:#a9d6ff}
.node .nn{font-size:12px;font-weight:800;line-height:1.15;text-align:center;overflow-wrap:anywhere}
.node .pp{font-size:10px;letter-spacing:2px;color:var(--gold)}
.node.locked{opacity:.4}
.node.can{border-color:var(--gold)}
.node.sel{box-shadow:0 0 0 2px #fff inset}

function computeStats(eq){
 const H=P.hero,up=P.up,lv=P.level;
 const s={hp:H.hp*(1+0.06*(lv-1)),wdmg:0,rate:H.rate,speed:H.speed,armor:lv*0.6,crit:0.05,critd:1.5,cdr:0,ls:0,regen:0,area:1,skill:1,gold:1,luck:0,range:H.range,dmgP:0,hpP:0,rateP:0,speedP:0,regenP:0};
 for(const k of SLOTS){const it=eq[k];if(!it)continue;
  if(it.wdmg){s.wdmg+=it.wdmg;s.rate*=it.wrate}if(it.armor)s.armor+=it.armor;if(it.hp)s.hp+=it.hp;
  for(const a of it.aff){const v=a.v;switch(a.k){case'hp':s.hp+=v;break;case'dmg':s.dmgP+=v/100;break;case'rate':s.rateP+=v/100;break;case'crit':s.crit+=v/100;break;case'critd':s.critd+=v/100;break;case'armor':s.armor+=v;break;case'speed':s.speedP+=v/100;break;case'cdr':s.cdr+=v/100;break;case'ls':s.ls+=v/100;break;case'regen':s.regen+=v;break;case'area':s.area+=v/100;break;case'skill':s.skill+=v/100;break;case'gold':s.gold+=v/100;break}}}
 s.hpP+=0.06*(up.vit||0);s.dmgP+=0.06*(up.pow||0);s.rateP+=0.04*(up.agi||0);s.luck+=0.08*(up.luck||0);s.gold+=0.1*(up.luck||0);
 for(const n of H.tree){const r=P.ranks[n.id]||0;if(r&&n.mod)n.mod(s,r)}
 if(P.form==='bear'){const r=rank('e_bear')||1;s.dmgP+=0.3+0.08*r;s.armor+=20+5*r;s.hpP+=0.3;s.speedP+=0.08;s.rateP+=0.1}
 if(P.buffs.frenzy>0){const r=rank('z_frenzy');s.rateP+=0.4+0.08*r;s.speedP+=0.15;s.ls+=0.08}
 const maxHp=s.hp*(1+s.hpP);
 return{maxHp,dmg:(H.dmg+s.wdmg)*(1+0.055*(lv-1))*(1+s.dmgP),rate:s.rate*(1+s.rateP),speed:s.speed*(1+Math.min(s.speedP,0.6)),armor:s.armor,crit:Math.min(s.crit,0.75),critd:s.critd,cdr:Math.min(s.cdr,0.5),ls:s.ls,regen:s.regen+maxHp*s.regenP,area:s.area,skill:s.skill,gold:s.gold,luck:s.luck,range:s.range};
}
function recalc(){const old=P.st;const ratio=old?P.hp/old.maxHp:1;P.st=computeStats(P.eq);P.hp=Math.max(1,Math.min(P.st.maxHp,ratio*P.st.maxHp))}
const armorK=()=>60+12*(G&&G.state!=='title'?effStage():0);
const armorRed=a=>Math.max(0,a)/(Math.max(0,a)+armorK());
function power(st){const dps=st.dmg*st.rate*(1+st.crit*(st.critd-1))*(0.55+0.45*st.skill)*(1+0.3*(st.area-1));const ehp=st.maxHp/(1-armorRed(st.armor)*0.95)*(1+st.ls*3)+st.regen*25;return Math.pow(dps,0.55)*Math.pow(ehp,0.45)*(1+0.5*st.cdr)*(1+0.3*(st.speed/P.hero.speed-1))*(1+0.05*(st.gold-1)+0.05*st.luck)}
function bestSlotFor(it){if(it.slot!=='ring')return it.slot;if(!P.eq.ring1)return'ring1';if(!P.eq.ring2)return'ring2';
 const a=power(computeStats(Object.assign({},P.eq,{ring1:it}))),b=power(computeStats(Object.assign({},P.eq,{ring2:it})));return a>=b?'ring1':'ring2'}
function itemDelta(it){const slot=bestSlotFor(it);const eq=Object.assign({},P.eq,{[slot]:it});const base=power(computeStats(P.eq));return power(computeStats(eq))/base-1}

/* ================= Kampf-Helfer ================= */
let GRID=new Map();const CELL=64;
function buildGrid(){GRID=new Map();for(const e of G.enemies){if(e.dead)continue;const k=((e.x/CELL|0)+64)*4096+((e.y/CELL|0)+64);let a=GRID.get(k);if(!a){a=[];GRID.set(k,a)}a.push(e)}}
function query(x,y,r,fn){const x0=Math.floor((x-r)/CELL),x1=Math.floor((x+r)/CELL),y0=Math.floor((y-r)/CELL),y1=Math.floor((y+r)/CELL);for(let i=x0;i<=x1;i++)for(let j=y0;j<=y1;j++){const a=GRID.get((i+64)*4096+(j+64));if(a)for(const e of a)if(!e.dead)fn(e)}}
function nearest(x,y,R){let b=null,bd=R*R;for(const e of G.enemies){if(e.dead)continue;const dx=e.x-x,dy=e.y-y,dd=dx*dx+dy*dy-e.r*e.r;if(dd<bd){bd=dd;b=e}}return b}
function strongest(x,y,R){let b=null,bv=-1;for(const e of G.enemies){if(e.dead)continue;if(d2(e,{x,y})>R*R)continue;const v=e.hp+(e.boss?1e9:0)+(e.elite?1e6:0);if(v>bv){bv=v;b=e}}return b}
function randomEnemy(x,y,R){const a=[];for(const e of G.enemies)if(!e.dead&&d2(e,{x,y})<R*R)a.push(e);return a.length?pick(a):null}
function aimPoint(range){let best=null,bc=-1,n=0;for(const e of G.enemies){if(e.dead||d2(P,e)>range*range)continue;if(++n>30)break;let c=e.boss?6:0;for(const f of G.enemies)if(!f.dead&&Math.abs(f.x-e.x)<110&&Math.abs(f.y-e.y)<110)c++;if(c>bc){bc=c;best=e}}
 if(best)return{x:best.x,y:best.y};return{x:P.x+Math.cos(P.face)*range*0.45,y:P.y+Math.sin(P.face)*range*0.45}}
const inMelee=(t,R)=>Math.sqrt(d2(P,t))<R+t.r;
function melee(t,R,arc,mult,col,o){const a=ang(P,t);const n=cone(P.x,P.y,a,arc,R,P.st.dmg*mult,o||{});slash(P.x,P.y,a,arc,R,col,0.18);return n}
function face(t){P.face=ang(P,t);P.flip=t.x<P.x?-1:1}
function later(t,fn){G.timers.push({t,fn})}
function heal(v){P.hp=Math.min(P.st.maxHp,P.hp+v)}
function stunE(e,t){t*=e.boss?0.25:e.elite?0.6:1;if(t>e.stun)e.stun=t}
function dealDmg(e,base,o){if(e.dead)return 0;if(e.flying&&e.flyHigh>0.4)return 0;if(e.shield>0){e.shield--;e.flash=0.05;burst(e.x,e.y,'#9fe6ff',3,80);if(e.shield<=0)toast('Der Schild zerbricht!','#9fe6ff');return 0}o=o||{};let m=1;
 if(e.vulnT>0)m*=1+e.vuln;
 const sn=rank('z_sneak');if(sn&&e.hp>=e.maxHp)m*=1+0.4*sn;
 const wr=rank('z_wrath');if(wr)m*=1+0.015*wr*Math.floor((1-P.hp/P.st.maxHp)*10);
 const crit=!o.noCrit&&Math.random()<P.st.crit;if(crit)m*=P.st.critd;
 const amt=base*m*(1-(e.dr||0));e.hp-=amt;e.flash=0.07;
 if(P.st.ls>0&&!o.noLs)heal(Math.min(amt*P.st.ls,P.st.maxHp*0.015));
 num(e.x+rnd(-6,6),e.y-e.r-4,amt,crit);
 if(o.stun)stunE(e,o.stun);
 if(o.slow){e.slowT=Math.max(e.slowT,o.slowT||0.5);e.slowA=Math.max(e.slowT>0?e.slowA:0,o.slow)}
 if(o.knock&&!e.boss){const fx=o.fx!==undefined?o.fx:P.x,fy=o.fy!==undefined?o.fy:P.y;const a=Math.atan2(e.y-fy,e.x-fx);const k=o.knock*(e.elite?0.5:1)/(e.def.size||1);e.kx+=Math.cos(a)*k;e.ky+=Math.sin(a)*k}
 if(o.fear){const t=o.fear*(e.boss?0.2:e.elite?0.6:1);e.fearT=Math.max(e.fearT,t);e.fx=o.fx!==undefined?o.fx:P.x;e.fy=o.fy!==undefined?o.fy:P.y}
 if(o.onHit)o.onHit(e);
 if(e.hp<=0)killEnemy(e);else sfx('hit');
 return amt}
function aoe(x,y,R,amt,o){let n=0;o=Object.assign({fx:x,fy:y},o||{});query(x,y,R+50,e=>{const dx=e.x-x,dy=e.y-y;if(dx*dx+dy*dy<(R+e.r)*(R+e.r)){dealDmg(e,amt,o);n++}});return n}
function cone(x,y,a,arc,R,amt,o){let n=0;query(x,y,R+50,e=>{const dx=e.x-x,dy=e.y-y,dd=Math.hypot(dx,dy);if(dd>R+e.r)return;let da=Math.atan2(dy,dx)-a;da=Math.atan2(Math.sin(da),Math.cos(da));if(Math.abs(da)<arc/2+Math.atan2(e.r,Math.max(dd,1))||dd<e.r+12){dealDmg(e,amt,o);n++}});return n}
function shoot(o){G.projs.push({team:'p',x:o.x,y:o.y,vx:Math.cos(o.a)*o.spd,vy:Math.sin(o.a)*o.spd,a:o.a,r:o.r||6,dmg:o.dmg,pierce:o.pierce||0,kind:o.kind,c:o.c,hit:o.hit,knock:o.knock,life:o.life||1.4,hits:null})}
function arrow(a,d,h){shoot({x:P.x,y:P.y-4,a,spd:760,dmg:d,r:6,pierce:0,kind:'arrow',c:'#efe0b8',hit:h})}
function daggerRing(n,amt){for(let i=0;i<n;i++)shoot({x:P.x,y:P.y-4,a:i/n*TAU,spd:560,dmg:amt,r:6,pierce:1,kind:'dagger',c:'#d8dde3',life:0.7})}
function zone(o){o.t=0;o.tick=0;o.seeds=[];for(let i=0;i<10;i++)o.seeds.push([rnd(TAU),rnd(0.2,1),rnd(TAU)]);G.zones.push(o)}
function dash(a,dist,time,amt,o){P.dash={vx:Math.cos(a)*dist/time,vy:Math.sin(a)*dist/time,t:time,amt,o,hits:new Set()};P.inv=Math.max(P.inv,time+0.12);P.face=a;P.flip=Math.cos(a)<0?-1:1}
function setForm(f,t){P.form=f;P.formT=Math.max(P.formT||0,t);recalc()}
function illusion(x,y,r){const ph=rank('b_phantom');G.allies.push({kind:'ill',x:clamp(x,20,WORLD-20),y:clamp(y,20,WORLD-20),r:14,hp:P.st.maxHp*0.5,maxHp:P.st.maxHp*0.5,life:8+ph,atk:rnd(0.3,0.8),boom:sk(1.5+0.3*r),flip:1,t:rnd(10)})}

/* ---------- Effekte ---------- */
function burst(x,y,c,n,spd){if(G.parts.length>400)n=Math.min(n,4);for(let i=0;i<n;i++){const a=rnd(TAU),s=rnd(0.3,1)*spd;G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0,life:rnd(0.3,0.7),c,s:rnd(1.5,3.5)})}}
function smoke(x,y){for(let i=0;i<14;i++){const a=rnd(TAU),s=rnd(20,90);G.parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-20,t:0,life:rnd(0.4,0.8),c:i%3?'#3a1a3a':'#7a2a6a',s:rnd(3,7)})}}
function ring(x,y,r,c,life,w){G.fxs.push({k:'ring',x,y,r,c,t:0,life:life||0.4,w:w||3})}
function slash(x,y,a,arc,r,c,life,big){G.fxs.push({k:'slash',x,y,a,arc,r,c,t:0,life:life||0.2,big})}
function bolt(x,y){const pts=[];let px=x+rnd(-30,30),py=y-420;for(let i=0;i<8;i++){pts.push([px,py]);px+=(x-px)/(8-i)+rnd(-18,18);py+=(y-py)/(8-i)}pts.push([x,y]);G.fxs.push({k:'bolt',pts,t:0,life:0.28});burst(x,y,'#cfefff',8,160)}
function num(x,y,v,crit,hurt){if(G.nums.length>70&&!crit&&!hurt)return;G.nums.push({x,y,v,crit,hurt,t:0})}

/* ================= Gegner ================= */
const effStage=()=>G.stage+22*G.diff;
function scale(){const E=effStage(),prog=Math.min(1,G.stageKills/G.need);return{hp:30*Math.pow(1.12,E)*(1+0.35*prog),dmg:9.5*Math.pow(1.095,E)*(1+0.3*prog),il:Math.max(1,Math.round(1+1.1*E+prog*2))}}
function spawnEnemy(def,x,y,o){o=o||{};const sc=scale();const big=o.boss||o.guard||o.add;const elite=!big&&!o.summon&&def.k!=='still'&&Math.random()<0.04;
 const sz=big?(def.size||2):(def.size||1)*(elite?1.35:1);
 const hp=sc.hp*(def.hp||1)*(elite?4.5:1)*(o.boss?(40+G.stage*1.5):o.guard?(8+Math.min(6,G.stage*0.5)):o.add?10:1);
 const e={def,x:clamp(x,10,WORLD-10),y:clamp(y,10,WORLD-10),r:12*sz,hp,maxHp:hp,dmg:sc.dmg*(def.dmg||1)*(elite?1.5:1)*(o.boss?(G.stage<4?1.8:2.2):o.guard?(G.stage<4?1.2:1.6):o.add?1.3:1),sp:(def.sp||80)*(big?1:rnd(0.9,1.1)),
  elite,boss:!!o.boss,guard:!!o.guard,add:!!o.add,summon:!!o.summon,moves:def.moves||null,hitCd:0,atkCd:rnd(1,2.2),stun:0,root:0,slowT:0,slowA:0,fearT:0,fx:0,fy:0,vulnT:0,vuln:0,kx:0,ky:0,flash:0,
  tgtT:0,tgt:null,moveT:big?1.6:2,charging:0,cvx:0,cvy:0,fuse:0,seed:rnd(10),il:sc.il,dead:false,dr:0,shield:0,flying:false,flyHigh:0,heldT:0,dashT:0};
 G.enemies.push(e);return e}
function pickFoe(prog){const S=STAGES[G.stage];const ids=Object.keys(S.foes).filter(id=>FOES[id].k!=='tank'||prog>0.2);let s=ids.reduce((a,id)=>a+S.foes[id],0)*Math.random();for(const id of ids){s-=S.foes[id];if(s<=0)return FOES[id]}return FOES[ids[0]]}
function spawnTick(dt){
 G.spawnT-=dt;if(G.spawnT>0)return;const prog=Math.min(1,G.stageKills/G.need);const bossy=G.boss||G.guardE;
 G.spawnT=Math.max(0.45,1.6-prog*0.7-Math.min(G.stage,20)*0.03)*(bossy?2.6:1)*(G.portal&&!G.boss?99:1);
 const cap=50+Math.min(G.stage,24)*2;if(G.enemies.length>=cap)return;
 const f=pickFoe(prog),n=ri(3,4+Math.min(5,Math.floor(G.stage/5))+Math.floor(prog*3));const R=Math.hypot(W,H)/2/ZOOM+70;
 let px=0,py=0;for(let tr=0;tr<8;tr++){const a=rnd(TAU);px=P.x+Math.cos(a)*R;py=P.y+Math.sin(a)*R;if(px>20&&py>20&&px<WORLD-20&&py<WORLD-20)break}
 for(let i=0;i<n;i++)spawnEnemy(f,px+rnd(-70,70),py+rnd(-70,70))}
function edgePoint(dist){let x=P.x,y=P.y;for(let tr=0;tr<10;tr++){const a=rnd(TAU);x=P.x+Math.cos(a)*dist;y=P.y+Math.sin(a)*dist;if(x>80&&y>80&&x<WORLD-80&&y<WORLD-80)break}return{x:clamp(x,60,WORLD-60),y:clamp(y,60,WORLD-60)}}
function pickTarget(e){let best=P,bd=d2(e,P);for(const a of G.allies){if(a.dead)continue;const dd=d2(e,a);if(a.kind==='ill'&&dd<380*380&&dd<bd*1.6){best=a;bd=dd}else if(a.kind==='rex'&&dd<55*55&&dd<bd){best=a;bd=dd}}return best}
function eShot(x,y,a,spd,dmg,o){o=o||{};G.projs.push({team:'e',x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd,a,r:o.r||6,dmg,kind:o.kind||'eball',c:o.c||'#ff6a4a',life:o.life||5,slow:o.slow,root:o.root})}
function enemyShoot(e,a,spd,dmgM,col){const d=e.def;eShot(e.x,e.y-4,a,spd,e.dmg*dmgM,{r:e.boss?9:6,c:col||d.pc,kind:d.bow?'earrow':d.needle?'eneedle':d.spear?'espear':'eball'})}
function eZone(o){o.t=0;o.tick=0;G.ezones.push(o)}
function tele(o){o.t=0;G.tele.push(o);return o}

function updEnemy(e,dt){
 e.hitCd-=dt;e.atkCd-=dt;if(e.flash>0)e.flash-=dt;if(e.stun>0)e.stun-=dt;if(e.heldT>0)e.heldT-=dt;if(e.root>0)e.root-=dt;if(e.slowT>0)e.slowT-=dt;if(e.fearT>0)e.fearT-=dt;if(e.vulnT>0)e.vulnT-=dt;
 e.x+=e.kx*dt;e.y+=e.ky*dt;const kd=Math.max(0,1-9*dt);e.kx*=kd;e.ky*=kd;
 if(e.def.k==='still')return;
 if((e.boss||e.guard||e.add)&&bossAI(e,dt))return;
 if(e.stun>0)return;
 e.tgtT-=dt;if(e.tgtT<=0){e.tgtT=0.4;e.tgt=pickTarget(e)}const tg=(e.tgt&&!e.tgt.dead&&(e.tgt===P||G.allies.includes(e.tgt)))?e.tgt:P;
 let sp=e.sp*(e.slowT>0?1-e.slowA:1);const dx=tg.x-e.x,dy=tg.y-e.y,d=Math.hypot(dx,dy)||1;let mx=dx/d,my=dy/d;const k=e.def.k;
 if(e.dashT>0){e.dashT-=dt;e.x+=e.cvx*dt;e.y+=e.cvy*dt;if(d2(e,P)<(e.r+P.r)*(e.r+P.r)&&e.hitCd<=0){e.hitCd=0.8;hurt(e.dmg)}return}
 const kite=e.def.kite||(e.phase2&&e.def.half==='reveal');
 if(e.fearT>0){const fx=e.x-e.fx,fy=e.y-e.fy,fd=Math.hypot(fx,fy)||1;mx=fx/fd;my=fy/fd;sp*=1.05}
 else if(e.fleeT>0){e.fleeT-=dt;mx=-mx;my=-my;sp*=1.25}
 else if(k==='ranged'||k==='caster'||k==='netter'||kite){const keep=k==='caster'?260:k==='netter'?220:kite?240:280;if(d<keep-110){mx=-mx;my=-my}else if(d<keep+20){const s=Math.sin(e.seed+G.time*0.7);mx=-my*s;my=mx*s*0.5}
  const pd=Math.sqrt(d2(e,P));
  if(!e.boss&&!e.guard&&!e.add&&pd<420&&e.atkCd<=0){
   if(k==='caster'){e.atkCd=rnd(2.8,3.6);tele({k:'circle',x:P.x+rnd(-20,20),y:P.y+rnd(-20,20),r:58,delay:0.95,dmg:e.dmg*1.3,c:e.def.pc||'#ff8a3a'})}
   else if(k==='netter'){e.atkCd=rnd(2.4,3);eShot(e.x,e.y-4,ang(e,P),260,e.dmg*0.6,{kind:'eweb',c:'#ececf4',r:8,slow:0.55})}
   else{e.atkCd=rnd(1.8,2.7);enemyShoot(e,ang(e,P),230,0.8)}}}
 else if(k==='diver'){if(d<170&&e.atkCd<=0){e.atkCd=rnd(2,2.8);e.dashT=0.42;e.cvx=mx*sp*3.2;e.cvy=my*sp*3.2;return}}
 else if(k==='drunk'){const w=Math.sin(G.time*2.5+e.seed*3);const ox=-my*w*0.9,oy=mx*w*0.9;mx+=ox;my+=oy}
 else if(k==='exploder'){if(!e.fuse&&d<e.r+28)e.fuse=0.45}
 if(e.fuse>0){e.fuse-=dt;mx=my=0;if(e.fuse<=0){const R=75;ring(e.x,e.y,R,'#ffb040',0.35,6);burst(e.x,e.y,'#ffb040',18,220);sfx('boom');if(d2(e,P)<(R+P.r)*(R+P.r))hurt(e.dmg);for(const a of G.allies)if(!a.dead&&d2(e,a)<R*R)a.hp-=e.dmg;e.dead=true;e.noLoot=true;G.kills++;G.stageKills++;return}}
 if(e.root>0){mx=0;my=0}
 e.x+=mx*sp*dt;e.y+=my*sp*dt;
 if(d<e.r+(tg.r||14)+2&&e.hitCd<=0&&e.fearT<=0){e.hitCd=0.85;if(tg===P)hurt(e.dmg);else{tg.hp-=e.dmg;tg.hit=0.1}}
}

/* ---------- Bosse und Wächter ---------- */
function bossAI(e,dt){const def=e.def;
 if(e.survive>0){e.survive-=dt;if(e.survive<=0&&!G.portal){const p=edgePoint(240);G.portal={x:p.x,y:p.y,t:0,boat:1};toast('Das Boot! Springt hinein!','#9fe6ff');sfx('portal')}}
 if(e.tether){const tt=e.tether;tt.t-=dt;const dd=Math.sqrt(d2(e,P));if(tt.t<=0||dd>440||P.inv>0){e.tether=null}else{const dmg=e.dmg*0.9*dt;hurtDot(dmg);e.hp=Math.min(e.maxHp,e.hp+dmg*4)}}
 if(e.charging>0){e.charging-=dt;e.x+=e.cvx*dt;e.y+=e.cvy*dt;e.x=clamp(e.x,30,WORLD-30);e.y=clamp(e.y,30,WORLD-30);
  if(d2(e,P)<(e.r+P.r)*(e.r+P.r)&&e.hitCd<=0){e.hitCd=0.6;hurt(e.dmg*(e.stingHit?2.4:1.6))}if(Math.random()<0.5)burst(e.x,e.y+e.r*0.6,'#8a7a6a',2,60);
  if(e.charging<=0){e.stingHit=0;if(e.rampage>0){e.rampage--;later(0.15,()=>{if(!e.dead)BM.charge(e,false,0.45)})}}return true}
 if(e.flying){e.flyT-=dt;if(e.flyT>0.9){e.flyHigh=Math.min(1,e.flyHigh+dt*2);const a=ang(e,P);e.x+=Math.cos(a)*240*dt;e.y+=Math.sin(a)*240*dt}
  else if(!e.landing){e.landing=1;const tx=P.x,ty=P.y;tele({k:'circle',x:tx,y:ty,r:125,delay:0.85,dmg:e.dmg*2.2,c:def.pc||'#ff4a3a',after:()=>{if(e.dead)return;e.x=tx;e.y=ty;e.flying=false;e.flyHigh=0;e.landing=0;G.shake+=5;burst(tx,ty,'#a89a8a',20,240)}})}
  return true}
 if(e.stun>0)return true;
 const enr=e.hp<e.maxHp*0.4;
 if(def.half&&!e.halfDone&&e.hp<e.maxHp*0.5){e.halfDone=1;halfPhase(e)}
 if(def.bat&&e.hp<e.maxHp*0.5){e.dead=true;e.noLoot=true;smoke(e.x,e.y);G.fxs.push({k:'batfly',x:e.x,y:e.y,t:0,life:1.4});toast('Nezna verwandelt sich in eine Fledermaus und flieht: „Die Spinne wird euch kriegen …“','#c48cff');return true}
 if(def.hazard==='ilvaraPfeile'){e.hazT=(e.hazT||3)-dt;if(e.hazT<=0){e.hazT=rnd(3,4.5);const p=edgePoint(520);for(let i=-1;i<=1;i++)eShot(p.x,p.y,ang(p,P)+i*0.12,330,e.dmg*0.55,{kind:'earrow',c:'#b080ff'});G.fxs.push({k:'ring',x:p.x,y:p.y,r:30,c:'#b080ff',t:0,life:0.5,w:3})}}
 e.moveT-=dt;
 if(e.moveT<=0&&e.moves){const big=e.boss?1:1.3;e.moveT=(enr?1.7:2.5)*big*rnd(0.85,1.15);const list=(e.phase2&&def.moves2)?def.moves2:e.moves;const mv=pick(list);if(BM[mv])BM[mv](e,enr)}
 return false}
function halfPhase(e){const def=e.def;
 if(def.half==='flee'){smoke(e.x,e.y);const p=edgePoint(620);e.x=p.x;e.y=p.y;smoke(e.x,e.y);e.fleeT=4;for(let i=0;i<4;i++){const q=edgePoint(260);spawnEnemy(FOES.robe,q.x,q.y,{summon:1})}toast('Glasstab flieht durch den Geheimgang! Hinterher!','#ff8a7a')}
 if(def.half==='reveal'){e.phase2=1;smoke(e.x,e.y);burst(e.x,e.y,'#b080ff',30,220);toast('Die Druidin zeigt ihr wahres Gesicht: Ilvara Mizzrym, eine Drow!','#c48cff')}}
const BM={
 charge(e,enr,delay){const a=ang(e,P);tele({k:'line',x:e.x,y:e.y,a,len:520,w:e.r*1.6,delay:delay||0.75,c:'#ff4a3a'});later(delay||0.75,()=>{if(e.dead)return;e.charging=0.5;e.cvx=Math.cos(a)*1050;e.cvy=Math.sin(a)*1050;sfx('roar')});e.moveT+=0.6},
 rampage(e){e.rampage=2;BM.charge(e)},
 sting(e){const a=ang(e,P);tele({k:'line',x:e.x,y:e.y,a,len:460,w:e.r*1.2,delay:0.5,c:'#e0c040'});later(0.5,()=>{if(e.dead)return;e.charging=0.38;e.stingHit=1;e.cvx=Math.cos(a)*1300;e.cvy=Math.sin(a)*1300;sfx('pierce')})},
 fan(e,enr){const n=5+Math.min(4,Math.floor(G.stage/6))+(enr?2:0),a0=ang(e,P),sp=0.75;for(let i=0;i<n;i++)enemyShoot(e,a0-sp/2+sp*i/(n-1),260,0.8)},
 shards(e,enr){const n=16,a0=rnd(TAU);for(let i=0;i<n;i++)eShot(e.x,e.y,a0+i*TAU/n,220,e.dmg*0.8,{kind:'eshard',c:'#bfe6ff'});if(enr)later(0.35,()=>{if(!e.dead)for(let i=0;i<n;i++)eShot(e.x,e.y,a0+(i+0.5)*TAU/n,220,e.dmg*0.8,{kind:'eshard',c:'#bfe6ff'})})},
 radial(e,enr){const n=12+Math.min(10,G.stage),a0=rnd(TAU);for(let i=0;i<n;i++)enemyShoot(e,a0+i*TAU/n,200,0.8,e.def.pc);if(enr)later(0.4,()=>{if(!e.dead)for(let i=0;i<n;i++)enemyShoot(e,a0+(i+0.5)*TAU/n,200,0.8,e.def.pc)});ring(e.x,e.y,e.r+10,e.def.pc||'#ff6a4a',0.3,4)},

 boulder(e,enr){for(let i=0;i<3+(enr?2:0);i++){const x=P.x+(i?rnd(-170,170):0),y=P.y+(i?rnd(-170,170):0);tele({k:'circle',x,y,r:100,delay:1.3,dmg:e.dmg*2.2,c:'#c8a070',rock:{x:e.x,y:e.y}})}sfx('roar')},
 summon(e){const ids=e.def.summon||['goblin'];for(let i=0;i<3+Math.min(4,Math.floor(G.stage/5));i++){const a=rnd(TAU);spawnEnemy(FOES[pick(ids)],e.x+Math.cos(a)*(e.r+40),e.y+Math.sin(a)*(e.r+40),{summon:1})}ring(e.x,e.y,e.r+40,'#ffffff',0.4,3)},
 howl(e){for(let i=0;i<4+Math.min(3,Math.floor(G.stage/6));i++){const p=edgePoint(380);spawnEnemy(e.def.shape==='druidin'?FOES.fuchs:FOES.wolf,p.x,p.y,{summon:1})}ring(e.x,e.y,160,'#c8c0b0',0.6,4);sfx('roar')},
 lob(e){const kind=e.def.lob||'gift';for(let i=0;i<3;i++){const x=P.x+(i?rnd(-140,140):0),y=P.y+(i?rnd(-140,140):0);tele({k:'circle',x,y,r:62,delay:0.9,dmg:e.dmg*1.1,c:ZCOL[kind],vial:{x:e.x,y:e.y},after:()=>eZone({x,y,r:66,dur:4.5,dps:e.dmg*0.55,kind,slow:kind==='netz'?0.55:0})})}},
 spores(e){for(let i=0;i<4;i++){const x=P.x+rnd(-170,170),y=P.y+rnd(-170,170);tele({k:'circle',x,y,r:70,delay:0.8,dmg:e.dmg*0.8,c:ZCOL.sporen,after:()=>eZone({x,y,r:74,dur:5,dps:e.dmg*0.5,kind:'sporen'})})}},
 fog(e){for(let i=0;i<3;i++){const p={x:P.x+rnd(-220,220),y:P.y+rnd(-220,220)};eZone({x:p.x,y:p.y,r:80,dur:7,dps:e.dmg*0.45,slow:0.3,kind:'nebel',drift:45})}sfx('vine')},

  case'run-drop-no':G.confirmDrop=false;showTitle(true);break;
  case'music':SAVE.music=!SAVE.music;persist();MUSIK.schalten(SAVE.music);if(G.state==='title')showTitle(true);else renderPause(true);break;
  case'stage-go':hideScreen();hud.hidden=false;G.state='play';G.paused=false;last=performance.now();if(G.stage===0&&G.kills===0)toast('Laufen – angreifen geht von allein!');break;
  case'next-stage':G.state='play';setupStage(G.stage+1);showStageIntro();break;
  case'between-inv':G.invSel=null;G.overlay='inv';renderInv();break;
  case'between-tree':G.overlay='tree';renderTree();break;
  case'mtab':if(G.state==='between'&&b.dataset.m!=='pause'){G.overlay=b.dataset.m;if(b.dataset.m==='inv'){G.invSel=null;renderInv()}else renderTree()}else if(G.state==='play')switchOverlay(b.dataset.m);break;
  case'open-inv':openOverlay('inv');break;
  case'open-tree':openOverlay('tree');break;
  case'open-pause':openOverlay('pause');break;
  case'close':if(G.state==='between'){G.overlay=null;showChapterDone()}else closeOverlay();break;
  case'auto':SAVE.auto=!SAVE.auto;persist();renderPause(true);break;
  case'sound':SAVE.sound=!SAVE.sound;persist();renderPause(true);break;
  case'giveup':$('giveup').innerHTML=`<div class="spread"><div class="t" style="font-weight:800">Wirklich aufgeben?</div><div class="row"><button class="btn" data-act="giveup-no">Nein</button><button class="btn" style="border-color:var(--blood)" data-act="giveup-yes">Ja, aufgeben</button></div></div>`;break;
  case'giveup-no':renderPause(true);break;
  case'giveup-yes':G.overlay=null;G.paused=false;G.state='play';endRun(false);break;
  case'to-camp':showTitle();break;
  case'inv-sel':G.invSel=G.invSel===b.dataset.k?null:b.dataset.k;renderInv(true);break;
  case'inv-desel':G.invSel=null;renderInv(true);break;
  case'inv-equip':{const i=+G.invSel.split(':')[1];equipFromBag(i);G.invSel=null;sfx('equip');renderInv(true);break}
  case'inv-scrap':{const i=+G.invSel.split(':')[1];const it=P.bag[i];if(it){const v=scrapValue(it);SAVE.gold+=v;G.goldRun+=v;P.bag.splice(i,1);sfx('scrap')}G.invSel=null;updateInvBadge();renderInv(true);break}
  case'inv-scrapall':{let v=0;P.bag=P.bag.filter(it=>{if(it.rar<4&&itemDelta(it)<=0.005){v+=scrapValue(it);return false}return true});SAVE.gold+=v;G.goldRun+=v;if(v){sfx('scrap');toast(`+${fmt(v)} Gold`,'#e5b454')}G.invSel=null;updateInvBadge();renderInv(true);break}
  case'inv-unequip':{const k=G.invSel.split(':')[1];if(P.eq[k]&&P.bag.length<24&&k!=='weapon'){P.bag.push(P.eq[k]);P.eq[k]=null;recalc();sfx('equip')}G.invSel=null;updateInvBadge();renderInv(true);break}
  case'tree-sel':G.treeSel=b.dataset.id;renderTree(true);break;
  case'tree-learn':{const n=P.hero.tree.find(x=>x.id===G.treeSel);if(n)learn(n);renderTree(true);break}
 }});
window.addEventListener('keydown',ev=>{if(ev.repeat&&!/^(Arrow|Key[WASD])/.test(ev.code))return;audioInit();
 if(G.state==='play'&&!G.overlay&&/^(Arrow|Key[WASD])/.test(ev.code))keys[ev.code]=true;
 if(G.state==='play'&&!G.paused){keys[ev.code]=true;if(/^Digit[1-6]$/.test(ev.code)){useSkill(+ev.code.slice(5)-1)}else if(ev.code==='KeyI')openOverlay('inv');else if(ev.code==='KeyT')openOverlay('tree');else if(ev.code==='Escape'||ev.code==='KeyP')openOverlay('pause');
  if(/^Arrow/.test(ev.code))ev.preventDefault()}
 else if(G.paused&&G.overlay==='inv'&&G.invSel&&ev.code==='Escape'){G.invSel=null;renderInv(true)}
 else if(G.overlay&&G.state==='play'){if(ev.code==='Escape'||(ev.code==='KeyI'&&G.overlay==='inv')||(ev.code==='KeyT'&&G.overlay==='tree'))closeOverlay();else if(ev.code==='KeyI')switchOverlay('inv');else if(ev.code==='KeyT')switchOverlay('tree')}});
window.addEventListener('keyup',ev=>{keys[ev.code]=false});
cv.addEventListener('pointerdown',ev=>{audioInit();if(G.state!=='play'||G.overlay)return;if(joy&&joy.on)return;joy={on:true,id:ev.pointerId,ox:ev.clientX,oy:ev.clientY,x:ev.clientX,y:ev.clientY};try{cv.setPointerCapture(ev.pointerId)}catch(e){}ev.preventDefault()});
cv.addEventListener('pointermove',ev=>{if(joy&&joy.on&&ev.pointerId===joy.id){joy.x=ev.clientX;joy.y=ev.clientY;const dx=joy.x-joy.ox,dy=joy.y-joy.oy,d=Math.hypot(dx,dy);if(d>90){joy.ox=joy.x-dx/d*90;joy.oy=joy.y-dy/d*90}}});
const endJoy=ev=>{if(joy&&ev.pointerId===joy.id)joy=null};cv.addEventListener('pointerup',endJoy);cv.addEventListener('pointercancel',endJoy);
document.addEventListener('visibilitychange',()=>{if(document.hidden){persist();if(G.state==='play'&&!G.paused)openOverlay('pause')}});
window.addEventListener('contextmenu',e=>e.preventDefault());

/* ================= Schleife ================= */
let last=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(0.05,(now-last)/1000);last=now;
 if(G.state==='play'&&G.paused&&!G.overlay&&G.resumeT>0){G.resumeT-=dt;if(G.resumeT<=0){G.resumeT=0;G.paused=false}}
 if(G.state==='play'&&!G.paused)update(dt);
 musikTick(dt);
 try{render(dt);if(G.state==='title'&&stageCv)drawStage()}catch(e){console.error(e)}
 hudUpdate()}
MUSIK.schalten(SAVE.music!==false);showTitle();requestAnimationFrame(frame);

/* interner Testzugang */
window.__hs={get G(){return G},get P(){return P},start(id,d){startRun(id,d||0);hideScreen();hud.hidden=false;G.state='play';G.paused=false},bot(on){G.bot=on},
 step(n,dt){for(let i=0;i<n;i++){if(G.state==='between'){if(G.stage<STAGES.length-1&&G.portal){setupStage(G.stage+1);G.state='play';hideScreen();hud.hidden=false}else if(!G.portal){hideScreen();hud.hidden=false;G.state='play'}}if(G.state!=='play')break;update(dt||1/30)}},render(){render(0.016);hudUpdate()},SAVE:()=>SAVE,stage(i){setupStage(i);hideScreen();hud.hidden=false;G.state='play';G.paused=false},MUSIK,draw:{drawHero,drawRex,drawEnemy,FOES,GUARDS,BOSSES,setCx(c){cx=c}}};
})();
</script>
