<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Imres Heldensturm – das Roguelike zu Imres Tales: Barradin, Echo, Friedrich und Ezekiel kämpfen sich durch Horden, Beute und Bosse.">
<meta name="theme-color" content="#100c12">
<meta property="og:title" content="Imres Heldensturm">
<meta property="og:description" content="Das Roguelike zu Imres Tales: Horden, Beute, Talente und Bosse.">
<meta property="og:image" content="https://imrestales.de/vorschau.jpg">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>Imres Heldensturm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Layout: Vollbild-Canvas als Spielwelt, darüber ein schlankes HUD und Pergament-dunkle Menüs. Eine einzige, bewusst dunkle Welt. */
:root{
  color-scheme:dark;
  --ink:#100c12;--panel:#1b151e;--panel2:#251d29;--line:#3d3140;--text:#f0e6d4;--mute:#a99a8b;
  --gold:#e5b454;--blood:#c23b3f;--moss:#6ea75f;--good:#7fd36a;--bad:#ff6b5e;
  --r0:#c4bcae;--r1:#62a8ff;--r2:#f2d24c;--r3:#bf7dff;--r4:#ff8d2e;
  --fd:'IM Fell English SC','Palatino Linotype',Palatino,Georgia,serif;
  --fb:'Alegreya Sans','Trebuchet MS',system-ui,sans-serif;
}
html,body{height:100%;background:var(--ink);color:var(--text);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--fb);font-size:15px;line-height:1.4;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#cv{position:fixed;inset:0;display:block;touch-action:none}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
.top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,250px) minmax(0,1fr) auto;gap:8px 12px;align-items:start}
.panel{background:rgba(16,12,18,.78);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
.hname{display:flex;align-items:baseline;gap:8px;font-weight:800;font-size:14px;margin-bottom:4px;white-space:nowrap;overflow:hidden}
.hname .nm{font-family:var(--fd);font-weight:400;font-size:20px;color:var(--gold);line-height:1}
.hname .lv{flex:none;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:#2a2030;border:1px solid var(--gold);color:var(--gold);font-weight:800;font-size:12px;line-height:20px;text-align:center;font-variant-numeric:tabular-nums}
.hname .fm{color:var(--moss);font-weight:800;font-size:12px}
.bar{position:relative;height:14px;background:rgba(0,0,0,.55);border:1px solid #000;border-radius:3px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;transition:width .12s linear}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar.hp i{background:linear-gradient(#e0545a,#8f1f26)}
.bar.xp{height:6px;margin-top:4px}
.bar.xp i{background:linear-gradient(#8fe7ff,#3a8fb8)}
.bar.prog i{background:linear-gradient(#f3cd73,#a7792a)}
.bar.prog.boss i{background:linear-gradient(#ff6b5e,#8f1f26)}
.stage{text-align:center}
.stage .sn{font-family:var(--fd);font-size:18px;line-height:1.05;color:var(--text);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage .sn small{font-family:var(--fb);color:var(--mute);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-right:6px}
.hbtns{display:flex;gap:6px;align-items:center;pointer-events:auto}
.gold{font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;font-size:14px;padding:0 4px;white-space:nowrap}
.hb{position:relative;height:40px;min-width:40px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:rgba(37,29,41,.92);font-weight:800;font-size:13px}
.hb b{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--blood);color:#fff;font-size:11px;line-height:18px;border:1px solid #000}
.hb b:empty{display:none}
.hb.glow{border-color:var(--gold);box-shadow:0 0 12px rgba(229,180,84,.55)}
@media (max-width:700px){
  .top{grid-template-columns:minmax(0,1fr) auto}
  .stage{grid-column:1 / -1;order:3}
  .hb{height:36px;padding:0 8px;font-size:12px}
  #toast{top:calc(env(safe-area-inset-top,0px) + 150px)}
}
#skills{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:232px;height:150px;pointer-events:none}
.sk{position:absolute;width:66px;height:66px;border-radius:50%;border:2px solid var(--gold);background:radial-gradient(circle at 40% 35%,#45344a,#160f18 70%);pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.6);padding:0}
.sk .ic{font-size:28px;line-height:1;color:#fff3dc;font-family:'Segoe UI Symbol','Noto Sans Symbols 2','Noto Sans Symbols',var(--fb)}
.sk .cd{position:absolute;inset:0;border-radius:50%;pointer-events:none}
.sk .cdt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;text-shadow:0 1px 3px #000;font-variant-numeric:tabular-nums;pointer-events:none}
.sk .key{position:absolute;right:-2px;bottom:-2px;width:20px;height:20px;border-radius:50%;background:#0d090f;border:1px solid var(--line);font-size:11px;font-weight:800;line-height:18px;color:var(--mute)}
.sk.ready{border-color:#f7d988}
.sk:active{transform:scale(.94)}
@media (hover:none){.sk .key{display:none}}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 112px);transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:15;width:min(92vw,520px)}
.tm{background:rgba(16,12,18,.88);border:1px solid var(--line);padding:6px 12px;border-radius:6px;font-weight:800;text-align:center;animation:tin 2.6s forwards}
@media (max-width:700px){#toast{top:calc(env(safe-area-inset-top,0px) + 150px)}}
@keyframes tin{0%{opacity:0;transform:translateY(-6px)}8%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}

/* ---------- Menüs ---------- */
.screen{position:fixed;inset:0;z-index:30;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:rgba(10,7,12,.96);padding-block:calc(env(safe-area-inset-top,0px) + 18px) calc(env(safe-area-inset-bottom,0px) + 28px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen.see{background:linear-gradient(180deg,rgba(10,7,12,.45),rgba(10,7,12,.9) 40%)}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.wrap.narrow{max-width:720px}
h1,h2,h3{font-family:var(--fd);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:clamp(46px,10vw,84px);line-height:.95;letter-spacing:.01em;color:var(--gold);text-shadow:0 3px 0 #000,0 0 28px rgba(229,180,84,.25)}
h2{font-size:clamp(30px,6vw,42px);line-height:1;color:var(--gold)}
h3{font-size:22px;line-height:1.05;color:var(--text)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.lead{color:#d6cab6;max-width:62ch;margin:0}
.muted{color:var(--mute)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.btn{background:var(--panel2);border:1px solid var(--line);padding:10px 14px;border-radius:8px;font-weight:800}
.btn:hover{border-color:#5a4a5e}
.btn[disabled]{opacity:.45;cursor:default}
.btn.gold{border-color:var(--gold);color:var(--gold)}
.btn-main{font-family:var(--fd);font-size:30px;line-height:1;padding:14px 26px;border-radius:10px;background:linear-gradient(#c8434a,#7f1d24);border:1px solid var(--gold);color:#fff3df;box-shadow:0 4px 0 #3c0c10,0 8px 22px rgba(0,0,0,.5)}
.btn-main:active{transform:translateY(2px);box-shadow:0 2px 0 #3c0c10}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.goldline{font-weight:800;color:var(--gold);font-size:18px;font-variant-numeric:tabular-nums}
.heroes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:680px){.heroes{grid-template-columns:repeat(2,minmax(0,1fr))}}
.hero-card{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 8px 12px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(180deg,#221a26,#151017);text-align:center;min-width:0}
.hero-card canvas{width:96px;height:96px}
.hero-card .n{font-family:var(--fd);font-size:26px;line-height:1;color:var(--text)}
.hero-card .c{font-size:12px;color:var(--mute);font-weight:700}
.hero-card .rl{font-size:11px;color:var(--gold);font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.hero-card.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 22px rgba(229,180,84,.22);background:linear-gradient(180deg,#2e2330,#181219)}
.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px}
@media (max-width:760px){.detail{grid-template-columns:minmax(0,1fr)}}
.ups{display:flex;flex-direction:column;gap:8px}
.up{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;background:rgba(0,0,0,.25);border:1px solid #2c232f}
.up .t{font-weight:800}
.up .t small{color:var(--mute);font-weight:700;margin-left:6px}
.up .d{font-size:13px;color:var(--mute)}
.up .btn{padding:8px 10px;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-weight:800;font-size:13px}
.chip.on{border-color:var(--blood);background:#3a1418;color:#ffd9c8}
.chip[disabled]{opacity:.4;cursor:default}
.keys{font-size:13px;color:var(--mute)}
.keys b{color:var(--text)}
.stat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;font-size:14px}
.stat span:nth-child(even){font-weight:800;font-variant-numeric:tabular-nums;text-align:right}

/* Lager */
.camp-scr{background:radial-gradient(130% 70% at 50% 0%,rgba(46,26,44,.6),rgba(10,7,12,.94) 62%);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 150px)}
.camp{max-width:1020px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.camp-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.camp-top h1{font-size:clamp(44px,11vw,76px)}
.back{display:inline-block;margin-bottom:2px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);text-decoration:none}
.back:hover{color:var(--gold)}
.gold-pill{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:1px solid rgba(229,180,84,.5);background:rgba(229,180,84,.08);font-weight:800;font-size:16px;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.gold-pill i{width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff2c0,#e5b454 45%,#8a6220)}
.picker{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pk{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px 8px;border-radius:12px;border:1px solid var(--line);background:#161118;min-width:0;transition:border-color .15s,background .15s}
.pk canvas{width:56px;height:56px}
.pk span{font-family:var(--fd);font-size:18px;line-height:1;white-space:nowrap}
.pk.on{border-color:var(--hc);box-shadow:0 0 0 1px var(--hc),0 0 18px color-mix(in srgb,var(--hc) 35%,transparent);background:#21182a}
.camp-main{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:820px){.camp-main{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}}
.stage-art{position:relative;border-radius:14px;overflow:hidden;border:1px solid color-mix(in srgb,var(--hc) 40%,var(--line));background:linear-gradient(180deg,#1d1422,#0f0a11)}
.stage-art canvas{display:block;width:100%;height:220px}
@media (min-width:820px){.stage-art canvas{height:360px}}
.stage-cap{position:absolute;right:14px;top:12px;text-align:right;pointer-events:none}
.stage-cap h2{font-size:clamp(34px,8vw,52px);color:var(--text);text-shadow:0 2px 0 #000}
.stage-cap .role{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--hc)}
.camp-panel{display:flex;flex-direction:column;gap:10px;min-width:0}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border-radius:12px;background:#120d14;border:1px solid var(--line)}
.seg button{position:relative;padding:9px 6px;border-radius:9px;border:0;background:transparent;font-weight:800;color:var(--mute)}
.seg button[aria-selected=true]{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px #4a3b4e}
.seg b{position:absolute;top:7px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.tabbody{display:flex;flex-direction:column;gap:10px}
.facts{display:grid;gap:8px}
.facts div{display:grid;gap:2px;padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.28);border:1px solid #2c232f;font-size:14px}
.facts span{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.startbar{position:fixed;left:0;right:0;bottom:0;z-index:31;padding-top:22px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(180deg,rgba(10,7,12,0) 0,rgba(10,7,12,.97) 24px)}
.startin{max-width:1020px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.startin .chips{flex:1 1 200px;flex-wrap:nowrap;overflow-x:auto;min-width:0}
.startin .chip{white-space:nowrap}
.startin .btn-main{flex:1 1 240px}

/* Inventar */
.equip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:640px){.equip{grid-template-columns:repeat(3,minmax(0,1fr))}.equip .it{aspect-ratio:auto;min-height:92px}}
.inv-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.inv-head h2 small{font-family:var(--fb);font-size:14px;color:var(--mute);font-weight:800;margin-left:10px}
.wrap.inv{gap:10px}
.wrap.has-sheet{padding-bottom:50vh}
.it .ico{width:34px;height:34px;flex:none}
.it.cmp{box-shadow:0 0 0 2px var(--good) inset}
.it[disabled]{cursor:default}
.sheet{position:fixed;z-index:32;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 12px);max-width:560px;margin:0 auto;max-height:50vh;overflow-y:auto;touch-action:pan-y;background:#1f1723;border:1px solid #5a4560;border-radius:16px;padding:14px 16px;box-shadow:0 -12px 40px rgba(0,0,0,.65);display:flex;flex-direction:column;gap:6px;animation:shin .16s ease-out}
@keyframes shin{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.sheet .x{position:absolute;top:8px;right:8px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:#120d14;font-size:20px;line-height:1}
.sh-head{display:flex;gap:10px;align-items:center;padding-right:40px}
.sh-head .ico{width:44px;height:44px;flex:none;border-radius:8px;background:rgba(0,0,0,.35)}
.sheet .in{font-family:var(--fd);font-size:24px;line-height:1.05}
.sheet ul{margin:0;padding-left:18px}
details.stats{border:1px solid var(--line);border-radius:10px;background:var(--panel)}
details.stats summary{cursor:pointer;font-weight:800;padding:10px 12px;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;font-size:12px}
details.stats .stat{padding:0 12px 12px}
.bag{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px}
.it{position:relative;aspect-ratio:1;gap:2px;max-width:100%;min-width:0;border-radius:8px;border:2px solid var(--r0);background:rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px;text-align:center;overflow:hidden}
.it .nm{font-size:10.5px;font-weight:700;line-height:1.12;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.it .sl{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.it .lv{position:absolute;left:4px;top:2px;font-size:10px;color:var(--mute);font-weight:800}
.it .ua{position:absolute;right:4px;top:1px;font-size:12px;color:var(--good);font-weight:800}
.it.empty{border-style:dashed;border-color:#3b3140}
.it.sel{box-shadow:0 0 0 2px #fff inset}
.r0{border-color:var(--r0)}.r1{border-color:var(--r1)}.r2{border-color:var(--r2)}.r3{border-color:var(--r3)}.r4{border-color:var(--r4);box-shadow:0 0 12px rgba(255,141,46,.35)}
.c0{color:var(--r0)}.c1{color:var(--r1)}.c2{color:var(--r2)}.c3{color:var(--r3)}.c4{color:var(--r4)}
.idet{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.idet .in{font-family:var(--fd);font-size:26px;line-height:1}
.idet ul{margin:0;padding-left:18px}
.good{color:var(--good)}.bad{color:var(--bad)}
.invgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:760px){.invgrid{grid-template-columns:minmax(0,1fr)}}

/* Talente */
.tree{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.br{display:flex;flex-direction:column;gap:8px;min-width:0}
.br h3{font-size:19px;text-align:center;color:var(--gold)}
.node{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px;border-radius:10px;border:1px solid var(--line);background:#19131c;min-width:0;position:relative}
.node .g{font-size:26px;line-height:1.1;font-family:'Segoe UI Symbol','Noto Sans Symbols 2','Noto Sans Symbols',var(--fb)}
.node.act .g{color:#ffd88a}
.node.pas .g{color:#a9d6ff}
.node .nn{font-size:12px;font-weight:800;line-height:1.15;text-align:center;overflow-wrap:anywhere}
.node .pp{font-size:10px;letter-spacing:2px;color:var(--gold)}
.node.locked{opacity:.4}
.node.can{border-color:var(--gold)}
.node.sel{box-shadow:0 0 0 2px #fff inset}
.node .tag{position:absolute;top:4px;left:6px;font-size:9px;font-weight:800;letter-spacing:.08em;color:var(--mute);text-transform:uppercase}
.tdet{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:12px}
.sp{font-weight:800;color:var(--gold)}

/* Ende / Kapitel */
.big-sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.big-sum div{background:rgba(0,0,0,.3);border:1px solid #2c232f;border-radius:10px;padding:10px 12px}
.big-sum b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.big-sum span{font-size:12px;color:var(--mute);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.unlock{border:1px solid var(--gold);background:rgba(229,180,84,.08);border-radius:10px;padding:12px;font-weight:800;color:var(--gold)}
.center{text-align:center;align-items:center}
@media (prefers-reduced-motion:reduce){.tm{animation-duration:3s}.bar i{transition:none}}
</style>

</head>
<body>
<canvas id="cv" aria-label="Spielfeld"></canvas>
<div id="hud" hidden>

function computeStats(eq){

  for(const a of it.aff){const v=a.v;switch(a.k){case'hp':s.hp+=v;break;case'dmg':s.dmgP+=v/100;break;case'rate':s.rateP+=v/100;break;case'crit':s.crit+=v/100;break;case'critd':s.critd+=v/100;break;case'armor':s.armor+=v;break;case'speed':s.speedP+=v/100;break;case'cdr':s.cdr+=v/100;break;case'ls':s.ls+=v/100;break;case'regen':s.regen+=v;break;case'area':s.area+=v/100;break;case'skill':s.skill+=v/100;break;case'gold':s.gold+=v/100;break}}}
 s.hpP+=0.06*(up.vit||0);s.dmgP+=0.06*(up.pow||0);s.rateP+=0.04*(up.agi||0);s.luck+=0.08*(up.luck||0);s.gold+=0.1*(up.luck||0);
 for(const n of H.tree){const r=P.ranks[n.id]||0;if(r&&n.mod)n.mod(s,r)}
 if(P.form==='bear'){const r=rank('e_bear')||1;s.dmgP+=0.3+0.08*r;s.armor+=20+5*r;s.hpP+=0.3;s.speedP+=0.08;s.rateP+=0.1}

 return{maxHp,dmg:(H.dmg+s.wdmg)*(1+0.055*(lv-1))*(1+s.dmgP),rate:s.rate*(1+s.rateP),speed:s.speed*(1+Math.min(s.speedP,0.6)),armor:s.armor,crit:Math.min(s.crit,0.75),critd:s.critd,cdr:Math.min(s.cdr,0.5),ls:s.ls,regen:s.regen+maxHp*s.regenP,area:s.area,skill:s.skill,gold:s.gold,luck:s.luck,range:s.range};
}

  if(p.team==='p'){query(p.x,p.y,p.r+60,e=>{if(p.dead||e.dead)return;if(p.hits&&p.hits.includes(e))return;const m=p.r+e.r;if(d2(p,e)<m*m){(p.hits||(p.hits=[])).push(e);dealDmg(e,p.dmg,{knock:p.knock,fx:p.x-p.vx,fy:p.y-p.vy,onHit:p.hit});if(p.pierce--<=0)p.dead=1;burst(p.x,p.y,p.c,2,80)}})}

function drawStage(){const c=stageCv;if(!c||!c.isConnected)return;const w=c.clientWidth,h=c.clientHeight;if(!w||!h)return;const pw=Math.round(w*DPR),ph=Math.round(h*DPR);if(c.width!==pw||c.height!==ph){c.width=pw;c.height=ph}
 const g=c.getContext('2d'),id=G.sel||'barradin',col=HCOL[id],t=(performance.now()-stageT0)/1000;g.setTransform(DPR,0,0,DPR,0,0);g.clearRect(0,0,w,h);
 const x0=w*0.4,gy=h*0.86,s=Math.min(3,h/74);
 const rg=g.createRadialGradient(x0,gy-20*s,4,x0,gy-20*s,Math.max(w,h)*0.62);rg.addColorStop(0,col+'50');rg.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=rg;g.fillRect(0,0,w,h);

 for(let i=0;i<26;i++){const q=(t*0.12+i/26)%1;const x=x0+Math.sin(i*12.9898)*w*0.48;g.globalAlpha=(1-q)*0.7;circ(g,x,gy-q*h*0.95,1+(i%3)*0.7,col)}g.globalAlpha=1;

 if(cyc>1.6&&cyc<2.0){const k=(cyc-1.6)/0.4;g.globalAlpha=1-k;g.strokeStyle=col;g.lineWidth=5;g.lineCap='round';g.beginPath();g.arc(hx-4*s,hy,22*s*(0.8+0.2*k),-0.9,0.9);g.stroke();g.globalAlpha=1}

document.addEventListener('click',ev=>{const b=ev.target.closest('[data-act]');if(!b||b.disabled)return;audioInit();const a=b.dataset.act;
 if(!/^(meta|inv-equip|inv-scrap|inv-scrapall|start|stage-go|next-stage|tree-learn)$/.test(a))sfx('ui');
 switch(a){
  case'sel-hero':G.sel=b.dataset.id;stageT0=performance.now();showTitle(true);break;
  case'diff':G.seldiff=+b.dataset.d;showTitle(true);break;
  case'tab':G.campTab=b.dataset.t;showTitle(true);break;
  case'meta':{const m=META.find(x=>x.id===b.dataset.id),hs=hsave(G.sel),r=hs.up[m.id]||0,c=metaCost(m,r);if(r<m.max&&SAVE.gold>=c){SAVE.gold-=c;hs.up[m.id]=r+1;persist();sfx('buy');showTitle(true)}break}
  case'start':startRun(G.sel,G.seldiff);break;
  case'stage-go':hideScreen();hud.hidden=false;G.state='play';G.paused=false;last=performance.now();if(G.stage===0&&G.kills===0)toast('Laufen – angreifen geht von allein!');break;
  case'next-stage':G.state='play';setupStage(G.stage+1);showStageIntro();break;
  case'between-inv':G.invSel=null;G.overlay='inv';renderInv();break;
  case'between-tree':G.overlay='tree';renderTree();break;
  case'open-inv':openOverlay('inv');break;
  case'open-tree':openOverlay('tree');break;
  case'open-pause':openOverlay('pause');break;
  case'close':if(G.state==='between'){G.overlay=null;showChapterDone()}else closeOverlay();break;
  case'auto':SAVE.auto=!SAVE.auto;persist();renderPause(true);break;
  case'sound':SAVE.sound=!SAVE.sound;persist();renderPause(true);break;
  case'giveup':$('giveup').innerHTML=`<div class="spread"><div class="t" style="font-weight:800">Wirklich aufgeben?</div><div class="row"><button class="btn" data-act="giveup-no">Nein</button><button class="btn" style="border-color:var(--blood)" data-act="giveup-yes">Ja, aufgeben</button></div></div>`;break;
  case'giveup-no':renderPause(true);break;
  case'giveup-yes':G.overlay=null;G.paused=false;G.state='play';endRun(false);break;
  case'to-camp':showTitle();break;
  case'inv-sel':G.invSel=G.invSel===b.dataset.k?null:b.dataset.k;renderInv(true);break;
  case'inv-desel':G.invSel=null;renderInv(true);break;
  case'inv-equip':{const i=+G.invSel.split(':')[1];equipFromBag(i);G.invSel=null;sfx('equip');renderInv(true);break}
  case'inv-scrap':{const i=+G.invSel.split(':')[1];const it=P.bag[i];if(it){const v=scrapValue(it);SAVE.gold+=v;G.goldRun+=v;P.bag.splice(i,1);sfx('scrap')}G.invSel=null;updateInvBadge();renderInv(true);break}
  case'inv-scrapall':{let v=0;P.bag=P.bag.filter(it=>{if(it.rar<4&&itemDelta(it)<=0.005){v+=scrapValue(it);return false}return true});SAVE.gold+=v;G.goldRun+=v;if(v){sfx('scrap');toast(`+${fmt(v)} Gold`,'#e5b454')}G.invSel=null;updateInvBadge();renderInv(true);break}
  case'inv-unequip':{const k=G.invSel.split(':')[1];if(P.eq[k]&&P.bag.length<24&&k!=='weapon'){P.bag.push(P.eq[k]);P.eq[k]=null;recalc();sfx('equip')}G.invSel=null;updateInvBadge();renderInv(true);break}
  case'tree-sel':G.treeSel=b.dataset.id;renderTree(true);break;
  case'tree-learn':{const n=P.hero.tree.find(x=>x.id===G.treeSel);if(n)learn(n);renderTree(true);break}
 }});
window.addEventListener('keydown',ev=>{if(ev.repeat&&!/^(Arrow|Key[WASD])/.test(ev.code))return;audioInit();
 if(G.state==='play'&&!G.paused){keys[ev.code]=true;if(/^Digit[1-6]$/.test(ev.code)){useSkill(+ev.code.slice(5)-1)}else if(ev.code==='KeyI')openOverlay('inv');else if(ev.code==='KeyT')openOverlay('tree');else if(ev.code==='Escape'||ev.code==='KeyP')openOverlay('pause');
  if(/^Arrow/.test(ev.code))ev.preventDefault()}
 else if(G.paused&&G.overlay==='inv'&&G.invSel&&ev.code==='Escape'){G.invSel=null;renderInv(true)}
 else if(G.paused&&(ev.code==='Escape'||(ev.code==='KeyI'&&G.overlay==='inv')||(ev.code==='KeyT'&&G.overlay==='tree')))closeOverlay()});
window.addEventListener('keyup',ev=>{keys[ev.code]=false});
cv.addEventListener('pointerdown',ev=>{audioInit();if(G.state!=='play'||G.paused)return;if(joy&&joy.on)return;joy={on:true,id:ev.pointerId,ox:ev.clientX,oy:ev.clientY,x:ev.clientX,y:ev.clientY};try{cv.setPointerCapture(ev.pointerId)}catch(e){}ev.preventDefault()});
cv.addEventListener('pointermove',ev=>{if(joy&&joy.on&&ev.pointerId===joy.id){joy.x=ev.clientX;joy.y=ev.clientY;const dx=joy.x-joy.ox,dy=joy.y-joy.oy,d=Math.hypot(dx,dy);if(d>90){joy.ox=joy.x-dx/d*90;joy.oy=joy.y-dy/d*90}}});
const endJoy=ev=>{if(joy&&ev.pointerId===joy.id)joy=null};cv.addEventListener('pointerup',endJoy);cv.addEventListener('pointercancel',endJoy);
document.addEventListener('visibilitychange',()=>{if(document.hidden){persist();if(G.state==='play'&&!G.paused)openOverlay('pause')}});
window.addEventListener('contextmenu',e=>e.preventDefault());

/* ================= Schleife ================= */
let last=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(0.05,(now-last)/1000);last=now;
 if(G.state==='play'&&!G.paused)update(dt);
 try{render(dt);if(G.state==='title'&&stageCv)drawStage()}catch(e){console.error(e)}
 hudUpdate()}
showTitle();requestAnimationFrame(frame);

/* interner Testzugang */
window.__hs={get G(){return G},get P(){return P},start(id,d){startRun(id,d||0);hideScreen();hud.hidden=false;G.state='play';G.paused=false},bot(on){G.bot=on},
 step(n,dt){for(let i=0;i<n;i++){if(G.state==='between'){if(G.stage<STAGES.length-1&&G.portal){setupStage(G.stage+1);G.state='play';hideScreen();hud.hidden=false}else if(!G.portal){hideScreen();hud.hidden=false;G.state='play'}}if(G.state!=='play')break;update(dt||1/30)}},render(){render(0.016);hudUpdate()},SAVE:()=>SAVE};
})();
</script>
