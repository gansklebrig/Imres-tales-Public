<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Heldensturm – das Roguelike zu Imres Tales: Barradin, Echo, Friedrich und Ezekiel kämpfen sich durch die ganze Kampagne.">
<meta name="theme-color" content="#100c12">
<meta property="og:title" content="Heldensturm">
<meta property="og:description" content="Das Roguelike zu Imres Tales: 13 Orte der Kampagne, Wetter und Tageszeiten, Wächter, Bosse, Beute und Talente – allein, zu viert am selben Bildschirm oder online.">
<meta property="og:image" content="https://imrestales.de/vorschau.jpg">
<style>[hidden]{display:none!important}body{margin:0}</style>
<title>Heldensturm</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=Alegreya+Sans:wght@400;500;700;800&display=swap">
<style>
/* Layout: Vollbild-Canvas als Spielwelt, darüber ein schlankes HUD und Pergament-dunkle Menüs. Eine einzige, bewusst dunkle Welt. */
:root{
  color-scheme:dark;
  --ink:#100c12;--panel:#1b151e;--panel2:#251d29;--line:#3d3140;--text:#f0e6d4;--mute:#a99a8b;
  --gold:#e5b454;--blood:#c23b3f;--moss:#6ea75f;--good:#7fd36a;--bad:#ff6b5e;
  --r0:#c4bcae;--r1:#62a8ff;--r2:#f2d24c;--r3:#bf7dff;--r4:#ff8d2e;
  --fd:'IM Fell English SC','Palatino Linotype',Palatino,Georgia,serif;
  --fb:'Alegreya Sans','Trebuchet MS',system-ui,sans-serif;
}
html,body{height:100%;background:var(--ink);color:var(--text);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--fb);font-size:15px;line-height:1.4;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#cv{position:fixed;inset:0;display:block;touch-action:none}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
.top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 8px);left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:minmax(0,250px) minmax(0,1fr) auto;gap:8px 12px;align-items:start}
.panel{background:rgba(16,12,18,.78);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
.hname{display:flex;align-items:baseline;gap:8px;font-weight:800;font-size:14px;margin-bottom:4px;white-space:nowrap;overflow:hidden}
.hname .nm{font-family:var(--fd);font-weight:400;font-size:20px;color:var(--gold);line-height:1}
.hname .lv{flex:none;min-width:22px;height:22px;padding:0 5px;border-radius:11px;background:#2a2030;border:1px solid var(--gold);color:var(--gold);font-weight:800;font-size:12px;line-height:20px;text-align:center;font-variant-numeric:tabular-nums}
.hname .fm{color:var(--moss);font-weight:800;font-size:12px}
@media (max-width:430px){.top>.panel:first-child{position:relative}.hname .nm{font-size:18px;min-width:0;overflow:hidden;text-overflow:ellipsis}.hname .lv{position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;line-height:18px;font-size:11px;box-shadow:0 1px 4px rgba(0,0,0,.6)}}
@media (max-width:380px){.hname{gap:4px}.hname .nm{font-size:16px}}
.bar{position:relative;height:14px;background:rgba(0,0,0,.55);border:1px solid #000;border-radius:3px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;transition:width .12s linear}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;text-shadow:0 1px 2px #000;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar.hp i{background:linear-gradient(#e0545a,#8f1f26)}
.bar.xp{height:6px;margin-top:4px}
.bar.xp i{background:linear-gradient(#8fe7ff,#3a8fb8)}
.bar.st{height:5px;margin-top:3px}
.bar.st i{background:linear-gradient(#e8f08a,#9ab83a)}
.bar.st.low i{background:linear-gradient(#ff9a6a,#b8503a)}
#util{position:absolute;right:calc(max(14px,env(safe-area-inset-right,0px)) + 272px);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-direction:column;gap:12px;pointer-events:none}
.ub{position:relative;width:62px;height:62px;border-radius:50%;border:2px solid #9ab8c8;background:radial-gradient(circle at 40% 35%,#34404a,#10141a 70%);pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 3px 10px rgba(0,0,0,.6)}
.ub .ic{font-size:26px;line-height:1;color:#e8f4ff}
.ub b{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;background:#c23b4f;color:#fff;font-size:12px;line-height:20px;border:1px solid #000}
.ub .key{position:absolute;left:-2px;bottom:-2px;width:20px;height:20px;border-radius:50%;background:#0d090f;border:1px solid var(--line);font-size:11px;font-weight:800;line-height:18px;color:var(--mute)}
.ub.on{border-color:#e8f08a;box-shadow:0 0 14px rgba(232,240,138,.55)}
.ub.off{opacity:.4}
#btnPot{border-color:#ff8a9a}
@media (hover:none){.ub .key{display:none}}
@media (max-width:420px){#util{right:calc(max(14px,env(safe-area-inset-right,0px)) + 262px)}.ub{width:56px;height:56px}}
.bar.prog i{background:linear-gradient(#f3cd73,#a7792a)}
.bar.prog.boss i{background:linear-gradient(#ff6b5e,#8f1f26)}
.stage{text-align:center}
.stage .sn{font-family:var(--fd);font-size:18px;line-height:1.05;color:var(--text);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage .sn small{font-family:var(--fb);color:var(--mute);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-right:6px}
.hbtns{display:flex;gap:6px;align-items:center;pointer-events:auto}
.gold{font-weight:800;color:var(--gold);font-variant-numeric:tabular-nums;font-size:14px;padding:0 4px;white-space:nowrap}
.hb{position:relative;height:44px;min-width:44px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:rgba(37,29,41,.92);font-weight:800;font-size:13px}
.hb b{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;background:var(--blood);color:#fff;font-size:11px;line-height:18px;border:1px solid #000}
.hb b:empty{display:none}
.hb.glow{border-color:var(--gold);box-shadow:0 0 12px rgba(229,180,84,.55)}
@media (max-width:700px){
  .top{grid-template-columns:minmax(0,1fr) auto}
  .stage{grid-column:1 / -1;order:3}
  .hb{height:42px;min-width:42px;padding:0 10px;font-size:13px}
  #toast{top:calc(env(safe-area-inset-top,0px) + 150px)}
}
#skills{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:262px;height:170px;pointer-events:none}
.sk{position:absolute;width:76px;height:76px;border-radius:50%;border:2px solid var(--gold);background:radial-gradient(circle at 40% 35%,#45344a,#160f18 70%);pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(0,0,0,.6);padding:0}
.sk .ic{font-size:32px;line-height:1;color:#fff3dc;font-family:'Segoe UI Symbol','Noto Sans Symbols 2','Noto Sans Symbols',var(--fb)}
.sk .cd{position:absolute;inset:0;border-radius:50%;pointer-events:none}
.sk .cdt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;text-shadow:0 1px 3px #000;font-variant-numeric:tabular-nums;pointer-events:none}
.sk .key{position:absolute;right:-2px;bottom:-2px;width:20px;height:20px;border-radius:50%;background:#0d090f;border:1px solid var(--line);font-size:11px;font-weight:800;line-height:18px;color:var(--mute)}
.sk.ready{border-color:#f7d988}
.sk.hold{transform:scale(1.1);box-shadow:0 0 18px rgba(247,217,136,.7)}
.node.rec{outline:2px dashed rgba(229,180,84,.55);outline-offset:3px}
.btn.hint{background:transparent;border-style:dashed;opacity:.75;font-size:12px;padding:6px 10px}
.lpcmp{position:fixed;z-index:60;pointer-events:none;max-width:min(78vw,300px);background:rgba(16,12,18,.96);border:1px solid var(--gold);border-radius:10px;padding:8px 10px;font-size:13px;box-shadow:0 6px 18px rgba(0,0,0,.6)}
.lpcmp b{display:block;margin-bottom:2px}
.tbrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tbrow label{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mute)}
.tbrow input[type=range]{width:120px}
.sk:active{transform:scale(.94)}
.sk.sil{opacity:.35;filter:grayscale(1)}
.runcard{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;border-radius:12px;border:1px solid rgba(229,180,84,.6);background:rgba(229,180,84,.08)}
.rc-t{font-weight:800}
.ortdots{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.ortdots i{width:9px;height:9px;border-radius:50%;background:#2c2430;border:1px solid #4a3b4e}
.ortdots i.done{background:var(--gold);border-color:var(--gold)}
.ortdots i.now{background:var(--blood);border-color:#ff9a8a;box-shadow:0 0 8px var(--blood)}
.stufe{font-family:var(--fd);font-size:26px;line-height:1.1;color:var(--text)}
.stufe span{display:block;font-family:var(--fb);font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
@media (hover:none){.sk .key{display:none}}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 112px);transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;z-index:15;width:min(92vw,520px)}
.tm{background:rgba(16,12,18,.88);border:1px solid var(--line);padding:6px 12px;border-radius:6px;font-weight:800;text-align:center;animation:tin 2.6s forwards}
@media (max-width:700px){#toast{top:calc(env(safe-area-inset-top,0px) + 150px)}}
#feed{position:fixed;left:max(10px,env(safe-area-inset-left,0px));top:46%;display:flex;flex-direction:column;align-items:flex-start;gap:4px;pointer-events:none;z-index:14;max-width:min(46vw,280px)}
.fm{font-size:12px;font-weight:700;line-height:1.3;background:rgba(16,12,18,.62);border-left:3px solid rgba(229,180,84,.8);padding:3px 9px 3px 7px;border-radius:4px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:fin 2.3s forwards}
@keyframes fin{0%{opacity:0;transform:translateX(-10px)}9%{opacity:1;transform:none}72%{opacity:.95}100%{opacity:0}}
@media (pointer:coarse){.tm{font-size:13px;padding:4px 10px}#toast{width:min(70vw,440px)}}
@keyframes tin{0%{opacity:0;transform:translateY(-6px)}8%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}

/* ---------- Menüs ---------- */
.screen{position:fixed;inset:0;z-index:30;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:rgba(10,7,12,.96);padding-block:calc(env(safe-area-inset-top,0px) + 18px) calc(env(safe-area-inset-bottom,0px) + 28px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen.see{background:linear-gradient(180deg,rgba(10,7,12,.45),rgba(10,7,12,.9) 40%)}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.wrap.narrow{max-width:720px}
h1,h2,h3{font-family:var(--fd);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:clamp(46px,10vw,84px);line-height:.95;letter-spacing:.01em;color:var(--gold);text-shadow:0 3px 0 #000,0 0 28px rgba(229,180,84,.25)}
h2{font-size:clamp(30px,6vw,42px);line-height:1;color:var(--gold)}
h3{font-size:22px;line-height:1.05;color:var(--text)}
.eyebrow{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.lead{color:#d6cab6;max-width:62ch;margin:0}
.muted{color:var(--mute)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.btn{background:var(--panel2);border:1px solid var(--line);padding:11px 16px;min-height:44px;border-radius:8px;font-weight:800}
.btn:hover{border-color:#5a4a5e}
.btn[disabled]{opacity:.45;cursor:default}
.btn.gold{border-color:var(--gold);color:var(--gold)}
.btn-main{font-family:var(--fd);font-size:30px;line-height:1;padding:14px 26px;border-radius:10px;background:linear-gradient(#c8434a,#7f1d24);border:1px solid var(--gold);color:#fff3df;box-shadow:0 4px 0 #3c0c10,0 8px 22px rgba(0,0,0,.5)}
.btn-main:active{transform:translateY(2px);box-shadow:0 2px 0 #3c0c10}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.goldline{font-weight:800;color:var(--gold);font-size:18px;font-variant-numeric:tabular-nums}
.heroes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:680px){.heroes{grid-template-columns:repeat(2,minmax(0,1fr))}}
.hero-card{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 8px 12px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(180deg,#221a26,#151017);text-align:center;min-width:0}
.hero-card canvas{width:96px;height:96px}
.hero-card .n{font-family:var(--fd);font-size:26px;line-height:1;color:var(--text)}
.hero-card .c{font-size:12px;color:var(--mute);font-weight:700}
.hero-card .rl{font-size:11px;color:var(--gold);font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin-top:4px}
.hero-card.on{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 22px rgba(229,180,84,.22);background:linear-gradient(180deg,#2e2330,#181219)}
.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px}
@media (max-width:760px){.detail{grid-template-columns:minmax(0,1fr)}}
.ups{display:flex;flex-direction:column;gap:8px}
.up{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;background:rgba(0,0,0,.25);border:1px solid #2c232f}
.up .t{font-weight:800}
.up .t small{color:var(--mute);font-weight:700;margin-left:6px}
.up .d{font-size:13px;color:var(--mute)}
.up .btn{padding:8px 10px;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-weight:800;font-size:13px}
.chip.on{border-color:var(--blood);background:#3a1418;color:#ffd9c8}
.chip[disabled]{opacity:.4;cursor:default}
.keys{font-size:13px;color:var(--mute)}
.keys b{color:var(--text)}
.stat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;font-size:14px}
.stat span:nth-child(even){font-weight:800;font-variant-numeric:tabular-nums;text-align:right}

/* Lager */
.camp-scr{background:radial-gradient(130% 70% at 50% 0%,rgba(46,26,44,.6),rgba(10,7,12,.94) 62%);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 210px)}
.camp{max-width:1020px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.camp-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.camp-top h1{font-size:clamp(44px,11vw,76px)}
.back{display:inline-block;margin-bottom:2px;font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);text-decoration:none}
.back:hover{color:var(--gold)}
.gold-pill{display:flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;border:1px solid rgba(229,180,84,.5);background:rgba(229,180,84,.08);font-weight:800;font-size:16px;color:var(--gold);font-variant-numeric:tabular-nums;white-space:nowrap}
.gold-pill i{width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff2c0,#e5b454 45%,#8a6220)}
.picker{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pk{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px 8px;border-radius:12px;border:1px solid var(--line);background:#161118;min-width:0;transition:border-color .15s,background .15s}
.pk canvas{width:56px;height:56px}
.pk span{font-family:var(--fd);font-size:18px;line-height:1;white-space:nowrap}
.pk.on{border-color:var(--hc);box-shadow:0 0 0 1px var(--hc),0 0 18px color-mix(in srgb,var(--hc) 35%,transparent);background:#21182a}
.camp-main{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:820px){.camp-main{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}}
.stage-art{position:relative;border-radius:14px;overflow:hidden;border:1px solid color-mix(in srgb,var(--hc) 40%,var(--line));background:linear-gradient(180deg,#1d1422,#0f0a11)}
.stage-art canvas{display:block;width:100%;height:220px}
@media (min-width:820px){.stage-art canvas{height:360px}}
.stage-cap{position:absolute;right:14px;top:12px;text-align:right;pointer-events:none}
.stage-cap h2{font-size:clamp(34px,8vw,52px);color:var(--text);text-shadow:0 2px 0 #000}
.stage-cap .role{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--hc)}
.camp-panel{display:flex;flex-direction:column;gap:10px;min-width:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:4px;padding:4px;border-radius:12px;background:#120d14;border:1px solid var(--line)}
.seg button{position:relative;padding:9px 6px;border-radius:9px;border:0;background:transparent;font-weight:800;color:var(--mute)}
.seg button[aria-selected=true]{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px #4a3b4e}
.mtabs{background:#120d14}
.mtabs button{padding:12px 6px;font-size:15px}
.seg b{position:absolute;top:7px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}
.tabbody{display:flex;flex-direction:column;gap:10px}
.facts{display:grid;gap:8px}
.hst{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.hst th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:4px 6px}
.hst td{padding:6px;border-top:1px solid #2c232f}
.hst tr.mein td{background:rgba(229,180,84,.12)}
.hsname{flex:1 1 160px;min-width:0;font:inherit;font-weight:700;padding:11px 12px;border-radius:8px;border:1px solid var(--line);background:#120d14;color:var(--text)}
.facts div{display:grid;gap:2px;padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.28);border:1px solid #2c232f;font-size:14px}
.facts span{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.startbar{position:fixed;left:0;right:0;bottom:0;z-index:31;padding-top:22px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(180deg,rgba(10,7,12,0) 0,#0a070c 22px)}
.startin{max-width:1020px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.startin .chips{flex:1 1 200px;flex-wrap:wrap;min-width:0}
.startin .chip{white-space:nowrap}
.startin .btn-main{flex:1 1 240px}

/* Inventar */
.equip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:640px){.equip{grid-template-columns:repeat(3,minmax(0,1fr))}.equip .it{aspect-ratio:auto;min-height:92px}}
.inv-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.inv-head h2 small{font-family:var(--fb);font-size:14px;color:var(--mute);font-weight:800;margin-left:10px}
.wrap.inv{gap:10px}
.wrap.has-sheet{padding-bottom:50vh}
.it .ico{width:34px;height:34px;flex:none}
.it.cmp{box-shadow:0 0 0 2px var(--good) inset}
.it[disabled]{cursor:default}

function akkLage(lo,hi){let H=null;try{H=SAVE.music&&MUSIK.harmonie()}catch(e){}const a=H?H.akk:[62,65,69];const out=[];for(const m0 of a){let m=m0;while(m<lo)m+=12;while(m>=lo+12)m-=12;out.push(m)}out.sort((x,y)=>x-y);const L=out.concat(out.map(m=>m+12)).filter(m=>m<=hi);return{L,grund:(H?H.grund:62)}}

function makeItem(slot,il,rar,heroId){
 const it={id:ITEMID++,slot,ilvl:il,rar,aff:[]};const m=RARB[rar];
 if(slot==='weapon'||slot==='ranged'){const w=pick(slot==='ranged'?HEROES[heroId].rangedW:HEROES[heroId].meleeW);it.base=w.n;it.wdmg=Math.max(2,Math.round((3+il*1.6)*w.d*rnd(0.9,1.1)*m));it.wrate=w.r;

  if(slot==='armor'){it.armor=Math.round((4+il*1.8)*rnd(0.9,1.1)*m);it.hp=Math.round((8+il*3)*rnd(0.9,1.1)*m)}

 let n=[slot==='ring'?1:0,ri(1,2),3,4,5,4][rar];const pool=SLOTAFF[slot].slice();
 const vm=[1,1,1.05,1.15,1.3,1.2][rar];
 while(n-->0&&pool.length){const k=pool.splice(Math.floor(Math.random()*pool.length),1)[0];let v=AFF[k].roll(il)*vm;v=(k==='ls'||k==='regen')?Math.round(v*10)/10:Math.round(v);it.aff.push({k,v})}
 if(rar===4){const L=slot==='weapon'?LEGEND.weapon[heroId]:slot==='ranged'?LEGEND.ranged[heroId]:LEGEND[slot];it.name=pick(L);it.pow=POWNAME[it.name]||pick(['d20','phiole','uralt','demohaut','fledermaus','blase','kraeuter','giftzahn','blutdurst','banner','schildwall','retter'])}
 else if(rar===0)it.name=it.base;else it.name=it.base+' '+pick(SUFFIX);
 if(rar>=2&&rar<5&&Math.random()<(rar>=4?0.5:0.2))it.sock=[null];

let GRID=new Map();const CELL=64;
function buildGrid(){GRID=new Map();for(const e of G.enemies){if(e.dead)continue;const k=((e.x/CELL|0)+64)*4096+((e.y/CELL|0)+64);let a=GRID.get(k);if(!a){a=[];GRID.set(k,a)}a.push(e)}}
function query(x,y,r,fn){const x0=Math.floor((x-r)/CELL),x1=Math.floor((x+r)/CELL),y0=Math.floor((y-r)/CELL),y1=Math.floor((y+r)/CELL);for(let i=x0;i<=x1;i++)for(let j=y0;j<=y1;j++){const a=GRID.get((i+64)*4096+(j+64));if(a)for(const e of a)if(!e.dead)fn(e)}}
const targetable=e=>!e.dead&&!(e.flying&&e.flyHigh>0.4);
function nearest(x,y,R){let b=null,bd=R*R;for(const e of G.enemies){if(!targetable(e))continue;const dx=e.x-x,dy=e.y-y,dd=dx*dx+dy*dy-e.r*e.r;if(dd<bd){bd=dd;b=e}}return b}
function nearestTo(p,R){return nearest(p.x,p.y,R)}
function strongest(x,y,R){let b=null,bv=-1;for(const e of G.enemies){if(!targetable(e))continue;if(d2(e,{x,y})>R*R)continue;const v=e.hp+(e.boss?1e9:0)+(e.guard?1e8:0)+(e.elite?1e6:0);if(v>bv){bv=v;b=e}}return b}
function randomEnemy(x,y,R){const a=[];for(const e of G.enemies)if(targetable(e)&&d2(e,{x,y})<R*R)a.push(e);return a.length?pick(a):null}
function targetsNear(R,n){const c=mouseAim()?cursorW():P,a=padA();const L=[];for(const e of G.enemies)if(targetable(e)&&d2(e,P)<R*R)L.push(e);
 const sc=e=>{let v=a!=null?(()=>{let da=Math.atan2(e.y-P.y,e.x-P.x)-a;return Math.abs(Math.atan2(Math.sin(da),Math.cos(da)))*300})()+Math.sqrt(d2(e,P))*0.3:Math.sqrt(d2(e,c));return v-ePrio(e)*8};
 L.sort((x,y)=>sc(x)-sc(y));return L.slice(0,n)}

const CLOUD={busy:false,last:0,err:null,ok:0,tm:null,chk:0,pend:null};
function cloudCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const r=new Uint32Array(12);(window.crypto||{getRandomValues:a=>{for(let i=0;i<a.length;i++)a[i]=Math.floor(MATHRND()*4e9)}}).getRandomValues(r);let s='';for(let i=0;i<12;i++){s+=A[r[i]%A.length];if(i===3||i===7)s+='-'}return s}
/* Kein blindes Überschreiben: SAVE.cloudRev = savedAt der Cloud-Fassung, auf der dieser Stand aufbaut.
   Vor jedem Hochladen wird nachgesehen; hat ein anderes Gerät inzwischen gesichert, wird gefragt (übernehmen oder meinen behalten).
   force===true lädt ohne Nachsehen hoch (gerade geprüft oder bewusst „Meinen behalten“). */
function cloudSave(force){const code=SAVE.cloud;if(!code||CLOUD.busy)return Promise.resolve();if(CLOUD.pend&&force!==true)return Promise.resolve();
 if(!force&&SAVE.cloudRev!==undefined&&SAVE.savedAt===SAVE.cloudRev&&!CLOUD.err)return Promise.resolve();
 CLOUD.busy=true;CLOUD.last=Date.now();
 return(force===true?Promise.resolve(true):hsServer('/rest/v1/rpc/hs_laden',{p_code:code}).then(d=>{CLOUD.chk=Date.now();return cloudCheck(d)})).then(go=>{if(!go||SAVE.cloud!==code)return;const rev=SAVE.cloudRev;SAVE.cloudRev=SAVE.savedAt;
  return hsServer('/rest/v1/rpc/hs_speichern',{p_code:code,p_daten:SAVE}).then(()=>{CLOUD.err=null;CLOUD.ok=Date.now();persist()},e=>{SAVE.cloudRev=rev;throw e})}).catch(e=>{CLOUD.err=e||{status:0}}).then(()=>{CLOUD.busy=false;const el=$('cloudBox');if(el)el.innerHTML=cloudInner()})}
/* höchstens etwa einmal pro Minute automatisch (der Server erlaubt 120 Sicherungen und 120 Abrufe pro Stunde) */
function cloudSoon(){if(!SAVE.cloud)return;clearTimeout(CLOUD.tm);CLOUD.tm=setTimeout(cloudSave,Math.max(12000,60000-(Date.now()-CLOUD.last)))}
/* true = hochladen erlaubt; sonst wurde übernommen oder gefragt */
function cloudCheck(d){if(!isObj(d)||!isObj(d.heroes))return true;const ca=+d.savedAt||0,rev=SAVE.cloudRev;
 if(ca===rev||ca===SAVE.savedAt||rev===undefined&&ca<=(SAVE.savedAt||0)+2000)return true;
 const dirty=rev!==undefined&&SAVE.savedAt!==rev;
 if(!dirty&&G.state==='title'&&!G.mp){if(cloudAdopt(d,SAVE.cloud)){toast('Spielstand aus der Cloud übernommen.','#8fe7ff');showTitle(true)}return false}
 cloudAsk(d);return false}
function cloudAsk(d){CLOUD.pend=d;if(G.state!=='title'||G.mp)return;/* mitten im Lauf erst im Titel fragen */
 if(SAVE.cloudRev!==undefined&&SAVE.savedAt===SAVE.cloudRev){CLOUD.pend=null;if(cloudAdopt(d,SAVE.cloud)){toast('Spielstand aus der Cloud übernommen.','#8fe7ff');showTitle(true)}return}
 let w=$('cloudAsk');if(w)w.remove();w=document.createElement('div');w.id='cloudAsk';w.setAttribute('role','dialog');w.setAttribute('aria-modal','true');
 w.style.cssText='position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(8,6,10,.82)';
 const t=x=>x?new Date(x).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+' Uhr':'unbekannt';
 const sum=S=>{const h=S.heroes||{};let r=0;for(const k in h)r+=+(h[k]&&h[k].runs)||0;return`${fmt(+S.gold||0)} Gold · ${r} Läufe${S.run?' · laufendes Abenteuer':''}`};
 w.innerHTML=`<div class="card" style="max-width:420px;width:100%;display:flex;flex-direction:column;gap:10px;background:#1c1620;border:1px solid #6a5a3a;border-radius:14px;padding:16px"><b style="font-size:17px">Neuerer Spielstand auf anderem Gerät – übernehmen?</b>
  <p class="muted" style="margin:0;font-size:14px">Anderes Gerät (gesichert ${esc(t(d.savedAt))}):<br><b>${esc(sum(d))}</b></p><p class="muted" style="margin:0;font-size:14px">Dieses Gerät (${esc(t(SAVE.savedAt))}):<br><b>${esc(sum(SAVE))}</b></p>
  <div class="row" style="gap:8px;flex-wrap:wrap"><button class="btn gold" data-ca="take" style="min-height:44px">Übernehmen</button><button class="btn" data-ca="keep" style="min-height:44px">Meinen behalten</button></div></div>`;
 w.addEventListener('click',ev=>{const b=ev.target.closest('[data-ca]');if(!b)return;ev.stopPropagation();w.remove();const dd=CLOUD.pend;CLOUD.pend=null;if(!dd)return;
  if(b.dataset.ca==='take'){if(G.state==='title'&&cloudAdopt(dd,SAVE.cloud)){toast('Spielstand vom anderen Gerät übernommen.','#8fe7ff');showTitle(true)}}
  else{SAVE.savedAt=Math.max(Date.now(),(+dd.savedAt||0)+1);persist();cloudSave(true)}});
 document.body.appendChild(w);const f=w.querySelector('button');if(f)f.focus()}
function cloudAdopt(d,code){if(!d||typeof d!=='object'||!d.heroes)return false;SAVE=saveFix(Object.assign(defSave(),d));runFix(SAVE);SAVE.cloud=code;BESTB=null;SAVE.cloudRev=SAVE.savedAt||0;CLOUD.pend=null;try{const s=JSON.stringify(SAVE);localStorage.setItem(SKEY,s);STRAW=s;SBASE=s}catch(e){}return true}

function cloudInner(){const c=SAVE.cloud;
 if(!c)return`<p class="muted" style="margin:0">Sichere deinen Spielstand online, dann kannst du am Handy und am PC mit demselben Fortschritt spielen. Du bekommst einen geheimen Code – wer ihn kennt, kann den Spielstand laden.</p>

function cloudAct(a){

  const full=code.slice(0,4)+'-'+code.slice(4,8)+'-'+code.slice(8,12);const m=$('cloudMsg');if(m)m.innerHTML='<p class="muted">Lade …</p>';
  hsServer('/rest/v1/rpc/hs_laden',{p_code:full}).then(d=>{if(cloudAdopt(d,full)){toast('Spielstand geladen!','#8fe7ff');showTitle(true)}else if(m)m.innerHTML='<p class="bad">Zu diesem Code gibt es keinen Spielstand.</p>'}).catch(()=>{if(m)m.innerHTML='<p class="bad">Der Server ist noch nicht eingerichtet oder nicht erreichbar.</p>'});return}

 Object.assign(P,{level:Math.max(r.level||1,lv0),xp:r.xp||0,sp:(r.sp||0)+Math.max(0,lv0-(r.level||1))+Math.max(0,(P.up.wis||0)-(r.wis||0)),ranks:rlClone(r.ranks||P.ranks),learn:(r.learn||P.learn).slice(),bar:(r.bar||r.learn||P.bar).slice(),eq:rlClone(r.eq||P.eq),bag:rlClone(r.bag||[]),gems:rlClone(r.gems||{})});

function fireStats(){const os=G.ortS;if(!os)return'';const L=[];const k=Math.max(0,(G.kills||0)-os.k0),g=Math.max(0,(G.goldRun||0)-os.g0);
 L.push(`<b>${fmt(k)}</b> Gegner besiegt`);if(g)L.push(`<b>${fmt(g)}</b> Gold`);if(os.best>0)L.push(`stärkster Treffer <b>${fmt(Math.round(os.best))}</b>${G.mp&&os.by&&HEROES[os.by]?' ('+esc(HEROES[os.by].name)+')':''}`);
 let mvp='';if(G.mp){const E=Object.entries(os.dmg).sort((a,b)=>b[1]-a[1]),sum=E.reduce((a,x)=>a+x[1],0);if(E.length>1&&sum>0&&HEROES[E[0][0]])mvp=`<p class="fire-mvp">Held des Ortes: <b style="color:${HCOL[E[0][0]]||'#e5b454'}">${esc(HEROES[E[0][0]].name)}</b> · ${Math.round(E[0][1]/sum*100)}% des Schadens</p>`}
 return`<p class="fire-stats">${L.join(' · ')}</p>${mvp}`}
function showCampfire(){hud.hidden=true;clearHudFx();const S=STAGES[G.stage],N=STAGES[G.stage+1],O=ORTE[S.ort];G.fireOn=1;try{MUSIK.setzen('kamin',3)}catch(e){}
 const ids=(G.mp?PL:[P]).filter(Boolean).map(q=>q.id).filter(id=>HEROES[id]).slice(0,4),rex=ids.includes('friedrich')?1:0;
 const neu=lagerNeu(true),imre=FIRE_IMRE[S.ort]||'Das Feuer knistert. Für einen Moment ist alles gut.';
 const nx=N&&ORTE[N.ort],tz=nx?(String(nx.story||'').match(/^[^]*?[.!?…](?=\s|$)/)||[String(nx.story||'')])[0]:'';

  ${nx?`<p class="muted fire-next">Als Nächstes: <b style="color:var(--text)">${esc(nx.name)}</b>${tz?' – '+esc(tz):''}</p>`:''}

/* ---------- Lager auf dem Titelbildschirm ---------- */
const todayKey=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
function showLager(sel){G.lagerOn=1;const L=lagerS(),npcs=lagerNpcs(),neu=lagerNeu(true);const id=G.sel||'barradin';G.lagerSel=sel||G.lagerSel||null;

function fireFlame(c,x,y,t,s){const f=(a,b)=>Math.sin(t*a+b);ell(c,x,y+4*s,46*s,11*s,'rgba(0,0,0,.35)');
 c.save();c.translate(x,y);c.fillStyle='#4a2e18';c.rotate(0.35);c.fillRect(-30*s,-4*s,60*s,9*s);c.rotate(-0.7);c.fillRect(-30*s,-4*s,60*s,9*s);c.restore();
 const L=[['rgba(255,90,20,.85)',30,58],['rgba(255,170,40,.9)',21,44],['rgba(255,240,170,.95)',11,26]];
 for(const [col,w,h] of L){const hh=h*s*(1+0.12*f(9,0)+0.08*f(13,1)),ww=w*s*(1+0.08*f(7,2)),sw=6*s*f(5,w);c.fillStyle=col;c.beginPath();c.moveTo(x-ww,y);c.quadraticCurveTo(x-ww*0.9,y-hh*0.55,x+sw,y-hh);c.quadraticCurveTo(x+ww*0.9,y-hh*0.55,x+ww,y);c.closePath();c.fill()}}
function fireGlow(c,x,y,r,t){const k=1+0.06*Math.sin(t*11)+0.04*Math.sin(t*17);const g=c.createRadialGradient(x,y,4,x,y,r*k);g.addColorStop(0,'rgba(255,170,70,.45)');g.addColorStop(0.5,'rgba(255,120,40,.14)');g.addColorStop(1,'rgba(255,120,40,0)');c.fillStyle=g;c.fillRect(x-r*1.2,y-r*1.2,r*2.4,r*2.4)}
function fireSparks(cv,c,x,y,t,dt,s){const P_=cv._sp||(cv._sp=[]);if(P_.length<34&&Math.random()<dt*22)P_.push({x:x+(Math.random()-0.5)*20*s,y:y-20*s,vx:(Math.random()-0.5)*20,vy:-40-Math.random()*50,l:0,L:1+Math.random()*1.4});
 for(let i=P_.length-1;i>=0;i--){const p=P_[i];p.l+=dt;if(p.l>p.L){P_.splice(i,1);continue}p.x+=(p.vx+Math.sin(t*3+i)*12)*dt;p.y+=p.vy*dt*s;c.globalAlpha=Math.max(0,1-p.l/p.L);c.fillStyle=i%3?'#ffcf6a':'#ff8a3a';c.fillRect(p.x,p.y,2*s,2*s)}c.globalAlpha=1}
function fireSky(cv,c,W,H,t){const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0b0d1c');g.addColorStop(0.65,'#16131a');g.addColorStop(1,'#1d1712');c.fillStyle=g;c.fillRect(0,0,W,H);
 const st=cv._st||(cv._st=Array.from({length:26},()=>[Math.random(),Math.random()*0.5,Math.random()*6]));for(const [a,b,p] of st){c.globalAlpha=0.35+0.35*Math.sin(t*1.5+p);c.fillStyle='#dfe6ff';c.fillRect(a*W,b*H,1.5,1.5)}c.globalAlpha=1;
 ell(c,W/2,H*0.86,W*0.48,H*0.16,'#241b13')}

const legS=id=>{const h=hsave(id);if(!h.leg||typeof h.leg!=='object')h.leg={lv:0,xp:0,pts:{}};if(!h.leg.pts)h.leg.pts={};return h.leg};

function legMsAt(n){let t=0;for(let i=0;i<n;i++){const k=LEGMS[i%4].k;if(k==='trank'){if(t>=3&&i===n-1)return LEGMS[1];t++}}return LEGMS[(n-1)%4]}

function makeAnc(it,lv){if(!it||it.anc)return it;it.anc=lv;const f=lv===2?1.5:1.3,g=lv===2?1.4:1.25;
 if(it.wdmg)it.wdmg=Math.round(it.wdmg*f);if(it.armor)it.armor=Math.round(it.armor*f);if(it.hp)it.hp=Math.round(it.hp*f);
 for(const a of it.aff||[]){if(a.imp)continue;if(a.k==='ls'||a.k==='regen')a.v=Math.round(a.v*g*10)/10;else if(a.k==='speed'||a.k==='cdr')a.v=Math.round(a.v*(lv===2?1.25:1.12));else a.v=Math.round(a.v*g)}
 if(lv===2){const pool=(SLOTAFF[it.slot]||SLOTAFF.ring).filter(k=>!(it.aff||[]).some(x=>x.k===k));if(pool.length){const k=pick(pool);let v=AFF[k].roll(it.ilvl)*1.4;v=(k==='ls'||k==='regen')?Math.round(v*10)/10:Math.round(v);it.aff.push({k,v})}
  it.sock=Array.isArray(it.sock)?it.sock:[];if(it.sock.length<maxSock(it))it.sock.push(null)}

 for(const q of L){const v=V.get(q),key=v.song+'|'+v.bark+'|'+v.bund;if(key!==(q.auraK||'0|0|0')){q.aura=v;q.auraK=key;withP(q,recalc)}else if(q.aura)q.aura.src=v.src}}

 for(const q of (only?[only]:mpL())){if(netIs(q.dev))continue;withP(q,()=>{const take=[];const kp=P.bag.filter(it=>{if((otherHeroItem(it)||(!G.rl&&it.fav))&&T.length+take.length<TRUHE_MAX){take.push(it);return false}if(otherHeroItem(it)||(!G.rl&&it.fav))full++;return true});P.bag.length=0;P.bag.push(...kp);

const RUHM=[{id:'macht',n:'Macht',d:v=>`+${v}% Schaden`},{id:'zaeh',n:'Zähigkeit',d:v=>`+${v}% Leben`},{id:'flink',n:'Flinkheit',d:v=>`+${f1(v*0.5)}% Angriffs- und Bewegungstempo`},{id:'glueck',n:'Fortuna',d:v=>`+${v}% Gold und bessere Beute`}];
const RUHM_MAX=50;
function ruhmS(){return SAVE.ruhm||(SAVE.ruhm={xp:0,lv:0,pts:{}})}
const ruhmOn=()=>Object.values(SAVE.heroes).some(h=>h.clears>0);
const ruhmNeed=l=>Math.round(400*Math.pow(1.08,l));
const ruhmFree=()=>{const R=ruhmS();let u=0;for(const k in R.pts)u+=R.pts[k];return R.lv-u};
function ruhmXp(v){if(G.bot||!ruhmOn()||G.mode==='taeglich')return;const R=ruhmS();R.xp+=v*0.35;let up=0;while(R.xp>=ruhmNeed(R.lv)){R.xp-=ruhmNeed(R.lv);R.lv++;up++}if(up)toast(`Ruhm-Stufe ${R.lv}! Ein Ruhmespunkt wartet im Lager.`,'#ffd04a')}

 const b=bestBonus().v;s.dmgP+=b;s.hpP+=b}
function ruhmHtml(){if(!ruhmOn())return`<div class="card"><div class="eyebrow">Ruhm</div><p class="muted" style="margin:0">Wird freigeschaltet, sobald ein Held die Kampagne beendet hat. Danach bringt jede Erfahrung auch Ruhm – dauerhaft und für alle Helden.</p></div>`;
 const R=ruhmS(),free=ruhmFree();
 return`<div class="card"><div class="spread"><div class="eyebrow">Ruhm · Stufe ${R.lv}</div><span class="${free?'good':'muted'}" style="font-weight:800">${free} Punkt${free===1?'':'e'} frei</span></div>
